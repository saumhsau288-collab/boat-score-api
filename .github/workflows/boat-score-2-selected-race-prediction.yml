name: Boat Score 2 selected race provisional prediction
on:
  workflow_dispatch:
    inputs:
      race_date:
        description: 'Race date YYYYMMDD'
        required: true
        default: '20261119'
      venue_code:
        description: 'Venue 1-24 (e.g. 18 Tokuyama)'
        required: true
        default: '18'
      race_number:
        description: 'Race 1-12'
        required: true
        default: '1'
permissions:
  contents: read
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-racer-start-course-20261119
          persist-credentials: false
      - name: Validate inputs and predict with official racelist
        env:
          RACE_DATE: ${{ inputs.race_date }}
          VENUE_CODE: ${{ inputs.venue_code }}
          RACE_NUMBER: ${{ inputs.race_number }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {predictSelectedRace} from './scripts/predict-selected-boat-race.mjs';
          const date=process.env.RACE_DATE,venue=Number(process.env.VENUE_CODE),race=Number(process.env.RACE_NUMBER);
          const result=await predictSelectedRace({date,venue,race});
          fs.mkdirSync('selected-race-output',{recursive:true});
          fs.writeFileSync('selected-race-output/prediction.json',JSON.stringify(result,null,2)+'\n');
          const summary=[
            '# Boat Score 2 選択レース検証',
            `対象: ${date} / 開催場 ${venue} / ${race}R`,
            `取得結果: ${result.status==='experimental'?'暫定予想を作成': '予想保留（'+result.status+'）'}`,
            `進入: ${result.entryScenario??'未確認'}`,
            `公式ページ: ${result.provenance?.officialUrl??'未取得'}`,
            `取得時刻: ${result.provenance?.fetchedAt??'未取得'}`,
            `取得HTML SHA-256: ${result.provenance?.htmlSha256??'未取得'}`,
            `本命: ${result.main?.length??0}点 / 穴: ${result.upset?.length??0}点`,
            `艇番・選手対応: ${result.status==='boat_mapping_unverified'?'未確認':result.status==='experimental'?'解析済み':'未判定'}`,
            `解析診断: ${result.diagnostics?JSON.stringify(result.diagnostics):'該当なし'}`,
            result.message??result.inputCaveat??'',
            '',
            '※暫定シナリオであり、直前情報・進入の確認済み予想ではありません。'
          ].join('\n');
          const ticketText=arr=>Array.isArray(arr)?arr.map((x,i)=>`${i+1}. ${typeof x==='string'?x:JSON.stringify(x)}`).join('\n'):'なし';
          const ticketSection=result.status==='experimental'?[
            '', '## 本命候補（暫定）', ticketText(result.main),
            '', '## 穴候補（暫定）', ticketText(result.upset)
          ].join('\n') :'\n予想候補は保留しました。';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+'\n'+ticketSection+'\n');
          console.log(JSON.stringify({status:result.status,date,venue,race,main:result.main?.length??0,upset:result.upset?.length??0,entryScenario:result.entryScenario??null}));
          if(result.status!=='experimental')process.exitCode=1;
          JS
      - name: Upload result for review even if fetch failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-race-prediction
          path: selected-race-output/
          if-no-files-found: warn
