name: Historical adjacent podium descriptive report
on:
  pull_request:
    paths:
      - 'scripts/audit-second-third-ability-order.mjs'
      - 'scripts/test-audit-second-third-ability-order.mjs'
      - 'scripts/audit-daily-triple-coverage.mjs'
      - 'scripts/test-audit-daily-triple-coverage.mjs'
      - 'scripts/evaluate-ordered-triple-coverage.mjs'
      - 'scripts/test-evaluate-ordered-triple-coverage.mjs'
      - 'scripts/evaluate-ordered-triples.mjs'
      - 'scripts/test-evaluate-ordered-triples.mjs'
      - 'scripts/audit-conditional-finish-order.mjs'
      - 'scripts/test-audit-conditional-finish-order.mjs'
      - 'scripts/audit-holdout-winner-confusion.mjs'
      - 'scripts/test-audit-holdout-winner-confusion.mjs'
      - 'scripts/audit-holdout-order-by-winner.mjs'
      - 'scripts/test-audit-holdout-order-by-winner.mjs'
      - 'scripts/assess-archive-promotion.mjs'
      - 'scripts/test-assess-archive-promotion.mjs'
      - 'scripts/evaluate-two-stage-archive.mjs'
      - 'scripts/test-evaluate-two-stage-archive.mjs'
      - 'scripts/evaluate-chronological-heuristics.mjs'
      - 'scripts/test-evaluate-chronological-heuristics.mjs'
      - 'scripts/validate-prospective-snapshot.mjs'
      - 'scripts/test-validate-prospective-snapshot.mjs'
      - 'scripts/audit-prospective-readiness.mjs'
      - 'scripts/test-audit-prospective-readiness.mjs'
      - 'scripts/audit-daily-ability-rank.mjs'
      - 'scripts/test-audit-daily-ability-rank.mjs'
      - 'scripts/audit-between-by-rank.mjs'
      - 'scripts/test-audit-between-by-rank.mjs'
      - 'scripts/audit-between-vs-not-between.mjs'
      - 'scripts/test-audit-between-vs-not-between.mjs'
      - 'scripts/audit-intervening-frame-baseline.mjs'
      - 'scripts/test-audit-intervening-frame-baseline.mjs'
      - 'scripts/audit-intervening-by-boat.mjs'
      - 'scripts/test-audit-intervening-by-boat.mjs'
      - 'scripts/audit-intervening-candidates.mjs'
      - 'scripts/test-audit-intervening-candidates.mjs'
      - 'scripts/audit-gap-strata.mjs'
      - 'scripts/test-audit-gap-strata.mjs'
      - 'scripts/audit-separated-top-two.mjs'
      - 'scripts/test-audit-separated-top-two.mjs'
      - 'scripts/audit-archived-ability-placement.mjs'
      - 'scripts/test-audit-archived-ability-placement.mjs'
      - 'scripts/audit-top-three-sandwich.mjs'
      - 'scripts/test-audit-top-three-sandwich.mjs'
      - 'scripts/audit-finish-order-pairs.mjs'
      - 'scripts/test-audit-finish-order-pairs.mjs'
      - 'scripts/audit-archived-adjacency.mjs'
      - 'scripts/test-audit-archived-adjacency.mjs'
      - '.github/workflows/historical-adjacent-podium-report.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-adjacency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run archive parser tests
        run: node --test scripts/test-audit-archived-adjacency.mjs scripts/test-audit-finish-order-pairs.mjs scripts/test-audit-top-three-sandwich.mjs scripts/test-audit-archived-ability-placement.mjs scripts/test-audit-separated-top-two.mjs scripts/test-audit-gap-strata.mjs scripts/test-audit-intervening-candidates.mjs scripts/test-audit-intervening-by-boat.mjs scripts/test-audit-intervening-frame-baseline.mjs scripts/test-audit-between-vs-not-between.mjs scripts/test-audit-between-by-rank.mjs scripts/test-audit-daily-ability-rank.mjs scripts/test-audit-prospective-readiness.mjs scripts/test-validate-prospective-snapshot.mjs scripts/test-evaluate-chronological-heuristics.mjs scripts/test-evaluate-two-stage-archive.mjs scripts/test-assess-archive-promotion.mjs scripts/test-audit-holdout-order-by-winner.mjs scripts/test-audit-holdout-winner-confusion.mjs scripts/test-audit-conditional-finish-order.mjs scripts/test-evaluate-ordered-triples.mjs scripts/test-evaluate-ordered-triple-coverage.mjs scripts/test-audit-daily-triple-coverage.mjs scripts/test-audit-second-third-ability-order.mjs
      - name: Fetch isolated immutable historical archive (read-only)
        run: |
          git fetch --depth=1 origin historical-research-data
          mkdir -p /tmp/boat-score-verified-daily
          git archive FETCH_HEAD verified-daily | tar -xf - -C /tmp/boat-score-verified-daily
      - name: Audit real official historical results
        run: |
          node scripts/audit-archived-adjacency.mjs /tmp/boat-score-verified-daily/verified-daily reports/historical-adjacent-podium.json
      - name: Summarize historical descriptive evidence
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync("reports/historical-adjacent-podium.json","utf8"));
            const rows=["## Verified historical finish-order adjacency (descriptive only)","","Archive days: "+r.archiveDays+"; eligible races: "+r.eligible+"; excluded: "+r.excluded,"","| Winner | Races | Adjacent 2nd/3rd | Rate | Uniform baseline |","|---|---:|---:|---:|---:|"];
            for(const [boat,x] of Object.entries(r.byWinningBoat))rows.push("| "+boat+" | "+x.races+" | "+x.neighborPodium+" | "+(x.neighborPodiumRate===null?"n/a":(100*x.neighborPodiumRate).toFixed(1)+"%")+" | "+(100*x.expectedPodiumRate).toFixed(1)+"% |");
            rows.push("","### Winner-conditioned second-place frequencies","","| Winner | Second boat | Count | Rate |","|---|---|---:|---:|");
            for(const [winner,x] of Object.entries(r.finishOrderPairs.byWinner))for(const [second,count] of Object.entries(x.second))if(Number(second)!==Number(winner))rows.push("| "+winner+" | "+second+" | "+count+" | "+(100*x.secondRate[second]).toFixed(1)+"% |");
            rows.push("","### Inner/outer top-three patterns","","| Pattern | Count | Rate |","|---|---:|---:|");
            for(const [name,p] of Object.entries(r.topThreePatterns.patterns))rows.push("| "+name+" | "+p.count+" | "+(100*p.rate).toFixed(1)+"% |");
            rows.push("","### Pattern rates conditioned on winning frame group","","| Pattern | Count | Winner-group races | Conditional rate |","|---|---:|---:|---:|");
            for(const [name,p] of Object.entries(r.topThreePatterns.patterns))rows.push("| "+name+" | "+p.count+" | "+p.conditionedOnWinnerRaces+" | "+(p.rateGivenWinnerGroup===null?"n/a":(100*p.rateGivenWinnerGroup).toFixed(1)+"%")+" |");
            rows.push("","### Exploratory archive win-rate placement (NOT pre-race verified)","","| Placement | Races | Both top-three | Rate |","|---|---:|---:|---:|");
            for(const [name,g] of Object.entries(r.archivedAbilityPlacement.groups))rows.push("| "+name+" | "+g.races+" | "+g.bothPodium+" | "+(g.bothPodiumRate===null?"n/a":(100*g.bothPodiumRate).toFixed(1)+"%")+" |");
            rows.push("","### Between two strongest archived racers (exploratory)","","| Placement | Races | Both top-three | Between 2nd | Between podium |","|---|---:|---:|---:|---:|");
            for(const [name,g] of Object.entries(r.separatedTopTwo.groups))rows.push("| "+name+" | "+g.races+" | "+g.bothPodium+" | "+g.betweenSecond+" | "+g.betweenPodium+" |");
            rows.push("","### Stratified by number of intervening frame numbers","","| Between frames | Races | Between 2nd | Rate | Between top-three | Rate |","|---|---:|---:|---:|---:|---:|");
            for(const [gap,g] of Object.entries(r.gapStrata.byGap))rows.push("| "+gap+" | "+g.races+" | "+g.betweenSecond+" | "+(g.betweenSecondRate===null?"n/a":(100*g.betweenSecondRate).toFixed(1)+"%")+" | "+g.betweenPodium+" | "+(g.betweenPodiumRate===null?"n/a":(100*g.betweenPodiumRate).toFixed(1)+"%")+" |");
            rows.push("","### Per-candidate normalized frequencies (exploratory)","","| Between frames | Candidate slots | 2nd per candidate | Top-three per candidate |","|---|---:|---:|---:|");
            for(const [gap,g] of Object.entries(r.interveningCandidates.byGap))rows.push("| "+gap+" | "+g.candidateSlots+" | "+(g.perCandidateSecondRate===null?"n/a":(100*g.perCandidateSecondRate).toFixed(1)+"%")+" | "+(g.perCandidatePodiumRate===null?"n/a":(100*g.perCandidatePodiumRate).toFixed(1)+"%")+" |");
            rows.push("","### Intervening candidate by boat number","","| Boat | Candidate races | 2nd rate | Top-three rate |","|---|---:|---:|---:|");
            for(const [boat,g] of Object.entries(r.interveningByBoat.byBoat))rows.push("| "+boat+" | "+g.candidateRaces+" | "+(g.secondRate===null?"n/a":(100*g.secondRate).toFixed(1)+"%")+" | "+(g.podiumRate===null?"n/a":(100*g.podiumRate).toFixed(1)+"%")+" |");
            rows.push("","### Same-boat-number baseline comparison (exploratory)","","| Boat | All 2nd | Between 2nd | Difference (pp) | All podium | Between podium |","|---|---:|---:|---:|---:|---:|");
            for(const [boat,g] of Object.entries(r.interveningFrameBaseline.byBoat))rows.push("| "+boat+" | "+(100*g.allSecondRate).toFixed(1)+"% | "+(100*g.betweenSecondRate).toFixed(1)+"% | "+(100*g.secondLift).toFixed(1)+" | "+(100*g.allPodiumRate).toFixed(1)+"% | "+(100*g.betweenPodiumRate).toFixed(1)+"% |");
            rows.push("","### Between vs not-between (same boat number, exploratory)","","| Boat | Between races | Between 2nd | Not-between races | Not-between 2nd | Difference (pp) |","|---|---:|---:|---:|---:|---:|");
            for(const [boat,g] of Object.entries(r.betweenVsNotBetween.byBoat))rows.push("| "+boat+" | "+g.between.races+" | "+(100*g.between.secondRate).toFixed(1)+"% | "+g.notBetween.races+" | "+(100*g.notBetween.secondRate).toFixed(1)+"% | "+(100*g.secondDifference).toFixed(1)+" |");
            rows.push("","### Candidate ability rank stratification (exploratory)","","| Boat | Between? | Rank group | Races | 2nd rate | Top-three rate |","|---|---|---|---:|---:|---:|");
            for(const [boat,g] of Object.entries(r.betweenByRank.groups))for(const [side,buckets] of Object.entries(g))for(const [rank,s] of Object.entries(buckets))rows.push("| "+boat+" | "+side+" | "+rank+" | "+s.races+" | "+(s.secondRate===null?"n/a":(100*s.secondRate).toFixed(1)+"%")+" | "+(s.podiumRate===null?"n/a":(100*s.podiumRate).toFixed(1)+"%")+" |");
            rows.push("","### Daily 2/3-boat ability-rank stability (exploratory)","","| Date | Races | Top-half 2nd | Bottom-half 2nd |","|---|---:|---:|---:|");
            for(const [date,g] of Object.entries(r.dailyAbilityRank.byDay))rows.push("| "+date+" | "+g.eligible+" | "+(g.innerTopHalf.secondRate===null?"n/a":(100*g.innerTopHalf.secondRate).toFixed(1)+"%")+" | "+(g.innerBottomHalf.secondRate===null?"n/a":(100*g.innerBottomHalf.secondRate).toFixed(1)+"%")+" |");
            rows.push("","### Prospective-data readiness","","| Field | Records |","|---|---:|");
            for(const [field,count] of Object.entries(r.prospectiveReadiness))if(typeof count==="number")rows.push("| "+field+" | "+count+" |");
            rows.push("","### Chronological archive heuristic holdout (NOT current app)","","Training dates: "+r.chronologicalHeuristics.trainDates.join(", ")+"; holdout dates: "+r.chronologicalHeuristics.testDates.join(", "),"","Selected weight: "+r.chronologicalHeuristics.selectedWeight,"","| Heuristic | Holdout races | 1st rate | 2nd rate | Exact trifecta | Top-three membership |","|---|---:|---:|---:|---:|---:|");
            for(const [name,g] of [["Selected archive heuristic",r.chronologicalHeuristics.holdout],["Frame-only heuristic",r.chronologicalHeuristics.frameOnlyHoldout]])rows.push("| "+name+" | "+g.races+" | "+(100*g.firstRate).toFixed(1)+"% | "+(100*g.secondRate).toFixed(1)+"% | "+(100*g.exactRate).toFixed(1)+"% | "+(100*g.podiumRate).toFixed(1)+"% |");
            rows.push("","### Two-stage podium selection / finish ordering (archive only)","","Selected podium weight: "+r.twoStageArchive.selected.podiumWeight+"; order weight: "+r.twoStageArchive.selected.orderWeight,"","| Variant | First | Second | Exact trifecta | Podium membership |","|---|---:|---:|---:|---:|");
            for(const [name,g] of [["Two-stage selected",r.twoStageArchive.holdout],["Frame-only",r.twoStageArchive.frameOnlyHoldout]])rows.push("| "+name+" | "+(100*g.firstRate).toFixed(1)+"% | "+(100*g.secondRate).toFixed(1)+"% | "+(100*g.exactRate).toFixed(1)+"% | "+(100*g.membershipRate).toFixed(1)+"% |");
            rows.push("","### App promotion gate","","Promote: "+r.promotionGate.promote+"; reason: "+r.promotionGate.reason,"","Archive win rates are NOT verified as pre-race snapshots. No predictive accuracy claim. No score change.");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,rows.join("\n")+"\n");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-adjacent-podium-research
          path: reports/historical-adjacent-podium.json
          retention-days: 30
