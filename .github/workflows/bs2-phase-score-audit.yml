name: Boat Score 2 phase score audit
on:
  push:
    branches: [bs2-phase-score-audit-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module scripts/audit-phase-score-separation.mjs
      - run: node scripts/test-normalize-exhibition-st.mjs
      - run: node --experimental-default-type=module scripts/test-phase-comparison.mjs
      - run: node scripts/test-relative-outcomes.mjs
      - run: node scripts/test-capture-integrity.mjs
