name: Research conditional podium tests
on:
  push:
    branches:
      - research/st-course-holdout-20261121
    paths:
      - 'scripts/research-conditional-podium-audit.mjs'
      - 'scripts/test-research-conditional-podium-audit.mjs'
      - 'scripts/research-stratified-podium.mjs'
      - 'scripts/test-research-stratified-podium.mjs'
      - 'scripts/research-retrospective-finish-ranks.mjs'
      - 'scripts/test-research-retrospective-finish-ranks.mjs'
      - '.github/workflows/research-conditional-podium-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-research-conditional-podium-audit.mjs scripts/test-research-stratified-podium.mjs scripts/test-research-retrospective-finish-ranks.mjs
