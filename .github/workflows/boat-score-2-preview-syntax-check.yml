name: Validate Boat Score 2 preview syntax
on:
  push:
    branches:
      - fix-boat-score-2-syntax-20261115
    paths:
      - worker.js
      - six-boat-ranking-display.test.mjs
      - .github/workflows/boat-score-2-preview-syntax-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dedicated preview branch and Worker syntax
        run: |
          test "$(git branch --show-current)" = "fix-boat-score-2-syntax-20261115"
          node --input-type=module --check < worker.js
          node six-boat-ranking-display.test.mjs
