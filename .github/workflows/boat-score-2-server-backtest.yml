name: Boat Score 2 server-only historical comparison

on:
  workflow_dispatch:
    inputs:
      backtest_date:
        description: 'Historical race date (YYYYMMDD)'
        required: true
        default: '20261116'
        type: string
      venue:
        description: 'Venue number 1-24, or 0 for verified active venues'
        required: true
        default: '0'
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-boat-score-2-syntax-20261115
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare selected historical date using deployed Boat Score 2 predictions
        env:
          BACKTEST_DATE: ${{ inputs.backtest_date }}
          BACKTEST_VENUE: ${{ inputs.venue }}
        run: node scripts/boat-score-2-server-backtest.mjs
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-score-2-backtest-${{ inputs.backtest_date }}
          path: backtest-results/
          if-no-files-found: warn
