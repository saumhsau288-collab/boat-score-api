name: Boat Score 2 official source connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe official site from GitHub runner
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, socket, json, time
          urls = {
            "pc_racelist": "https://www.boatrace.jp/owpc/pc/race/racelist?rno=1&jcd=15&hd=20261116",
            "pc_schedule": "https://www.boatrace.jp/owpc/pc/race/index?hd=20261116",
            "sp_race": "https://www.boatrace.jp/owsp/sp/race/index?hd=20261116&jcd=15",
          }
          for name, url in urls.items():
            start=time.monotonic()
            try:
              request=urllib.request.Request(url,headers={"User-Agent":"BoatScore2-ConnectivityCheck/1.0","Accept":"text/html"})
              with urllib.request.urlopen(request,timeout=12) as response:
                sample=response.read(1024)
                result={"source":name,"httpStatus":response.status,"contentType":response.headers.get("Content-Type",""),"sampleBytes":len(sample),"elapsedMs":round((time.monotonic()-start)*1000)}
            except Exception as error:
              result={"source":name,"errorType":type(error).__name__,"error":str(error)[:160],"elapsedMs":round((time.monotonic()-start)*1000)}
            print(json.dumps(result,ensure_ascii=False),flush=True)
          print("Probe complete. HTTP success alone does not verify racer entries.")
          PY
