name: Boat Score 2 offline comparison PR tests
on:
  pull_request:
    paths:
      - 'scripts/compare_offline_predictions.py'
      - 'scripts/test_compare_offline_predictions.py'
      - '.github/workflows/boat-score-2-offline-comparison-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-comparison-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline comparison syntax
        run: python3 -m py_compile scripts/compare_offline_predictions.py scripts/test_compare_offline_predictions.py
      - name: Test immutable prediction versus official result comparison
        run: python3 -m unittest discover -s scripts -p 'test_compare_offline_predictions.py' -v
