name: Capture Boat Score 2 morning predictions (research only)

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      capture_date:
        description: 'JST date YYYYMMDD (blank = today JST)'
        required: false
        type: string
      capture_venues:
        description: 'Comma-separated venue numbers; blank = all 24'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: boat-score-2-research-morning-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check capture and validation scripts syntax
        run: |
          node --check scripts/audit-base-vs-adjusted.mjs
          node --check scripts/audit-archived-deployed-tickets.mjs
          node --check scripts/audit-capture-calibration-readiness.mjs
          node --check scripts/test-audit-capture-calibration-readiness.mjs
          node --check scripts/test-audit-archived-deployed-tickets.mjs
          node --check scripts/audit-applied-adjustments.mjs
          node --check scripts/audit-saved-comparison-evidence.mjs
          node --check scripts/run-saved-capture-result-comparison.mjs
          node --check scripts/audit-duplicate-capture-keys.mjs
          node --check scripts/audit-duplicate-capture-keys.test.mjs
          node --check scripts/compare-saved-capture-results.mjs
          node --check scripts/audit-makulabo-heatmap-zero.mjs
          node --check scripts/audit-recent50-source-readiness.mjs
          node --check scripts/audit-explicit-score-exclusions.mjs
          node --check scripts/report-morning-coverage-research.mjs
          node --check scripts/audit-morning-coverage-research.mjs
          node --check scripts/audit-morning-capture-outcomes.mjs
          node --check scripts/research-capture-retry-policies.mjs
          node --check scripts/test-research-capture-retry-policies.mjs
          node --check scripts/fetch-with-timeout-retry.mjs
          node --check scripts/build-morning-capture-tasks.mjs
          node --check scripts/capture-existing-boat-score-2-predictions.mjs
          node --check scripts/report-capture-readiness-research.mjs
          node --check scripts/validate-morning-capture.mjs
          node --check scripts/test-validate-morning-capture.mjs
          node --check scripts/audit-morning-input-coverage.mjs
          node --check scripts/test-audit-morning-input-coverage.mjs
          node --check scripts/classify-morning-capture-quality.mjs
          node --check scripts/test-classify-morning-capture-quality.mjs
          node --check scripts/audit-pre-race-feature-snapshots.mjs
          node --check scripts/test-audit-pre-race-feature-snapshots.mjs
          node --check scripts/audit-capture-racer-fields.mjs
          node --check scripts/report-capture-racer-fields.mjs
          node --check scripts/audit-capture-score-inputs.mjs
          node --check scripts/test-audit-capture-score-inputs.mjs
          node --check scripts/audit-capture-response-shapes.mjs
          node --check scripts/test-audit-capture-response-shapes.mjs
          node --check scripts/audit-morning-official-cutoffs.mjs
          node --check scripts/summarize-cutoff-candidates.mjs
          node --check scripts/test-summarize-cutoff-candidates.mjs
          node --check scripts/summarize-official-venue-activity.mjs
          node --check scripts/capture-official-cutoff-source.mjs
      - name: Test capture validation with offline fixtures
        run: |
          node scripts/test-report-capture-readiness-research.mjs
          node scripts/test-summarize-official-venue-activity.mjs
          node scripts/test-build-morning-capture-tasks.mjs
          node scripts/test-research-capture-retry-policies.mjs
          node scripts/test-fetch-with-timeout-retry.mjs
          node scripts/test-audit-base-vs-adjusted.mjs
          node scripts/test-audit-archived-deployed-tickets.mjs
          node scripts/test-audit-capture-calibration-readiness.mjs
          node scripts/test-audit-applied-adjustments.mjs
          node scripts/test-audit-saved-comparison-evidence.mjs
          node scripts/test-run-saved-capture-result-comparison.mjs
          node --test scripts/audit-duplicate-capture-keys.test.mjs
          node scripts/test-compare-saved-capture-results.mjs
          node scripts/test-audit-makulabo-heatmap-zero.mjs
          node scripts/test-audit-recent50-source-readiness.mjs
          node scripts/test-audit-explicit-score-exclusions.mjs
          node scripts/test-audit-morning-capture-outcomes.mjs
          node scripts/test-validate-morning-capture.mjs
          node scripts/test-audit-morning-input-coverage.mjs
          node scripts/test-classify-morning-capture-quality.mjs
          node scripts/test-audit-pre-race-feature-snapshots.mjs
          node --test scripts/test-audit-capture-racer-fields.mjs
          node scripts/test-audit-capture-score-inputs.mjs
          node scripts/test-audit-capture-response-shapes.mjs
          node scripts/test-audit-morning-official-cutoffs.mjs
          node scripts/test-summarize-cutoff-candidates.mjs
      - name: Check live deployed predictor reachability (read only)
        env:
          BOAT_SCORE_URL: https://boat-score-2-preview.saumh-sau-288.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.BOAT_SCORE_URL;
          const url=new URL('/api/predict/selected-race',base);
          const now=new Date();
          const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
          const fields=Object.fromEntries(date.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
          url.search=new URLSearchParams({date:fields.year+fields.month+fields.day,venue:'1',race:'1',mode:'beforeinfo'}).toString();
          try {
            const res=await fetch(url,{signal:AbortSignal.timeout(15000),headers:{Accept:'application/json'}});
            const text=await res.text();
            let data;try{data=JSON.parse(text);}catch{data=null;}
            console.log(JSON.stringify({check:'read_only_endpoint_probe',httpStatus:res.status,contentType:res.headers.get('content-type'),jsonParsed:data!==null,ready:data?.ready===true,reason:data?.reason||null,bytes:text.length}));
          }catch(e){console.log(JSON.stringify({check:'read_only_endpoint_probe',error:String(e?.message||e)}));}
          NODE
      - name: Capture existing deployed predictor responses without altering app
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUES: ${{ inputs.capture_venues }}
          BOAT_SCORE_URL: https://boat-score-2-preview.saumh-sau-288.workers.dev
        run: node scripts/capture-existing-boat-score-2-predictions.mjs
      - name: Inventory captured deployed predictor data for historical comparison
        if: always()
        run: |
          if [ -d prediction-captures ]; then
            node scripts/run-existing-prediction-capture-inventory.mjs prediction-captures > prediction-captures/existing-prediction-inventory.json || true
            cat prediction-captures/existing-prediction-inventory.json
          fi
      - name: Save read-only per-race morning timing and coverage evidence
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            node scripts/report-morning-coverage-research.mjs "$file" > "${file%.json}-morning-coverage.json"
          done
      - name: Audit captured API responses and prediction ticket format
        run: |
          for file in prediction-captures/*.json; do
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            node scripts/validate-morning-capture.mjs "$file"
          done
      - name: Collect official cutoff source evidence (not yet verified)
        if: always()
        run: |
          [ -d prediction-captures ] && node scripts/capture-official-cutoff-source.mjs || true
      - name: Summarize official venue activity evidence without filtering unverified venues
        if: always()
        run: |
          if [ -f prediction-captures/official-cutoff-source-evidence.json ]; then
            node scripts/summarize-official-venue-activity.mjs prediction-captures/official-cutoff-source-evidence.json
          fi
      - name: Audit official cutoff availability without inventing cutoff times
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            case "$file" in *-quality.json|*-score-inputs.json|*-response-shape.json|*-cutoff-audit.json|*-source-evidence.json) continue ;; esac
            case "$file" in *-quality.json|*-score-inputs.json|*-response-shape.json|*-cutoff-audit.json) continue ;; esac
            node scripts/audit-morning-official-cutoffs.mjs "$file" > "${file%.json}-cutoff-audit.json"
          done
      - name: Report official input gaps and network timeouts
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            case "$file" in *-quality.json|*-score-inputs.json|*-response-shape.json|*-cutoff-audit.json|*-source-evidence.json) continue ;; esac
            node scripts/audit-morning-input-coverage.mjs "$file"
          done
      - name: Classify raw prediction quality for later review
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            case "$file" in *-quality.json|*-score-inputs.json|*-response-shape.json|*-cutoff-audit.json|*-source-evidence.json) continue ;; esac
            node scripts/classify-morning-capture-quality.mjs "$file" > "${file%.json}-quality.json"
          done
      - name: Audit six-racer feature completeness including average ST (research only)
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            node scripts/report-capture-racer-fields.mjs "$file" > "${file%.json}-racer-fields.json"
            node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));console.log(JSON.stringify({date:r.date,ready:r.readyPredictions,sixBoat:r.withSixBoatInputs,averageSTComplete:r.fields.averageStartTiming.completeRaces,allFieldsComplete:r.allFieldsComplete}));" "${file%.json}-racer-fields.json"
          done
      - name: Audit per-boat scoring inputs in raw captures
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            case "$file" in *-quality.json|*-score-inputs.json|*-response-shape.json|*-cutoff-audit.json|*-source-evidence.json) continue ;; esac
            case "$file" in *-quality.json) continue ;; esac
            node scripts/audit-capture-score-inputs.mjs "$file" > "${file%.json}-score-inputs.json"
          done
      - name: Audit original six-boat feature snapshots and cutoff evidence
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            node scripts/audit-pre-race-feature-snapshots.mjs "$file" > "${file%.json}-feature-snapshot-audit.json"
            node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); console.log(JSON.stringify({snapshotAudit:process.argv[1],total:r.total,completeSixBoatFeatures:r.completeSixBoatFeatures,eligibleForHistoricalCalibration:r.eligibleForHistoricalCalibration}));" "${file%.json}-feature-snapshot-audit.json"
          done
      - name: Discover actual deployed response score-input field names
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            case "$file" in *-quality.json|*-score-inputs.json|*-response-shape.json|*-cutoff-audit.json|*-source-evidence.json) continue ;; esac
            case "$file" in *-quality.json|*-score-inputs.json|*-response-shape.json|*-cutoff-audit.json) continue ;; esac
            node scripts/audit-capture-response-shapes.mjs "$file" > "${file%.json}-response-shape.json"
          done
      - name: Compare actual base and adjusted predictor ticket lists
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            node scripts/audit-base-vs-adjusted.mjs "$file" > "${file%.json}-base-vs-adjusted.json"
          done
      - name: Audit deployed exhibition and start adjustment flags
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            node scripts/audit-applied-adjustments.mjs "$file" > "${file%.json}-applied-adjustments.json"
          done
      - name: Audit explicit unscored inputs reported by deployed predictor
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            node scripts/audit-explicit-score-exclusions.mjs "$file" > "${file%.json}-explicit-exclusions.json"
          done
      - name: Summarize capture timeouts and missing input labels
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            case "$file" in *-quality.json|*-diagnostics.json|*-score-inputs.json|*-response-shape.json|*-cutoff-audit.json) continue ;; esac
            node scripts/audit-morning-capture-outcomes.mjs "$file"
          done
      - name: Publish mobile-friendly capture quality summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names = fs.existsSync('prediction-captures')
            ? fs.readdirSync('prediction-captures').filter(name => name.endsWith('-quality.json')) : [];
          const lines = ['## Boat Score 2 morning capture quality', '',
            'This is a raw research capture, not independently authenticated pre-race predictions.', ''];
          for (const name of names) {
            const report = JSON.parse(fs.readFileSync('prediction-captures/' + name, 'utf8'));
            lines.push('### ' + report.date, '',
              '| Result | Races |', '|---|---:|',
              ...Object.entries(report.counts).map(([key, value]) => '| ' + key + ' | ' + value + ' |'),
              '', 'No hit rates or scoring adjustments are authorized from these raw responses.', '');
          }
          const diagnosticNames=fs.existsSync('prediction-captures')
            ? fs.readdirSync('prediction-captures').filter(name=>/^20\d{6}-\d+-diagnostics\.json$/.test(name)) : [];
          for (const name of diagnosticNames) {
            const report=JSON.parse(fs.readFileSync('prediction-captures/'+name,'utf8'));
            lines.push('### Actual capture outcomes: '+report.date,'',
              '| Outcome | Races |','|---|---:|',
              ...Object.entries(report.counts).map(([key,count])=>'| '+key+' | '+count+' |'),
              '', 'Capture JST: '+(report.captureTimeJst||'unknown')+'; morning window: '+report.scheduledMorningWindow,
              'Workflow trigger: '+(report.triggerEvidence?.scheduledTrigger===true?'scheduled':report.triggerEvidence?.scheduledTrigger===false?'not scheduled':'unknown')+'; note: morning-window timing alone does not authenticate pre-race capture.',
              '', '### Retry telemetry coverage', '',
              '| Attempt history | Records |', '|---|---:|',
              '| With attempt history | '+(report.attemptTelemetry?.recordsWithAttempts??'unknown')+' |',
              '| Missing attempt history | '+(report.attemptTelemetry?.recordsWithoutAttempts??'unknown')+' |',
              '| Multiple attempts recorded | '+(report.attemptTelemetry?.recordsWithMultipleAttempts??'unknown')+' |',
              '', '### Per-attempt network outcomes', '',
              '| Attempt outcome | Count |', '|---|---:|',
              '| First attempt timeout | '+(report.attemptStats?.firstAttemptTimeouts??'unknown')+' |',
              '| Second attempt timeout | '+(report.attemptStats?.secondAttemptTimeouts??'unknown')+' |',
              '| First attempt HTTP success | '+(report.attemptStats?.firstAttemptHttpSuccess??'unknown')+' |',
              '| Second attempt HTTP success | '+(report.attemptStats?.secondAttemptHttpSuccess??'unknown')+' |',
              '| Recovered after retry | '+(report.counts?.recoveredAfterRetry??'unknown')+' |',
              '', 'Missing history must not be interpreted as zero retries.',
              '', '### Capture outcomes by venue', '',
              '| Venue | Attempted | Ready | Not ready | Timeout | Other error | HTTP failure |',
              '|---|---:|---:|---:|---:|---:|---:|',
              ...Object.entries(report.byVenue||{}).sort((a,b)=>Number(a[0])-Number(b[0])).map(([venue,c])=>
                '| '+venue+' | '+c.attempted+' | '+c.ready+' | '+c.notReady+' | '+c.networkTimeout+' | '+c.otherNetworkError+' | '+c.httpFailure+' |'),
              '', '### Largest observed capture blockers', '',
              '| Blocker | Affected races | Next investigation |', '|---|---:|---|',
              ...((report.rankedBlockers||[]).filter(b=>b.races>0).map(b=>'| '+b.code+' | '+b.races+' | '+b.action+' |')),
              '', 'Ranking describes observed API responses, not confirmed root causes.',
              '', '### Main/upset ticket overlap', '',
              '| Metric | Races |', '|---|---:|',
              ...Object.entries(report.ticketDistinctness||{}).map(([k,v])=>'| '+k+' | '+v+' |'),
              '', 'Overlap is diagnostic only; it does not change the deployed prediction or buy list.',
              '', '### Retry attempt outcomes', '',
              '| Attempt metric | Count |', '|---|---:|',
              ...Object.entries(report.attemptStats||{}).map(([k,v])=>'| '+k+' | '+v+' |'),
              '', '### Request latency by outcome (seconds)', '',
              '| Outcome | Timed samples | p50 | p95 | Max |', '|---|---:|---:|---:|---:|',
              ...Object.entries(report.latencySeconds||{}).map(([k,v])=>
                '| '+k+' | '+v.samples+' | '+(v.p50??'n/a')+' | '+(v.p95??'n/a')+' | '+(v.max??'n/a')+' |'),
              '', '### Capture record coverage', '',
              'Expected pairs from requested scope: '+(report.coverage?.expectedPairCount??'unknown')+'; unique venue-race pairs: '+(report.coverage?.uniqueVenueRacePairs??'unknown')+
              '; duplicates: '+(report.coverage?.duplicateVenueRacePairs??'unknown')+
              '; invalid pairs: '+(report.coverage?.invalidVenueRacePairs??'unknown')+
              '; missing within requested scope: '+(report.coverage?.missingPairsWithinRequestedVenues?.length??'unknown')+
              '; unexpected outside scope: '+(report.coverage?.unexpectedPairsOutsideScope?.length??'unknown'),
              '', 'This is record completeness, not verified racing schedule coverage.',
              '', '### Base prediction versus adjusted tickets', '',
              ...Object.entries((()=>{const file='prediction-captures/'+name.replace('-diagnostics.json','-base-vs-adjusted.json');return fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):{};})()).filter(([k,v])=>typeof v==='number').map(([k,v])=>'- '+k+': '+v),
              '', '| Exhibition / Start | Compared | Set changed | Order only | No change |',
              '|---|---:|---:|---:|---:|',
              ...Object.entries((()=>{const file='prediction-captures/'+name.replace('-diagnostics.json','-base-vs-adjusted.json');return fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')).byAdjustmentFlags:{};})()).map(([k,v])=>
                '| '+k+' | '+v.comparable+' | '+v.eitherSetChanged+' | '+v.orderOnlyChanged+' | '+v.noChange+' |'),
              '', 'Ticket changes are not evidence of improved accuracy.',
              '', '### Applied exhibition/start adjustment flags', '',
              ...Object.entries((()=>{const file='prediction-captures/'+name.replace('-diagnostics.json','-applied-adjustments.json');return fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):{};})()).filter(([k,v])=>typeof v==='number').map(([k,v])=>'- '+k+': '+v),
              '', 'API flags only; no independent verification of scoring math.',
              '', '### Explicit scoring exclusions reported by deployed API', '',
              ...Object.entries((()=>{const file='prediction-captures/'+name.replace('-diagnostics.json','-explicit-exclusions.json');return fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')).explicitExclusions:{};})()).map(([key,value])=>'- '+key+': '+value),
              '', '### Identical API response body diagnostics', '',
              '| Metric | Count |', '|---|---:|',
              ...Object.entries(report.responseHashDiagnostics||{}).filter(([k,v])=>typeof v==='number').map(([k,v])=>'| '+k+' | '+v+' |'),
              '', 'Repeated hashes are signals to inspect, not proof of incorrect predictions.',
              '', '### Prediction arrivals after 08:00 JST', '',
              '| By JST | Responses | Ready | Valid 6+6 | 12 distinct |', '|---|---:|---:|---:|---:|',
              ...Object.entries(report.eightClockMilestones||{}).map(([clock,c])=>
                '| '+clock+' | '+c.responses+' | '+c.ready+' | '+c.validSixPlusSix+' | '+c.distinctTwelve+' |'),
              '', 'Cumulative counts from 08:00; timestamps alone do not prove pre-race authenticity.',
              '', '### 07:45–08:30 JST coverage by race number', '',
              '| Race | Requested | Responded | Ready | Valid 6+6 |', '|---|---:|---:|---:|---:|',
              ...Object.entries(report.morningByRace||{}).sort((a,b)=>Number(a[0])-Number(b[0])).map(([race,c])=>
                '| '+race+' | '+c.requestedInWindow+' | '+c.respondedInWindow+' | '+c.readyInWindow+' | '+c.usableSixPlusSixInWindow+' |'),
              '', 'This shows actual arrival timing, not verified pre-race forecasts.',
              '', '### Capture timing by race number', '',
              '| Race | Attempted | Ready | Timeout | First request UTC | Last request UTC |',
              '|---|---:|---:|---:|---|---|',
              ...Object.entries(report.byRace||{}).sort((a,b)=>Number(a[0])-Number(b[0])).map(([race,c])=>
                '| '+race+' | '+c.attempted+' | '+c.ready+' | '+c.networkTimeout+' | '+(c.firstRequestedAt||'unknown')+' | '+(c.lastRequestedAt||'unknown')+' |'),
              '', '### Capture timing by venue (observed, not scheduled)', '',
              'Overall elapsed seconds: '+(report.timing?.elapsedSeconds??'unknown'),'',
              'Requests started 07:45–08:30 JST: '+(report.timing?.morningWindow?.requestWithinMorningWindow??'unknown')+
              '; outside window: '+(report.timing?.morningWindow?.requestOutsideMorningWindow??'unknown')+
              '; timestamp unavailable: '+(report.timing?.morningWindow?.requestTimeUnknown??'unknown'),'',
              'Responses completed 07:45–08:30 JST: '+(report.timing?.morningWindow?.responseWithinMorningWindow??'unknown')+
              '; outside window: '+(report.timing?.morningWindow?.responseOutsideMorningWindow??'unknown')+
              '; timestamp unavailable: '+(report.timing?.morningWindow?.responseTimeUnknown??'unknown'),'',
              'READY predictions received 07:45–08:30 JST: '+(report.timing?.morningWindow?.readyResponseWithinMorningWindow??'unknown')+
              '; outside window: '+(report.timing?.morningWindow?.readyResponseOutsideMorningWindow??'unknown')+
              '; timestamp unavailable: '+(report.timing?.morningWindow?.readyResponseTimeUnknown??'unknown'),'',
              'VALID 6-main/6-upset predictions received 07:45–08:30 JST: '+(report.timing?.morningWindow?.usablePicksWithinMorningWindow??'unknown')+
              '; outside window: '+(report.timing?.morningWindow?.usablePicksOutsideMorningWindow??'unknown')+
              '; timestamp unavailable: '+(report.timing?.morningWindow?.usablePicksTimeUnknown??'unknown'),'',
              '| Venue | First request UTC | Last response UTC | Elapsed seconds |',
              '|---|---|---|---:|',
              ...Object.entries(report.timing?.byVenue||{}).sort((a,b)=>Number(a[0])-Number(b[0])).map(([venue,t])=>
                '| '+venue+' | '+(t.firstRequestedAt||'unknown')+' | '+(t.lastReceivedAt||'unknown')+' | '+(t.elapsedSeconds??'unknown')+' |'),
              '', 'Missing input labels reported by ready API responses:', '',
              ...Object.entries(report.missingInputLabels||{}).map(([key,count])=>'- '+key+': '+count),
              '', 'Not-ready reasons:', '',
              ...Object.entries(report.notReadyReasons||{}).map(([key,count])=>'- '+key+': '+count),
              '', 'Not a hit rate; capture timing is not independently authenticated.','');
          }
          const venueEvidencePath='prediction-captures/official-venue-activity-evidence.json';
          if(fs.existsSync(venueEvidencePath)){
            const evidence=JSON.parse(fs.readFileSync(venueEvidencePath,'utf8'));
            lines.push('### Venue activity evidence (NOT verified active venues)','',
              '| Venue | Pages | HTTP 200 | Source consistent | Identity consistent | Cutoff candidates |',
              '|---|---:|---:|---:|---:|---:|',
              ...Object.entries(evidence.byVenue||{}).sort((a,b)=>Number(a[0])-Number(b[0])).map(([venue,c])=>
                '| '+venue+' | '+c.requested+' | '+c.http200+' | '+c.sourceConsistent+' | '+c.identityConsistent+' | '+c.cutoffCandidates+' |'),
              '', 'HTTP 200 does not prove the venue is racing. No venues are excluded without verified schedule evidence.','');
          }
          const officialEvidencePath='prediction-captures/official-cutoff-source-evidence.json';
          if (fs.existsSync(officialEvidencePath)) {
            const evidence=JSON.parse(fs.readFileSync(officialEvidencePath,'utf8'));
            const counts={};
            for (const row of evidence.records||[]) {
              const status=row.cutoffCandidate?.status||'not_parsed';
              counts[status]=(counts[status]||0)+1;
            }
            const identityCounts={};
            for (const row of evidence.records||[]) {
              const status=row.pageIdentity?.status||'not_checked';
              identityCounts[status]=(identityCounts[status]||0)+1;
            }
            const sourceCounts={};
            for (const row of evidence.records||[]) {
              const status=row.sourceCheck?.status||'not_checked';
              sourceCounts[status]=(sourceCounts[status]||0)+1;
            }
            lines.push('### Official HTTP source checks (unverified)','',
              '| Source status | Races |','|---|---:|',
              ...Object.entries(sourceCounts).map(([status,count])=>'| '+status+' | '+count+' |'),
              '', 'An official HTTP response alone does not verify a race deadline.','');
            lines.push('### Official race page identity checks (unverified)','',
              '| Identity status | Races |','|---|---:|',
              ...Object.entries(identityCounts).map(([status,count])=>'| '+status+' | '+count+' |'),
              '', 'Consistent URL markers are not independent proof of a race-specific deadline.','');
            lines.push('### Official cutoff text candidates (unverified)','',
              '| Candidate status | Races |','|---|---:|',
              ...Object.entries(counts).map(([status,count])=>'| '+status+' | '+count+' |'),
              '', 'Candidates are NOT authenticated official cutoff times. No hit rates may be calculated from these candidates.','');
          }
          const cutoffNames = fs.existsSync('prediction-captures')
            ? fs.readdirSync('prediction-captures').filter(name => name.endsWith('-cutoff-audit.json')) : [];
          for (const name of cutoffNames) {
            const report = JSON.parse(fs.readFileSync('prediction-captures/' + name,'utf8'));
            lines.push('### Official cutoff evidence: '+report.date,'',
              '| Timing classification | Races |','|---|---:|',
              ...Object.entries(report.counts).map(([key,value])=>'| '+key+' | '+value+' |'),
              '', 'No independently verified official cutoff supplied; unknown does not mean pre-race.', '');
          }
          const scoreNames = fs.existsSync('prediction-captures')
            ? fs.readdirSync('prediction-captures').filter(name => name.endsWith('-score-inputs.json')) : [];
          for (const name of scoreNames) {
            const score = JSON.parse(fs.readFileSync('prediction-captures/' + name, 'utf8'));
            lines.push('### Score input evidence: ' + score.date, '',
              '| Check | Races |', '|---|---:|',
              '| Ready predictions | ' + score.readyPredictions + ' |',
              '| Explicit six-boat input evidence | ' + score.readyWithExplicitSixBoatInputEvidence + ' |',
              '| All five score inputs present | ' + score.readyCompleteFiveInputs + ' |',
              '| Missing explicit input evidence | ' + score.readyMissingInputEvidence + ' |',
              '| Incomplete or invalid inputs | ' + score.readyInvalidOrIncompleteInputs + ' |',
              '', 'Input absence in API responses does not prove the app did not use it. No pre-race authentication or score changes.', '');
          }
          const shapeNames = fs.existsSync('prediction-captures')
            ? fs.readdirSync('prediction-captures').filter(name => name.endsWith('-response-shape.json')) : [];
          for (const name of shapeNames) {
            const shape = JSON.parse(fs.readFileSync('prediction-captures/' + name, 'utf8'));
            lines.push('### Deployed API field discovery: ' + shape.date, '',
              'Ready responses inspected: ' + shape.readyResponsesInspected, '',
              'Potential input fields: ' + (shape.possibleScoreInputFieldNames.join(', ') || '(none exposed)'), '',
              'Field names are not evidence that all scoring inputs were present.', '');
          }
          const rawNames = fs.existsSync('prediction-captures')
            ? fs.readdirSync('prediction-captures').filter(name =>
                /^20\d{6}-\d+\.json$/.test(name)) : [];
          for (const name of rawNames) {
            const raw = JSON.parse(fs.readFileSync('prediction-captures/' + name, 'utf8'));
            const byVenue = new Map();
            for (const record of raw.records || []) {
              const key = Number(record.venue);
              if (!Number.isInteger(key) || key < 1 || key > 24) continue;
              if (!byVenue.has(key)) byVenue.set(key,{ready:0,unverified:0,timeout:0,other:0});
              const row=byVenue.get(key);
              if (record.response?.ready === true && record.httpStatus === 200) row.ready++;
              else if (record.response?.reason === 'official_six_boat_stats_unverified') row.unverified++;
              else if (record.error && /timeout|timed out/i.test(record.error)) row.timeout++;
              else row.other++;
            }
            lines.push('### Venue-level capture blockers: '+raw.date,'',
              '| Venue | Ready | Official six-boat unverified | Timeouts | Other |',
              '|---:|---:|---:|---:|---:|',
              ...[...byVenue].sort((a,b)=>a[0]-b[0]).map(([venue,x])=>
                '| '+venue+' | '+x.ready+' | '+x.unverified+' | '+x.timeout+' | '+x.other+' |'),
              '', 'These are API response classifications, not confirmed venue schedules or prediction accuracy.', '');
          }
          for (const name of rawNames) {
            const raw=JSON.parse(fs.readFileSync('prediction-captures/'+name,'utf8'));
            const missingByVenue=new Map();
            const tracked=['recent50WinRate','exhibitionScore','nationalWinRate','localWinRate','motorTwoWinRate'];
            for (const record of raw.records || []) {
              if (record.httpStatus!==200 || record.response?.ready!==true) continue;
              const venue=Number(record.venue);
              if (!Number.isInteger(venue)||venue<1||venue>24) continue;
              if (!missingByVenue.has(venue)) missingByVenue.set(venue,{ready:0,notReported:0,fields:Object.fromEntries(tracked.map(x=>[x,0]))});
              const stats=missingByVenue.get(venue);stats.ready++;
              const missing=record.response.missingInputs;
              if (!Array.isArray(missing)) {stats.notReported++;continue;}
              for (const field of new Set(missing)) if (Object.hasOwn(stats.fields,field)) stats.fields[field]++;
            }
            lines.push('### Reported missing score inputs by venue: '+raw.date,'',
              '| Venue | Ready | Recent 50 | Exhibition | National | Local | Motor | Missing list absent |',
              '|---:|---:|---:|---:|---:|---:|---:|---:|',
              ...[...missingByVenue].sort((a,b)=>a[0]-b[0]).map(([venue,s])=>
                '| '+venue+' | '+s.ready+' | '+s.fields.recent50WinRate+' | '+
                s.fields.exhibitionScore+' | '+s.fields.nationalWinRate+' | '+
                s.fields.localWinRate+' | '+s.fields.motorTwoWinRate+' | '+s.notReported+' |'),
              '', 'Only explicit API missingInputs labels are counted; zero means not reported, not confirmed present.', '');
          }
          if (!scoreNames.length) lines.push('No score input evidence report was generated.', '');
          if (!names.length) lines.push('No capture quality report was generated. Inspect raw artifact and failed steps.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
      - name: Fail closed when no usable morning predictions were captured
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = fs.readdirSync('prediction-captures').filter(name => /^20\d{6}-\d+\.json$/.test(name));
          if (files.length !== 1) throw new Error('Expected exactly one capture artifact');
          const data = JSON.parse(fs.readFileSync('prediction-captures/' + files[0], 'utf8'));
          const valid = p => Array.isArray(p) && p.length === 3 &&
            p.every(x => Number.isInteger(x) && x >= 1 && x <= 6) && new Set(p).size === 3;
          const six = a => Array.isArray(a) && a.length === 6 &&
            a.every(valid) && new Set(a.map(p => p.join('-'))).size === 6;
          const usable = data.records.filter(r => r.httpStatus === 200 &&
            r.response?.ready === true && six(r.response.main) && six(r.response.upset));
          console.log('Usable six-main/six-upset morning predictions:', usable.length, 'of', data.attempted);
          if (usable.length === 0) throw new Error('No usable morning predictions; raw artifact will still upload');
          NODE
      - name: Verify archived deployed 12-ticket replay (no accuracy claims)
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            CAPTURE_FILE="$file" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {auditArchivedDeployedTickets} from './scripts/audit-archived-deployed-tickets.mjs';
          const source=process.env.CAPTURE_FILE;
          const result=auditArchivedDeployedTickets(JSON.parse(fs.readFileSync(source,'utf8')));
          const target=source.replace(/\.json$/,'-deployed-ticket-replay.json');
          fs.writeFileSync(target,JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({source,target,ready:result.ready,matched:result.matched,mismatched:result.mismatched,invalid:result.invalid}));
          if(result.mismatched>0||result.invalid>0)process.exitCode=1;
          NODE
          done
      - name: Report calibration readiness of captured races (research only)
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            CAPTURE_FILE="$file" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {auditCaptureCalibrationReadiness} from './scripts/audit-capture-calibration-readiness.mjs';
          const source=process.env.CAPTURE_FILE;
          const capture=JSON.parse(fs.readFileSync(source,'utf8'));
          // The official source collector currently supplies candidates, NOT authenticated cutoffs.
          const report=auditCaptureCalibrationReadiness(capture,[]);
          const target=source.replace(/\.json$/,'-calibration-readiness.json');
          fs.writeFileSync(target,JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({source,counts:report.counts,eligibleForWeightTuning:report.eligibleForWeightTuning}));
          NODE
          done
      - name: Compare saved prediction times with unverified cutoff candidates
        if: always()
        run: |
          if [ -f prediction-captures/official-cutoff-source-evidence.json ]; then
            for file in prediction-captures/*.json; do
              [ -f "$file" ] || continue
              [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
              CAPTURE_FILE="$file" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {summarizeCutoffCandidates} from './scripts/summarize-cutoff-candidates.mjs';
          const source=process.env.CAPTURE_FILE;
          const capture=JSON.parse(fs.readFileSync(source,'utf8'));
          const evidence=JSON.parse(fs.readFileSync('prediction-captures/official-cutoff-source-evidence.json','utf8'));
          const report=summarizeCutoffCandidates(capture,evidence);
          const target=source.replace(/\.json$/,'-cutoff-candidates.json');
          fs.writeFileSync(target,JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({source,counts:report.counts,verifiedCutoffs:report.verifiedCutoffs,calibrationEligible:report.calibrationEligible}));
          NODE
            done
          fi
      - name: Audit strict capture readiness (research only)
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            node scripts/report-capture-readiness-research.mjs "$file" > "${file%.json}-readiness.json"
          done
      - name: Upload timestamped raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-score-2-morning-raw-${{ github.run_id }}
          path: prediction-captures/
          retention-days: 90
          if-no-files-found: warn
