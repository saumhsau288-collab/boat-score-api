name: Capture Boat Score 2 morning predictions (research only)

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      capture_date:
        description: 'JST date YYYYMMDD (blank = today JST)'
        required: false
        type: string
      capture_venues:
        description: 'Comma-separated venue numbers; blank = all 24'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: boat-score-2-research-morning-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check capture and validation scripts syntax
        run: |
          node --check scripts/capture-existing-boat-score-2-predictions.mjs
          node --check scripts/validate-morning-capture.mjs
          node --check scripts/test-validate-morning-capture.mjs
          node --check scripts/audit-morning-input-coverage.mjs
          node --check scripts/test-audit-morning-input-coverage.mjs
          node --check scripts/classify-morning-capture-quality.mjs
          node --check scripts/test-classify-morning-capture-quality.mjs
      - name: Test capture validation with offline fixtures
        run: |
          node scripts/test-validate-morning-capture.mjs
          node scripts/test-audit-morning-input-coverage.mjs
          node scripts/test-classify-morning-capture-quality.mjs
      - name: Capture existing deployed predictor responses without altering app
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUES: ${{ inputs.capture_venues }}
          BOAT_SCORE_URL: https://boat-score-2-preview.saumh-sau-288.workers.dev
        run: node scripts/capture-existing-boat-score-2-predictions.mjs
      - name: Audit captured API responses and prediction ticket format
        run: |
          for file in prediction-captures/*.json; do
            node scripts/validate-morning-capture.mjs "$file"
          done
      - name: Report official input gaps and network timeouts
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            node scripts/audit-morning-input-coverage.mjs "$file"
          done
      - name: Classify raw prediction quality for later review
        if: always()
        run: |
          for file in prediction-captures/*.json; do
            [ -f "$file" ] || continue
            node scripts/classify-morning-capture-quality.mjs "$file" > "${file%.json}-quality.json"
          done
      - name: Publish mobile-friendly capture quality summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names = fs.existsSync('prediction-captures')
            ? fs.readdirSync('prediction-captures').filter(name => name.endsWith('-quality.json')) : [];
          const lines = ['## Boat Score 2 morning capture quality', '',
            'This is a raw research capture, not independently authenticated pre-race predictions.', ''];
          for (const name of names) {
            const report = JSON.parse(fs.readFileSync('prediction-captures/' + name, 'utf8'));
            lines.push('### ' + report.date, '',
              '| Result | Races |', '|---|---:|',
              ...Object.entries(report.counts).map(([key, value]) => '| ' + key + ' | ' + value + ' |'),
              '', 'No hit rates or scoring adjustments are authorized from these raw responses.', '');
          }
          if (!names.length) lines.push('No capture quality report was generated. Inspect raw artifact and failed steps.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
      - name: Fail closed when no usable morning predictions were captured
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = fs.readdirSync('prediction-captures').filter(name => name.endsWith('.json') && !name.endsWith('-quality.json'));
          if (files.length !== 1) throw new Error('Expected exactly one capture artifact');
          const data = JSON.parse(fs.readFileSync('prediction-captures/' + files[0], 'utf8'));
          const valid = p => Array.isArray(p) && p.length === 3 &&
            p.every(x => Number.isInteger(x) && x >= 1 && x <= 6) && new Set(p).size === 3;
          const six = a => Array.isArray(a) && a.length === 6 &&
            a.every(valid) && new Set(a.map(p => p.join('-'))).size === 6;
          const usable = data.records.filter(r => r.httpStatus === 200 &&
            r.response?.ready === true && six(r.response.main) && six(r.response.upset));
          console.log('Usable six-main/six-upset morning predictions:', usable.length, 'of', data.attempted);
          if (usable.length === 0) throw new Error('No usable morning predictions; raw artifact will still upload');
          NODE
      - name: Upload timestamped raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-score-2-morning-raw-${{ github.run_id }}
          path: prediction-captures/
          retention-days: 90
          if-no-files-found: warn
