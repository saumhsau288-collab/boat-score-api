name: Research pre-race evidence guard tests
on:
  push:
    branches: [research/st-course-holdout-20261121]
    paths:
      - scripts/assess-pre-race-evidence.mjs
      - scripts/test-assess-pre-race-evidence.mjs
      - .github/workflows/boat-score-2-pre-race-evidence-guard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-assess-pre-race-evidence.mjs
