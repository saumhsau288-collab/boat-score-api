name: Validate isolated Boat Score 2 official mapping
on:
  push:
    branches:
      - research-cutoff-join-gate-20261120
    paths:
      - 'boat-score-2-boat-mapping.js'
      - 'boat-score-2-boat-mapping.test.mjs'
      - '.github/workflows/boat-score-2-research-mapping-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate boat identity mapping
        run: node --experimental-default-type=module boat-score-2-boat-mapping.test.mjs
      - name: Validate official grouped metric extraction
        run: |
          node --experimental-default-type=module scripts/test-build-official-table-grid.mjs
          node --experimental-default-type=module scripts/test-identify-official-grouped-metric-columns.mjs
          node --experimental-default-type=module scripts/test-extract-grouped-official-six.mjs
