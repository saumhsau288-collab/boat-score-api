name: Research Toda sixth-boat mixed token audit
on:
  push:
    branches: [research/st-course-holdout-20261121]
    paths: [.github/workflows/boat-score-2-toda-sixth-token-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture original Toda sixth-boat labelled table cells
        run: |
          mkdir -p research-output
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const response=await fetch('https://makulabo-jp.com/data/02/1/heatmap?hd=20261120',{signal:AbortSignal.timeout(15000)});
          assert.equal(response.status,200);
          const html=await response.text();
          const clean=s=>String(s).replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/\s+/g,' ').trim();
          let row=null;
          for(const table of html.matchAll(/<table\b[^>]*>[\s\S]*?<\/table>/gi)){
            const rows=[...table[0].matchAll(/<tr\b[^>]*>[\s\S]*?<\/tr>/gi)].map(m=>[...m[0].matchAll(/<(?:th|td)\b[^>]*>([\s\S]*?)<\/(?:th|td)>/gi)].map(c=>clean(c[1])));
            const header=rows.findIndex(r=>r.length===10&&r[0]==='枠'&&r[1]==='選手');
            if(header<0)continue;
            row=rows.slice(header+1).find(r=>r.length===10&&r[0]==='6')??null;
            break;
          }
          assert.ok(row,'sixth boat row missing');
          const numericCells=row.slice(2,9).map((value,i)=>({column:['1着','2着','3着','4着','5着','6着','走'][i],value,numeric:/^\d+$/.test(value)}));
          const result={date:'20261120',venue:'02',race:1,boat:6,name:row[1],numericCells,rawRow:row,
            eligibleForCalibration:false,scoreChangeApplied:false};
          fs.writeFileSync('research-output/toda-sixth-row-tokens.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toda-sixth-row-tokens-${{ github.run_id }}
          path: research-output/
          retention-days: 30
