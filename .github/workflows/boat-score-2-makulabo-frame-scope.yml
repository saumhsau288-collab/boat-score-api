name: Research Makulabo frame-scope tests
on:
  push:
    branches: [research/st-course-holdout-20261121]
    paths:
      - scripts/assess-makulabo-frame-scope.mjs
      - scripts/test-assess-makulabo-frame-scope.mjs
      - .github/workflows/boat-score-2-makulabo-frame-scope.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-makulabo-official-identity-research.mjs
      - run: node scripts/test-assess-makulabo-frame-scope.mjs
