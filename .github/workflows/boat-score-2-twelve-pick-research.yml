name: Boat Score 2 twelve-pick research checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/*twelve-pick*.mjs'
      - 'scripts/*capture-from-api-response.mjs'
      - 'scripts/*save-twelve-pick-capture.mjs'
      - 'scripts/*snapshots-from-morning-capture.mjs'
      - 'scripts/*strategy-provenance.mjs'
      - 'scripts/test-morning-missing-data.mjs'
      - 'boat-score-2-morning.js'
      - 'boat-score-2-scoring.js'
      - 'scripts/test-prestart-missing-data.mjs'
      - 'scripts/*score-overlap.mjs'
      - 'scripts/*explain-racer-score.mjs'
      - 'scripts/*assess-course-start.mjs'
      - 'scripts/*classify-ability-course-start.mjs'
      - 'scripts/*rank-six-ability-course-start.mjs'
      - 'scripts/*analyze-six-signal-agreement.mjs'
      - 'scripts/*group-six-candidates.mjs'
      - 'scripts/*compare-six-signals-to-finish.mjs'
      - '.github/workflows/boat-score-2-twelve-pick-research.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify twelve-pick research code
        run: |
          node --check scripts/audit-twelve-picks-research.mjs
          node --check scripts/prepare-twelve-pick-capture.mjs
          node --check scripts/prepare-capture-from-api-response.mjs
          node scripts/test-audit-twelve-picks-research.mjs
          node scripts/test-prepare-twelve-pick-capture.mjs
          node scripts/test-prepare-capture-from-api-response.mjs
          node scripts/test-save-twelve-pick-capture.mjs
          node scripts/test-prepare-snapshots-from-morning-capture.mjs
          node scripts/test-audit-strategy-provenance.mjs
          node scripts/test-morning-missing-data.mjs
          node scripts/test-prestart-missing-data.mjs
          node scripts/test-diagnose-score-overlap.mjs
          node scripts/test-explain-racer-score.mjs
          node scripts/test-assess-course-start.mjs
          node scripts/test-classify-ability-course-start.mjs
          node scripts/test-rank-six-ability-course-start.mjs
          node scripts/test-analyze-six-signal-agreement.mjs
          node scripts/test-group-six-candidates.mjs
      - name: Verify six-signal finish comparison separately
        run: node scripts/test-compare-six-signals-to-finish.mjs
