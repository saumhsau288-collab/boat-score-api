name: Boat Score 2 twelve-pick research checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/*twelve-pick*.mjs'
      - 'scripts/*twelve-independent-hypotheses.mjs'
      - 'scripts/*candidate-modes.mjs'
      - 'scripts/*capture-from-api-response.mjs'
      - 'scripts/*save-twelve-pick-capture.mjs'
      - 'scripts/*snapshots-from-morning-capture.mjs'
      - 'scripts/*strategy-provenance.mjs'
      - 'scripts/test-morning-missing-data.mjs'
      - 'boat-score-2-morning.js'
      - 'boat-score-2-scoring.js'
      - 'scripts/test-prestart-missing-data.mjs'
      - 'scripts/*score-overlap.mjs'
      - 'scripts/*explain-racer-score.mjs'
      - 'scripts/*assess-course-start.mjs'
      - 'scripts/*classify-ability-course-start.mjs'
      - 'scripts/*rank-six-ability-course-start.mjs'
      - 'scripts/*analyze-six-signal-agreement.mjs'
      - 'scripts/*group-six-candidates.mjs'
      - 'scripts/*compare-six-signals-to-finish.mjs'
      - 'scripts/*twelve-pick-readiness.mjs'
      - 'scripts/*six-racer-source-inputs.mjs'
      - 'scripts/*six-racer-stage.mjs'
      - 'scripts/*official-six-racer-inputs.mjs'
      - 'scripts/*prediction-official-source.mjs'
      - 'scripts/*capture-times.mjs'
      - 'scripts/*saved-prediction-official-pairs.mjs'
      - 'scripts/*twelve-methods-with-results.mjs'
      - 'scripts/*capture-with-original-inputs.mjs'
      - 'scripts/*save-original-input-capture.mjs'
      - 'scripts/*inspect-saved-twelve-picks.mjs'
      - 'scripts/*explain-twelve-pick-archive-rows.mjs'
      - 'scripts/*inspect-raw-morning-capture.mjs'
      - '.github/workflows/boat-score-2-twelve-pick-research.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose each research test separately
        shell: bash
        run: |
          failures=0
          echo '::group::research first-place candidate mode regression'
          if node scripts/test-predict-twelve-independent-hypotheses.mjs; then echo 'PASS: candidate mode regression'; else echo 'FAIL: candidate mode regression'; failures=$((failures+1)); fi
          echo '::endgroup::'
          echo '::group::paired candidate mode comparison'
          if node scripts/test-compare-candidate-modes.mjs; then echo 'PASS: paired candidate mode comparison'; else echo 'FAIL: paired candidate mode comparison'; failures=$((failures+1)); fi
          echo '::endgroup::'
          echo "::group::1 node --check scripts/audit-twelve-picks-research.mjs"
          if node --check scripts/audit-twelve-picks-research.mjs; then echo "PASS: node --check scripts/audit-twelve-picks-research.mjs"; else echo "FAIL: node --check scripts/audit-twelve-picks-research.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::2 node --check scripts/prepare-twelve-pick-capture.mjs"
          if node --check scripts/prepare-twelve-pick-capture.mjs; then echo "PASS: node --check scripts/prepare-twelve-pick-capture.mjs"; else echo "FAIL: node --check scripts/prepare-twelve-pick-capture.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::3 node --check scripts/prepare-capture-from-api-response.mjs"
          if node --check scripts/prepare-capture-from-api-response.mjs; then echo "PASS: node --check scripts/prepare-capture-from-api-response.mjs"; else echo "FAIL: node --check scripts/prepare-capture-from-api-response.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::4 node scripts/test-audit-twelve-picks-research.mjs"
          if node scripts/test-audit-twelve-picks-research.mjs; then echo "PASS: node scripts/test-audit-twelve-picks-research.mjs"; else echo "FAIL: node scripts/test-audit-twelve-picks-research.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::5 node scripts/test-prepare-twelve-pick-capture.mjs"
          if node scripts/test-prepare-twelve-pick-capture.mjs; then echo "PASS: node scripts/test-prepare-twelve-pick-capture.mjs"; else echo "FAIL: node scripts/test-prepare-twelve-pick-capture.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::6 node scripts/test-prepare-capture-from-api-response.mjs"
          if node scripts/test-prepare-capture-from-api-response.mjs; then echo "PASS: node scripts/test-prepare-capture-from-api-response.mjs"; else echo "FAIL: node scripts/test-prepare-capture-from-api-response.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::7 node scripts/test-save-twelve-pick-capture.mjs"
          if node scripts/test-save-twelve-pick-capture.mjs; then echo "PASS: node scripts/test-save-twelve-pick-capture.mjs"; else echo "FAIL: node scripts/test-save-twelve-pick-capture.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::8 node scripts/test-prepare-snapshots-from-morning-capture.mjs"
          if node scripts/test-prepare-snapshots-from-morning-capture.mjs; then echo "PASS: node scripts/test-prepare-snapshots-from-morning-capture.mjs"; else echo "FAIL: node scripts/test-prepare-snapshots-from-morning-capture.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::9 node scripts/test-audit-strategy-provenance.mjs"
          if node scripts/test-audit-strategy-provenance.mjs; then echo "PASS: node scripts/test-audit-strategy-provenance.mjs"; else echo "FAIL: node scripts/test-audit-strategy-provenance.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::10 node scripts/test-morning-missing-data.mjs"
          if node scripts/test-morning-missing-data.mjs; then echo "PASS: node scripts/test-morning-missing-data.mjs"; else echo "FAIL: node scripts/test-morning-missing-data.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::11 node scripts/test-prestart-missing-data.mjs"
          if node scripts/test-prestart-missing-data.mjs; then echo "PASS: node scripts/test-prestart-missing-data.mjs"; else echo "FAIL: node scripts/test-prestart-missing-data.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::12 node scripts/test-diagnose-score-overlap.mjs"
          if node scripts/test-diagnose-score-overlap.mjs; then echo "PASS: node scripts/test-diagnose-score-overlap.mjs"; else echo "FAIL: node scripts/test-diagnose-score-overlap.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::13 node scripts/test-explain-racer-score.mjs"
          if node scripts/test-explain-racer-score.mjs; then echo "PASS: node scripts/test-explain-racer-score.mjs"; else echo "FAIL: node scripts/test-explain-racer-score.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::14 node scripts/test-assess-course-start.mjs"
          if node scripts/test-assess-course-start.mjs; then echo "PASS: node scripts/test-assess-course-start.mjs"; else echo "FAIL: node scripts/test-assess-course-start.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::15 node scripts/test-classify-ability-course-start.mjs"
          if node scripts/test-classify-ability-course-start.mjs; then echo "PASS: node scripts/test-classify-ability-course-start.mjs"; else echo "FAIL: node scripts/test-classify-ability-course-start.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::16 node scripts/test-rank-six-ability-course-start.mjs"
          if node scripts/test-rank-six-ability-course-start.mjs; then echo "PASS: node scripts/test-rank-six-ability-course-start.mjs"; else echo "FAIL: node scripts/test-rank-six-ability-course-start.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::17 node scripts/test-analyze-six-signal-agreement.mjs"
          if node scripts/test-analyze-six-signal-agreement.mjs; then echo "PASS: node scripts/test-analyze-six-signal-agreement.mjs"; else echo "FAIL: node scripts/test-analyze-six-signal-agreement.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::18 node scripts/test-group-six-candidates.mjs"
          if node scripts/test-group-six-candidates.mjs; then echo "PASS: node scripts/test-group-six-candidates.mjs"; else echo "FAIL: node scripts/test-group-six-candidates.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::19 node scripts/test-compare-six-signals-to-finish.mjs"
          if node scripts/test-compare-six-signals-to-finish.mjs; then echo "PASS: node scripts/test-compare-six-signals-to-finish.mjs"; else echo "FAIL: node scripts/test-compare-six-signals-to-finish.mjs"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::20 readiness evidence diagnostics"
          if node scripts/test-summarize-twelve-pick-readiness.mjs; then echo "PASS: readiness diagnostics"; else echo "FAIL: readiness diagnostics"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::21 original source inputs"
          if node scripts/test-validate-six-racer-source-inputs.mjs; then echo "PASS: original source input validation"; else echo "FAIL: original source input validation"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::22 archival capture with original inputs"
          if node scripts/test-prepare-capture-with-original-inputs.mjs; then echo "PASS: original input capture bridge"; else echo "FAIL: original input capture bridge"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::23 strict original-input archival"
          if node scripts/test-save-original-input-capture.mjs; then echo "PASS: strict original input archival"; else echo "FAIL: strict original input archival"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::24 saved capture evidence inventory"
          if node scripts/test-inspect-saved-twelve-picks.mjs; then echo "PASS: saved capture inventory"; else echo "FAIL: saved capture inventory"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::25 per-race archive evidence diagnostics"
          if node scripts/test-explain-twelve-pick-archive-rows.mjs; then echo "PASS: per-race archive diagnostics"; else echo "FAIL: per-race archive diagnostics"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::26 raw morning capture structure"
          if node scripts/test-inspect-raw-morning-capture.mjs; then echo "PASS: raw morning capture structure"; else echo "FAIL: raw morning capture structure"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::27 stage-aware six-racer inputs"
          if node scripts/test-inspect-six-racer-stage.mjs; then echo "PASS: stage-aware input completeness"; else echo "FAIL: stage-aware input completeness"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::28 official six-racer source extraction"
          if node scripts/test-extract-official-six-racer-inputs.mjs; then echo "PASS: official six-racer extraction"; else echo "FAIL: official six-racer extraction"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::29 prediction-to-official-source identity join"
          if node scripts/test-join-prediction-official-source.mjs; then echo "PASS: prediction-to-official-source join"; else echo "FAIL: prediction-to-official-source join"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::30 cutoff timestamp plausibility"
          if node scripts/test-inspect-capture-times.mjs; then echo "PASS: cutoff timestamp plausibility"; else echo "FAIL: cutoff timestamp plausibility"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::31 offline saved prediction/official pair inventory"
          if node scripts/test-inspect-saved-prediction-official-pairs.mjs; then echo "PASS: offline saved pair inventory"; else echo "FAIL: offline saved pair inventory"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "::group::32 twelve independent method result counters"
          if node scripts/test-compare-twelve-methods-with-results.mjs; then echo "PASS: twelve independent method counters"; else echo "FAIL: twelve independent method counters"; failures=$((failures+1)); fi
          echo "::endgroup::"
          echo "Failed checks: $failures"
          test "$failures" -eq 0
