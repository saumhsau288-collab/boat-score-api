name: Boat Score 2 official live probe (manual)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Race date YYYYMMDD (blank = today in Japan)'
        required: false
        type: string
      venue:
        description: 'Venue code 01-24'
        required: false
        default: '01'
        type: string
      race:
        description: 'Race number 1-12'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate official racelist (read-only)
        env:
          PROBE_DATE: ${{ inputs.date }}
          PROBE_VENUE: ${{ inputs.venue }}
          PROBE_RACE: ${{ inputs.race }}
        run: node --experimental-default-type=module boat-score-2-live-probe.mjs
