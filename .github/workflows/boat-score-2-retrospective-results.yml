name: Retrospective Boat Score 2 result evidence (research only)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed morning capture Actions run ID (must have prediction-captures artifact)'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline parsing and evidence guards
        run: |
          node scripts/test-extract-official-finish-candidate.mjs
          node scripts/test-collect-official-result-evidence.mjs
          node scripts/test-inspect-saved-tickets-vs-result-candidates.mjs
      - name: Download archived capture from specified run (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'Invalid Actions run ID'; exit 2
          fi
          mkdir -p archived-captures
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "boat-score-2-morning-raw-$SOURCE_RUN_ID" --dir archived-captures
      - name: Verify downloaded capture belongs to requested Actions run
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          found=0
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            [[ "$name" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            node --input-type=module - "$file" "$SOURCE_RUN_ID" <<'NODE'
          import fs from 'node:fs';
          const [file,runId]=process.argv.slice(2);
          const capture=JSON.parse(fs.readFileSync(file,'utf8'));
          if(String(capture.run?.workflowRunId)!==runId ||
             !Array.isArray(capture.records) ||
             !/^20\d{6}$/.test(String(capture.date))) {
            throw Error('Archived capture identity or schema does not match requested run');
          }
          NODE
            found=$((found+1))
          done < <(find archived-captures -type f -name '*.json' -print0)
          if [ "$found" -eq 0 ]; then echo 'No matching capture files in archive'; exit 1; fi
      - name: Collect results only for dates already ended in JST
        run: |
          mkdir -p retrospective-results
          count=0
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            [[ "$name" =~ ^20[0-9]{6}-[0-9]+\.json$ ]] || continue
            node scripts/collect-official-result-evidence.mjs "$file" > "retrospective-results/${name%.json}-official-result-candidates.json"
            node scripts/inspect-saved-tickets-vs-result-candidates.mjs "$file" "retrospective-results/${name%.json}-official-result-candidates.json" > "retrospective-results/${name%.json}-candidate-diagnostics.json"
            count=$((count+1))
          done < <(find archived-captures -type f -name '*.json' -print0)
          if [ "$count" -eq 0 ]; then echo 'No matching saved prediction captures'; exit 1; fi
      - name: Summarize retrospective candidate evidence (not official accuracy)
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='retrospective-results';
          const names=fs.existsSync(dir)?fs.readdirSync(dir).filter(n=>n.endsWith('-candidate-diagnostics.json')):[];
          const lines=['## Boat Score 2 retrospective result candidate checks','',
            'Unverified result candidates are not official hit rates or weight-tuning evidence.',''];
          for(const name of names){
            const report=JSON.parse(fs.readFileSync(dir+'/'+name,'utf8'));
            lines.push('### '+(report.date||name),'','| Diagnostic | Races |','|---|---:|',
              ...Object.entries(report.counts||{}).map(([k,v])=>'| '+k+' | '+v+' |'),
              '| Verified comparisons | '+report.verifiedComparisons+' |',
              '| Eligible for weight tuning | '+report.eligibleForWeightTuning+' |','');
          }
          if(!names.length)lines.push('No candidate diagnostics were produced.','');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - name: Archive retrospective source evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-score-2-retrospective-${{ github.run_id }}
          path: retrospective-results/
          if-no-files-found: warn
          retention-days: 30
