name: Research official connection diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/research-official-connection-diagnostics.yml'
      - 'scripts/diagnose-official-racelist-connection.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare official homepage and racelist network responses
        run: node scripts/diagnose-official-racelist-connection.mjs
