name: Deploy Boat Score 2 scheduled preview (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boat-score-2-scheduled-preview
  cancel-in-progress: false

jobs:
  deploy-scheduled-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated development branch
        uses: actions/checkout@v4
        with:
          ref: fix-boat-score-2-syntax-20261115
          persist-credentials: false
      - name: Check Worker JavaScript
        run: node --input-type=module --check < worker.js
      - name: Check required Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.BOAT_SCORE_MORNING_KV_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CF_KV_ID" || { echo "::error::BOAT_SCORE_MORNING_KV_ID is missing"; exit 1; }
          test "${#CF_KV_ID}" -eq 32 || { echo "::error::KV namespace ID must be 32 characters"; exit 1; }
          [[ "$CF_KV_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::Invalid KV namespace ID"; exit 1; }
      - name: Generate preview-only Wrangler configuration
        env:
          CF_KV_ID: ${{ secrets.BOAT_SCORE_MORNING_KV_ID }}
        run: |
          cat > wrangler.scheduled.toml <<EOF
          name = "boat-score-2-scheduled-preview"
          main = "worker.js"
          compatibility_date = "2026-11-01"

          [triggers]
          crons = ["0,10,20,30,40,50 23 * * *", "0,10,20,30,40,50 0 * * *"]

          [[kv_namespaces]]
          binding = "MORNING_KV"
          id = "$CF_KV_ID"
          EOF
      - name: Deploy separate scheduled preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.scheduled.toml
