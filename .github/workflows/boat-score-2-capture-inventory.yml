name: Inventory stored Boat Score 2 morning captures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/inventory_morning_capture_artifacts.py'
      - 'scripts/test_inventory_morning_capture_artifacts.py'
      - '.github/workflows/boat-score-2-capture-inventory.yml'
  pull_request:
    paths:
      - 'scripts/inventory_morning_capture_artifacts.py'
      - 'scripts/test_inventory_morning_capture_artifacts.py'
      - '.github/workflows/boat-score-2-capture-inventory.yml'
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test inventory counting logic
        run: |
          python3 -m py_compile scripts/inventory_morning_capture_artifacts.py
          python3 -m unittest discover -s scripts -p 'test_inventory_morning_capture_artifacts.py' -v
      - name: Count retained morning raw artifacts
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/inventory_morning_capture_artifacts.py
