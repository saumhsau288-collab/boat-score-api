name: Audit saved morning prediction evidence
on:
  push:
    branches:
      - research/score-evidence-gate-20261120
    paths:
      - '.github/workflows/research-saved-capture-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve original saved capture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research-artifact
          gh api repos/${{ github.repository }}/actions/artifacts/14586303082/zip > research-artifact/capture.zip
          unzip -l research-artifact/capture.zip
          unzip -q research-artifact/capture.zip -d research-artifact/unpacked
      - name: Audit saved original score inputs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {inspectScoreEvidence} from './scripts/inspect-score-evidence-research.mjs';
          function walk(dir){return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(dir,e.name)):[path.join(dir,e.name)]);}
          const files=walk('research-artifact/unpacked').filter(f=>f.endsWith('.json'));
          const captures=files.map(file=>({file,data:JSON.parse(fs.readFileSync(file,'utf8'))})).filter(x=>Array.isArray(x.data?.records));
          if(captures.length!==1)throw Error('Expected exactly one raw capture, got '+captures.length);
          const report=inspectScoreEvidence(captures[0].data);
          const summary={sourceArtifactId:14586303082,sourceFile:path.basename(captures[0].file),total:report.total,ready:report.ready,withRankedScores:report.withRankedScores,completeOriginalInputs:report.completeOriginalInputs,eligibleForWeightTuning:report.eligibleForWeightTuning,warning:report.warning};
          fs.writeFileSync('research-artifact/score-evidence-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-score-evidence-summary
          path: research-artifact/score-evidence-summary.json
