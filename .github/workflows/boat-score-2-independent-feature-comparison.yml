name: Research independent feature comparison
on:
  push:
    branches: [research/st-course-holdout-20261121]
    paths:
      - scripts/build-independent-feature-comparison.mjs
      - scripts/test-build-independent-feature-comparison.mjs
      - .github/workflows/boat-score-2-independent-feature-comparison.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-build-independent-feature-comparison.mjs
