name: Boat Score 2 isolated validation

on:
  push:
    branches:
      - fix-boat-score-2-syntax-20261115
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview Worker syntax without deployment
        run: node --input-type=module --check < worker.js
      - name: Validate verified historical statistics
        run: node history-analysis.test.mjs
      - name: Validate provisional ranking and missing-data handling
        run: node ranking.test.mjs
      - name: Validate historical course and start diagnostics
        run: node scripts/test-course-start-evaluation.mjs
      - name: Validate official result parsing diagnostics
        run: node scripts/test-extract-official-result-diagnostics.mjs
      - name: Validate morning record recovery
        run: node scripts/test-morning-recovery.mjs
      - name: Validate morning ranking persistence and linked evidence display
        run: node scripts/test-morning-ranking-persistence.mjs
      - name: Validate adjacent win-rate research
        run: |
          node --check scripts/run-historical-adjacent-research.mjs
          node scripts/test-analyze-adjacent-winrate-finishes.mjs
      - name: Verify Boat Score 2 endpoints and isolation
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const code=readFileSync('worker.js','utf8');
          for(const endpoint of ['/api/version','/api/official/active-venues','/api/morning/snapshot']){
            assert.ok(code.includes(endpoint),'Missing endpoint: '+endpoint);
          }
          assert.ok(code.includes("app:'Boat Score 2 preview'"),'Preview identity missing');
          assert.ok(code.includes('MORNING_KV'),'Morning storage binding missing');
          assert.ok(code.includes('raceDataController.abort()'),'Race-change cancellation missing');
          assert.ok(code.includes('AbortSignal.timeout(15000)'),'Verified race list timeout missing');
          assert.ok(code.includes('raceListController.abort()'),'Previous race-list cancellation missing');
          console.log('Preview-only static checks passed');
          NODE
