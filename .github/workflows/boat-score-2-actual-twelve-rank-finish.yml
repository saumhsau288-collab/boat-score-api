name: Research actual thirteen-race rank-finish audit
on:
  push:
    branches: [research/st-course-holdout-20261121]
    paths: [.github/workflows/boat-score-2-actual-twelve-rank-finish.yml, scripts/audit-rank-finish-official.mjs, scripts/test-audit-rank-finish-official.mjs, scripts/audit-prediction-input-provenance.mjs, scripts/test-audit-prediction-input-provenance.mjs, scripts/audit-saved-prediction-official-provenance.mjs, scripts/test-audit-saved-prediction-official-provenance.mjs, scripts/audit-future-feature-provenance.mjs, scripts/test-audit-future-feature-provenance.mjs, scripts/build-research-feature-evidence-record.mjs, scripts/test-build-research-feature-evidence-record.mjs, scripts/report-live-feature-readiness.mjs, scripts/test-report-live-feature-readiness.mjs, scripts/analyze-winner-followers.mjs, scripts/analyze-winner-followers.test.mjs, scripts/compare-winner-followers-winrates.mjs, scripts/compare-winner-followers-winrates.test.mjs, research/evidence/20261120-official-result-pages-transcription.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test date-safe historical join
        run: |
          node scripts/analyze-winner-followers.test.mjs
          node scripts/compare-winner-followers-winrates.test.mjs
          node scripts/test-audit-rank-finish-official.mjs
          node scripts/test-audit-prediction-input-provenance.mjs
          node scripts/test-audit-saved-prediction-official-provenance.mjs
          node scripts/test-audit-future-feature-provenance.mjs
          node scripts/test-build-research-feature-evidence-record.mjs
          node scripts/test-report-live-feature-readiness.mjs
          node scripts/test-report-saved-capture-readiness.mjs
          node scripts/test-report-capture-venue-bottlenecks.mjs
          node scripts/test-report-capture-race-bottlenecks.mjs
          node scripts/test-compare-official-six-parsers.mjs
          node scripts/test-compare-saved-official-html-parsers.mjs
      - name: Download actual saved scores and official comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prediction-captures
          for id in 14586303082 14701499660 14704048147; do
            gh api "/repos/${{ github.repository }}/actions/artifacts/$id/zip" > "prediction-captures/$id.zip"
            unzip -o "prediction-captures/$id.zip" -d prediction-captures
          done
      - name: Audit saved scores against independently transcribed official finishes
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import {auditRankFinishWithOfficial} from './scripts/audit-rank-finish-official.mjs';
          const saved=JSON.parse(fs.readFileSync('prediction-captures/20261120-44639859914.json','utf8'));
          const official=JSON.parse(fs.readFileSync('prediction-captures/twelve-race-official-feature-comparison.json','utf8'));
          const results=JSON.parse(fs.readFileSync('research/evidence/20261120-official-result-pages-transcription.json','utf8'));

          // Compare actual archived predictor responses against the separate official feature captures.
          // These are retrospective comparisons, never evidence of inputs used by the deployed predictor.
          const {auditSavedPredictionOfficialProvenance}=await import('./scripts/audit-saved-prediction-official-provenance.mjs');
          const archivedOfficial=official.races.map(r=>({date:r.date,venue:r.venue,race:r.race,
            racers:r.comparison?.rows?.map(x=>({boat:x.boat,racerId:x.racerId}))??[],
            receivedAt:r.officialCaptureReceivedAt??null}));
          const ashCapture=JSON.parse(fs.readFileSync('prediction-captures/research-official-20261120-21-4.json','utf8'));
          if(ashCapture.status!=='captured_research_inputs'||ashCapture.racers?.length!==6||
             ashCapture.date!=='20261120'||Number(ashCapture.venue)!==21||Number(ashCapture.race)!==4)
            throw Error('Ashiya capture artifact identity or racer count invalid');
          const {buildIndependentFeatureComparison}=await import('./scripts/build-independent-feature-comparison.mjs');
          const ashComparison=buildIndependentFeatureComparison({official:ashCapture.racers});
          if(ashComparison.status!=='comparison_only'||ashComparison.rows.length!==6||
             ashComparison.rows.some(x=>!/^\d{4}$/.test(x.racerId)||!Number.isFinite(x.nationalWinRate)||
                !Number.isFinite(x.localWinRateRaw)||!Number.isFinite(x.motor2Rate)))
            throw Error('Ashiya six official racer metrics not complete');
          const thirteenOfficial=[...official.races,{date:ashCapture.date,venue:ashCapture.venue,race:ashCapture.race,
            officialCaptureReceivedAt:ashCapture.receivedAt,comparison:ashComparison}];
          const report=auditRankFinishWithOfficial({savedRecords:saved.records,officialRaces:thirteenOfficial,results:results.results});
          const provenance=auditSavedPredictionOfficialProvenance({savedRecords:saved.records.filter(x=>x?.response?.ready===true),officialRaces:[...archivedOfficial,ashCapture]});
          if(provenance.attempted!==14||provenance.matched!==13||provenance.held!==1||
            provenance.originalInputsVerified!==0||provenance.independentlyAuthenticatedBeforeRace!==0)
            throw Error('unexpected real archived provenance counts');
          if(provenance.rows.some(x=>x.originalInputsVerified===true||x.eligibleForCalibration===true))
            throw Error('retrospective provenance must not be calibrated');
          fs.writeFileSync('prediction-captures/actual-thirteen-prediction-official-provenance.json',JSON.stringify(provenance,null,2)+'\n');
          // A missing official feature comparison does not imply missing official finish data.
          const ash=provenance.rows.find(x=>String(x.date)==='20261120'&&Number(x.venue)===21&&Number(x.race)===4);
          const ashFinish=results.results.find(x=>String(x.date)==='20261120'&&Number(x.venue)===21&&Number(x.race)===4&&x.verified===true);
          if(ash?.status!=='retrospective_comparison_only'||!Array.isArray(ashFinish?.finishOrder)||ashFinish.finishOrder.length!==6)
            throw Error('Ashiya 4R finish evidence and feature gap changed');
          console.log('ASHIYA_4R_EVIDENCE '+JSON.stringify({officialFinishAvailable:true,officialFeatureComparisonAvailable:true,
            finishOrder:ashFinish.finishOrder,eligibleForCalibration:false}));
          const readiness={date:'20261120',venue:21,race:4,officialFinishAvailable:true,
            officialFinishOrder:ashFinish.finishOrder,officialFeatureComparisonAvailable:true,
            savedPredictionAvailable:true,preRaceAverageSTVerified:false,makulabo50Verified:false,
            originalPredictionInputsVerified:false,eligibleForCalibration:false,
            nextAction:'capture independently authenticated pre-race prediction inputs for future races; historical data cannot authenticate original inputs'};
          fs.writeFileSync('prediction-captures/ashiya-4r-source-gap.json',JSON.stringify(readiness,null,2)+'\n');
          console.log('REAL_PROVENANCE '+JSON.stringify({attempted:provenance.attempted,matched:provenance.matched,
            held:provenance.held,originalInputsVerified:provenance.originalInputsVerified,
            independentlyAuthenticatedBeforeRace:provenance.independentlyAuthenticatedBeforeRace,statuses:provenance.statuses}));
          for(const row of provenance.rows.filter(x=>x.status!=='retrospective_comparison_only'))
            console.log('HELD_PROVENANCE '+JSON.stringify({date:row.date,venue:row.venue,race:row.race,status:row.status}));
          if(report.joinedCount!==13||report.rows.length!==13||
            report.rows.some(r=>r.status!=='retrospective_comparison_only')||
            report.rows.filter(r=>r.status==='retrospective_comparison_only').some(r=>r.boats.some(b=>!b.officialMetricsAvailable)))
            throw Error('unexpected twelve-race rank-finish join');
          fs.writeFileSync('prediction-captures/actual-thirteen-rank-finish-audit.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({joined:report.joinedCount,missing:report.rows.length-report.joinedCount,
            topScoreWinners:report.rows.filter(r=>r.topScoreActualFinish===1).length,
            lowRankWinners:report.rows.filter(r=>r.winnerScoreRank>=4).length}));
          const totalBoats=report.rows.filter(x=>x.status==='retrospective_comparison_only').reduce((n,x)=>n+x.boats.length,0);
          if(totalBoats!==78||report.summary.topScoreWinners!==5||report.summary.lowerScoreWinners!==6||
             report.summary.featureAvailability.nationalWinRateAvailable.available!==78||
             report.summary.featureAvailability.localWinRateAvailable.available!==78||
             report.summary.featureAvailability.motor2RateAvailable.available!==78||
             report.summary.featureAvailability.preRaceAverageSTAvailable.available!==0||
             report.summary.featureAvailability.makulabo50Available.available!==0)
            throw Error('unexpected real 13-race / 78-racer evidence counts');
          console.log('FEATURE_AVAILABILITY '+JSON.stringify(report.summary.featureAvailability));
          console.log('RANK_DISTRIBUTION '+JSON.stringify(report.summary.winnerByScoreRank));
          console.log('TOP_SCORE_FINISH_DISTRIBUTION '+JSON.stringify(report.summary.topScoreByActualFinish));
          for(const row of report.summary.topScoreMisses)console.log('TOP_SCORE_MISS '+JSON.stringify(row));
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-thirteen-rank-finish-audit-${{ github.run_id }}
          path: |
            prediction-captures/actual-twelve-rank-finish-audit.json
            prediction-captures/actual-twelve-prediction-official-provenance.json
            prediction-captures/ashiya-4r-source-gap.json
          retention-days: 30
