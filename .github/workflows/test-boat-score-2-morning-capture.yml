name: Test Boat Score 2 morning capture
on:
  pull_request:
    paths:
      - 'scripts/summarize-official-venue-activity.mjs'
      - 'scripts/test-summarize-official-venue-activity.mjs'
      - 'scripts/capture-existing-boat-score-2-predictions.mjs'
      - 'scripts/fetch-with-timeout-retry.mjs'
      - 'scripts/test-fetch-with-timeout-retry.mjs'
      - 'scripts/validate-morning-capture.mjs'
      - 'scripts/test-validate-morning-capture.mjs'
      - '.github/workflows/test-boat-score-2-morning-capture.yml'
      - '.github/workflows/boat-score-2-capture-morning-predictions.yml'
      - 'scripts/audit-morning-official-cutoffs.mjs'
      - 'scripts/test-audit-morning-official-cutoffs.mjs'
      - 'scripts/capture-official-cutoff-source.mjs'
      - 'scripts/extract-official-cutoff-candidate.mjs'
      - 'scripts/test-extract-official-cutoff-candidate.mjs'
      - 'scripts/inspect-official-page-identity.mjs'
      - 'scripts/test-inspect-official-page-identity.mjs'
      - 'scripts/classify-official-response-source.mjs'
      - 'scripts/test-classify-official-response-source.mjs'
      - 'scripts/test-morning-capture-file-isolation.mjs'
      - 'scripts/audit-morning-capture-outcomes.mjs'
      - 'scripts/test-audit-morning-capture-outcomes.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/capture-existing-boat-score-2-predictions.mjs
      - run: node scripts/test-summarize-official-venue-activity.mjs
      - run: node scripts/test-fetch-with-timeout-retry.mjs
      - run: node scripts/test-validate-morning-capture.mjs
      - run: node scripts/test-audit-morning-official-cutoffs.mjs
      - run: node --check scripts/capture-official-cutoff-source.mjs
      - run: node scripts/test-extract-official-cutoff-candidate.mjs
      - run: node scripts/test-inspect-official-page-identity.mjs
      - run: node scripts/test-classify-official-response-source.mjs
      - run: node scripts/test-morning-capture-file-isolation.mjs
      - run: node scripts/test-audit-morning-capture-outcomes.mjs
