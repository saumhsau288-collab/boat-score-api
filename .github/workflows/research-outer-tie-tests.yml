name: Research outer tie regression tests
on:
  push:
    branches:
      - research-outer-tie-comparison-20261124
    paths:
      - 'scripts/compare-outer-tie-historical.mjs'
      - 'scripts/test-compare-outer-tie-historical.mjs'
      - 'scripts/compare-three-tie-policies.mjs'
      - 'scripts/test-compare-three-tie-policies.mjs'
      - 'scripts/relative-features.mjs'
      - 'scripts/test-relative-features.mjs'
      - 'scripts/audit-twelve-strategy-diversity.mjs'
      - 'scripts/test-audit-twelve-strategy-diversity.mjs'
      - 'scripts/twelve-independent-strategies.mjs'
      - 'scripts/test-twelve-independent-strategies.mjs'
      - 'scripts/evaluate-verified-outer-pairs.mjs'
      - 'scripts/test-evaluate-verified-outer-pairs.mjs'
      - 'scripts/audit-all-outer-pairs.mjs'
      - 'scripts/test-audit-all-outer-pairs.mjs'
      - 'scripts/audit-outer-challenges.mjs'
      - 'scripts/test-audit-outer-challenges.mjs'
      - 'scripts/sweep-outer-thresholds.mjs'
      - 'scripts/test-sweep-outer-thresholds.mjs'
      - 'scripts/validate-historical-provenance.mjs'
      - 'scripts/test-validate-historical-provenance.mjs'
      - 'scripts/unique-historical-races.mjs'
      - 'scripts/test-unique-historical-races.mjs'
      - '.github/workflows/research-outer-tie-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check scripts/compare-outer-tie-historical.mjs
          node --check scripts/compare-three-tie-policies.mjs
          node --check scripts/relative-features.mjs
          node --check scripts/test-compare-outer-tie-historical.mjs
          node --check scripts/test-compare-three-tie-policies.mjs
          node --check scripts/test-relative-features.mjs
          node --check scripts/audit-twelve-strategy-diversity.mjs
          node --check scripts/test-audit-twelve-strategy-diversity.mjs
          node --check scripts/twelve-independent-strategies.mjs
          node --check scripts/test-twelve-independent-strategies.mjs
          node --check scripts/evaluate-verified-outer-pairs.mjs
          node --check scripts/test-evaluate-verified-outer-pairs.mjs
          node --check scripts/audit-all-outer-pairs.mjs
          node --check scripts/test-audit-all-outer-pairs.mjs
          node --check scripts/audit-outer-challenges.mjs
          node --check scripts/test-audit-outer-challenges.mjs
          node --check scripts/sweep-outer-thresholds.mjs
          node --check scripts/test-sweep-outer-thresholds.mjs
          node --check scripts/validate-historical-provenance.mjs
          node --check scripts/test-validate-historical-provenance.mjs
          node --check scripts/unique-historical-races.mjs
          node --check scripts/test-unique-historical-races.mjs
      - name: Two-policy fixture
        run: node scripts/test-compare-outer-tie-historical.mjs
      - name: Three-policy fixture
        run: node scripts/test-compare-three-tie-policies.mjs
      - name: Adjacent-course relative features
        run: node scripts/test-relative-features.mjs
      - name: Outer-challenge audit fixture
        run: node scripts/test-audit-outer-challenges.mjs
      - name: All relative outer-course pairs fixture
        run: node scripts/test-audit-all-outer-pairs.mjs
      - name: Twelve strategy diversity fixture
        run: node scripts/test-audit-twelve-strategy-diversity.mjs
      - name: Twelve independent hypothesis fixture
        run: node scripts/test-twelve-independent-strategies.mjs
      - name: Verified all-course evaluation fixture
        run: node scripts/test-evaluate-verified-outer-pairs.mjs
      - name: Threshold grid fixture
        run: node scripts/test-sweep-outer-thresholds.mjs
      - name: Provenance gate fixture
        run: node scripts/test-validate-historical-provenance.mjs
      - name: Historical race identity fixture
        run: node scripts/test-unique-historical-races.mjs
      - name: Test status summary
        if: always()
        run: |
          echo '## Boat Score 2 synthetic research tests' >> "$GITHUB_STEP_SUMMARY"
          echo 'These tests check code behavior only; they are not historical prediction accuracy.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Overall job status: ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
