name: Validate Boat Score 2 scoring modules

on:
  push:
    branches: [main]
    paths:
      - 'boat-score-2-*.js'
      - 'boat-score-2-*.mjs'
      - '.github/workflows/boat-score-2-scoring-tests.yml'
  pull_request:
    paths:
      - 'boat-score-2-*.js'
      - 'boat-score-2-*.mjs'
      - '.github/workflows/boat-score-2-scoring-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoring-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and run independent tests
        run: |
          node --experimental-default-type=module --check boat-score-2-scoring.js
          node --experimental-default-type=module --check boat-score-2-classification.js
          node --experimental-default-type=module --check boat-score-2-morning.js
          node --experimental-default-type=module --check boat-score-2-adapter.js
          node --experimental-default-type=module --check boat-score-2-official.js
          node --experimental-default-type=module --check boat-score-2-boat-mapping.js
          node --experimental-default-type=module --check boat-score-2-official-metrics.js
          node --experimental-default-type=module --check boat-score-2-morning-pipeline.js
          node --experimental-default-type=module --check boat-score-2-metric-extractor.js
          node --experimental-default-type=module --check boat-score-2-official-pipeline.js
          node --experimental-default-type=module --check boat-score-2-html-diagnostics.js
          node --experimental-default-type=module boat-score-2-scoring.test.mjs
          node --experimental-default-type=module boat-score-2-classification.test.mjs
          node --experimental-default-type=module boat-score-2-morning.test.mjs
          node --experimental-default-type=module boat-score-2-adapter.test.mjs
          node --experimental-default-type=module boat-score-2-official.test.mjs
          node --experimental-default-type=module boat-score-2-boat-mapping.test.mjs
          node --experimental-default-type=module boat-score-2-official-metrics.test.mjs
          node --experimental-default-type=module boat-score-2-morning-pipeline.test.mjs
          node --experimental-default-type=module boat-score-2-metric-extractor.test.mjs
          node --experimental-default-type=module boat-score-2-official-pipeline.test.mjs
          node --experimental-default-type=module --check boat-score-2-recent50-identity.js
          node --experimental-default-type=module boat-score-2-recent50-identity.test.mjs
          node --experimental-default-type=module --check boat-score-2-makulabo-heatmap-adapter.js
          node --experimental-default-type=module boat-score-2-makulabo-heatmap-adapter.test.mjs
          node --experimental-default-type=module boat-score-2-local-rate-fallback.test.mjs
          node --experimental-default-type=module boat-score-2-html-diagnostics.test.mjs
