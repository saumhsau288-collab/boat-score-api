name: Validate Boat Score 2 scoring modules

on:
  push:
    branches: [main]
    paths:
      - 'boat-score-2-*.js'
      - 'boat-score-2-*.mjs'
      - '.github/workflows/boat-score-2-scoring-tests.yml'
  pull_request:
    paths:
      - 'boat-score-2-*.js'
      - 'boat-score-2-*.mjs'
      - '.github/workflows/boat-score-2-scoring-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoring-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and run independent tests
        run: |
          node --experimental-default-type=module --check boat-score-2-scoring.js
          node --experimental-default-type=module --check boat-score-2-classification.js
          node --experimental-default-type=module --check boat-score-2-morning.js
          node --experimental-default-type=module --check boat-score-2-adapter.js
          node --experimental-default-type=module --check boat-score-2-official.js
          node --experimental-default-type=module --check boat-score-2-boat-mapping.js
          node --experimental-default-type=module --check boat-score-2-official-metrics.js
          node --experimental-default-type=module --check boat-score-2-morning-pipeline.js
          node --experimental-default-type=module --check boat-score-2-metric-extractor.js
          node --experimental-default-type=module --check boat-score-2-official-pipeline.js
          node --experimental-default-type=module --check boat-score-2-html-diagnostics.js
          node --experimental-default-type=module boat-score-2-scoring.test.mjs
          node --experimental-default-type=module boat-score-2-classification.test.mjs
          node --experimental-default-type=module boat-score-2-morning.test.mjs
          node --experimental-default-type=module boat-score-2-adapter.test.mjs
          node --experimental-default-type=module boat-score-2-official.test.mjs
          node --experimental-default-type=module boat-score-2-boat-mapping.test.mjs
          node --experimental-default-type=module boat-score-2-official-metrics.test.mjs
          node --experimental-default-type=module boat-score-2-morning-pipeline.test.mjs
          node --experimental-default-type=module boat-score-2-metric-extractor.test.mjs
          node --experimental-default-type=module boat-score-2-official-pipeline.test.mjs
          node --experimental-default-type=module --check boat-score-2-recent50-identity.js
          node --experimental-default-type=module boat-score-2-recent50-identity.test.mjs
          node --experimental-default-type=module boat-score-2-html-diagnostics.test.mjs
          node --experimental-default-type=module --check boat-score-2-racer-experiment.js
          node --experimental-default-type=module --check boat-score-2-historical-comparison.js
          node --experimental-default-type=module boat-score-2-racer-experiment.test.mjs
          node --experimental-default-type=module boat-score-2-historical-comparison.test.mjs
          node --experimental-default-type=module --check boat-score-2-offline-prediction.js
          node --experimental-default-type=module boat-score-2-offline-prediction.test.mjs
          node --experimental-default-type=module boat-score-2-entry-alerts.test.mjs
          node --experimental-default-type=module boat-score-2-entry-alert-view.test.mjs
          node --experimental-default-type=module boat-score-2-entry-alert-integration.test.mjs
          node --experimental-default-type=module scripts/predict-boat-score-2-experiment.test.mjs
          node --experimental-default-type=module scripts/extract-archived-racer-features.test.mjs
          node --experimental-default-type=module scripts/fetch-historical-racelist-sample.test.mjs
          node --experimental-default-type=module scripts/compare-makulabo-recent50.test.mjs
          node --experimental-default-type=module scripts/predict-selected-boat-race.test.mjs
          node --experimental-default-type=module boat-score-2-entry-scenarios.test.mjs
          node --experimental-default-type=module boat-score-2-venue-tendencies.test.mjs
          node --experimental-default-type=module --check boat-score-2-racer-weight-study.js
          node --experimental-default-type=module boat-score-2-racer-weight-study.test.mjs
          node --experimental-default-type=module --check boat-score-2-archived-capture-audit.js
          node --experimental-default-type=module boat-score-2-archived-capture-audit.test.mjs
          node scripts/audit-historical-source-coverage.test.mjs

      - name: Probe actual official Tokuyama racelist (research only)
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {predictSelectedRace} from './scripts/predict-selected-boat-race.mjs';
          const r=await predictSelectedRace({date:'20261119',venue:18,race:2});
          const report={target:'20261119 Tokuyama 2R',status:r.status,officialUrl:r.provenance?.officialUrl??null,htmlSha256:r.provenance?.htmlSha256??null,diagnostics:r.diagnostics??null,parsedRacerCount:r.ranking?.filter(x=>x.status==='evaluated').length??r.racers?.length??0,provisionalMainCount:r.main?.length??0,provisionalUpsetCount:r.upset?.length??0,main:r.main??[],upset:r.upset??[],ranking:r.ranking??[],entryCourses:r.entryCourses??null,entryScenario:r.entryScenario??null,preCutoffSnapshotAuthenticated:false,warning:'Historical snapshot and assumed entry; no authenticated pre-cutoff validation or result comparison'};
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## 公式出走表の実データ検証（過去レース・研究用）\n\n```json\n'+JSON.stringify(report,null,2)+'\n```\n\n※取得時点のアーカイブであり、締切前のデータとしては認証されていません。\n');
          console.log(JSON.stringify(report));
          // Independently fetch the corresponding official result page; no score tuning.
          const resultUrl='https://www.boatrace.jp/owpc/pc/race/raceresult?rno=2&jcd=18&hd=20261119';
          try {
            const res=await fetch(resultUrl,{signal:AbortSignal.timeout(15000),headers:{accept:'text/html'}});
            if(!res.ok)throw Error('HTTP '+res.status);
            const html=await res.text();
            const {extractOfficialResultRacers}=await import('./scripts/extract-official-result-racers.mjs');
            const parsed=extractOfficialResultRacers({pages:[{date:'20261119',venue:18,race:2,url:resultUrl,status:'raw_html_saved',html}]});
            const row=parsed.rows[0];
            const finish=row.podium?.join('-')??null;
            const predicted=[...(r.main??[]),...(r.upset??[])].map(t=>t.ticket);
            const actualCourses=row.entryCoursesExtracted?Array.from({length:6},(_,i)=>row.racers.find(x=>x.boat===i+1)?.actualEntryCourse??null):null;
            const entryChanged=actualCourses?.some((course,i)=>course!==i+1)??null;
            let actualEntryScenario=null;
            if(actualCourses&&actualCourses.every(x=>Number.isInteger(x))){
              const replay=await predictSelectedRace({date:'20261119',venue:18,race:2,courses:actualCourses});
              const replayTickets=[...(replay.main??[]),...(replay.upset??[])].map(t=>t.ticket);
              actualEntryScenario={courses:actualCourses,entryChanged,status:replay.status,mainCount:replay.main?.length??0,upsetCount:replay.upset?.length??0,matchedTicket:finish&&replayTickets.includes(finish)?finish:null,matchedCategory:finish?(replay.main??[]).some(t=>t.ticket===finish)?'main':(replay.upset??[]).some(t=>t.ticket===finish)?'upset':'none':null,warning:'Post-race actual entry is retrospective information and cannot be claimed as known pre-cutoff'};
            }
            const comparison={actualEntryScenario,resultPageFetched:true,parseStatus:row.status,podium:finish,entryCoursesExtracted:row.entryCoursesExtracted??false,matchedTicket:finish&&predicted.includes(finish)?finish:null,matchedCategory:finish?(r.main??[]).some(t=>t.ticket===finish)?'main':(r.upset??[]).some(t=>t.ticket===finish)?'upset':'none':null,independentlyVerified:false,preCutoffSnapshotAuthenticated:false};
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## 確定結果との研究用照合\n\n```json\n'+JSON.stringify(comparison,null,2)+'\n```\n');
            console.log('OFFICIAL_RESULT_COMPARISON '+JSON.stringify(comparison));
          } catch(error) { console.log('OFFICIAL_RESULT_COMPARISON '+JSON.stringify({resultPageFetched:false,error:String(error.message).slice(0,120)})); }

          JS
