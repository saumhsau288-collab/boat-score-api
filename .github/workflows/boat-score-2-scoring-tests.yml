name: Validate Boat Score 2 scoring modules

on:
  push:
    branches: [main, research-cutoff-join-gate-20261120]
    paths:
      - 'boat-score-2-*.js'
      - 'boat-score-2-*.mjs'
      - 'scripts/*.mjs'
      - '.github/workflows/boat-score-2-scoring-tests.yml'
  pull_request:
    paths:
      - 'boat-score-2-*.js'
      - 'boat-score-2-*.mjs'
      - 'scripts/*.mjs'
      - '.github/workflows/boat-score-2-scoring-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scoring-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and run independent tests
        run: |
          node --experimental-default-type=module --check boat-score-2-scoring.js
          node --experimental-default-type=module --check boat-score-2-classification.js
          node --experimental-default-type=module --check boat-score-2-morning.js
          node --experimental-default-type=module --check boat-score-2-adapter.js
          node --experimental-default-type=module --check boat-score-2-official.js
          node --experimental-default-type=module --check boat-score-2-boat-mapping.js
          node --experimental-default-type=module --check boat-score-2-official-metrics.js
          node --experimental-default-type=module --check boat-score-2-morning-pipeline.js
          node --experimental-default-type=module --check boat-score-2-metric-extractor.js
          node --experimental-default-type=module --check boat-score-2-official-pipeline.js
          node --experimental-default-type=module --check boat-score-2-html-diagnostics.js
          node --experimental-default-type=module boat-score-2-scoring.test.mjs
          node --experimental-default-type=module boat-score-2-classification.test.mjs
          node --experimental-default-type=module boat-score-2-morning.test.mjs
          node --experimental-default-type=module boat-score-2-adapter.test.mjs
          node --experimental-default-type=module boat-score-2-official.test.mjs
          node --experimental-default-type=module boat-score-2-boat-mapping.test.mjs
          node --experimental-default-type=module boat-score-2-official-metrics.test.mjs
          node --experimental-default-type=module boat-score-2-morning-pipeline.test.mjs
          node --experimental-default-type=module boat-score-2-metric-extractor.test.mjs
          node --experimental-default-type=module boat-score-2-official-pipeline.test.mjs
          node --experimental-default-type=module --check boat-score-2-recent50-identity.js
          node --experimental-default-type=module boat-score-2-recent50-identity.test.mjs
          node --experimental-default-type=module --check boat-score-2-makulabo-score-comparison.js
          node --experimental-default-type=module boat-score-2-makulabo-score-comparison.test.mjs
          node --experimental-default-type=module --check boat-score-2-makulabo-official-join.js
          node --experimental-default-type=module boat-score-2-makulabo-official-join.test.mjs
          node --experimental-default-type=module --check boat-score-2-makulabo-source-table.js
          node --experimental-default-type=module boat-score-2-makulabo-source-table.test.mjs
          node --experimental-default-type=module --check boat-score-2-makulabo-finish-headers.js
          node --experimental-default-type=module boat-score-2-makulabo-finish-headers.test.mjs
          node --experimental-default-type=module --check boat-score-2-makulabo-heatmap-adapter.js
          node --experimental-default-type=module boat-score-2-makulabo-heatmap-adapter.test.mjs
          node --experimental-default-type=module --check boat-score-2-makulabo-api-adapter.js
          node --experimental-default-type=module boat-score-2-makulabo-api-adapter.test.mjs
          node --experimental-default-type=module --check boat-score-2-course-finish-matrix.js
          node --experimental-default-type=module boat-score-2-course-finish-matrix.test.mjs
          node --experimental-default-type=module --check boat-score-2-course-evidence-bridge.js
          node --experimental-default-type=module boat-score-2-course-evidence-bridge.test.mjs
          node --experimental-default-type=module --check boat-score-2-makulabo-labelled-matrix.js
          node --experimental-default-type=module boat-score-2-makulabo-labelled-matrix.test.mjs
          node --experimental-default-type=module --check boat-score-2-course-evidence-comparison.js
          node --experimental-default-type=module boat-score-2-course-evidence-comparison.test.mjs
          node --experimental-default-type=module --check boat-score-2-start-course-comparison.js
          node --experimental-default-type=module boat-score-2-start-course-comparison.test.mjs
          node --experimental-default-type=module --check boat-score-2-pre-race-evidence.js
          node --experimental-default-type=module boat-score-2-pre-race-evidence.test.mjs
          node --experimental-default-type=module --check boat-score-2-historical-evidence-check.js
          node --experimental-default-type=module boat-score-2-historical-evidence-check.test.mjs
          node --check scripts/capture-research-official-features.mjs
          node --experimental-default-type=module --check boat-score-2-research-feature-snapshot.js
          node --experimental-default-type=module --test boat-score-2-research-feature-snapshot.test.mjs
          node --experimental-default-type=module --check scripts/check-boat-score-2-history.mjs
          node --experimental-default-type=module boat-score-2-local-rate-fallback.test.mjs
