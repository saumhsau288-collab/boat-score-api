name: Boat Score 2 live source diagnostics
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public source reachability without credentials
        run: node tests/live-source-check.mjs
