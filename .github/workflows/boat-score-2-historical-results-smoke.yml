name: Research-only historical official results smoke test
on:
  push:
    branches: [diagnose-twelve-pick-tests-20261123]
    paths:
      - '.github/workflows/boat-score-2-historical-results-smoke.yml'
      - 'scripts/retry-failed-official-pages.mjs'
      - 'scripts/test-retry-failed-official-pages.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline parser tests
        run: |
          node scripts/test-fetch-manual-official-historical-results.mjs
          node scripts/test-retry-failed-official-pages.mjs
      - name: Fetch historical official result pages read-only
        run: |
          mkdir -p research-historical
          node scripts/fetch-manual-official-historical-results.mjs 20261118 2 1,2,3 research-historical/official-raw.json
          node scripts/fetch-manual-official-historical-results.mjs 20261120 2 1,2,3 research-historical/official-raw-20261120.json
      - name: Retry failed official requests once and preserve errors
        run: |
          node scripts/retry-failed-official-pages.mjs research-historical/official-raw.json
          node scripts/retry-failed-official-pages.mjs research-historical/official-raw-20261120.json
      - name: Parse saved official result pages offline
        run: |
          node scripts/extract-official-result-racers.mjs research-historical/official-raw.json research-historical/parsed.json
          node scripts/extract-official-result-racers.mjs research-historical/official-raw-20261120.json research-historical/parsed-20261120.json
      - name: Explain missing result mappings without exposing HTML
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const file of ['research-historical/parsed.json','research-historical/parsed-20261120.json']){
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            for(const row of data.rows){
              console.log(JSON.stringify({date:row.date,venue:row.venue,race:row.race,status:row.status,
                parsedRacers:row.racers?.length??0,entryCoursesExtracted:row.entryCoursesExtracted??false,
                independentlyVerified:row.racerFinishIndependentlyVerified===true}));
            }
          }
          NODE
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-official-smoke-${{ github.run_id }}
          path: research-historical/
          retention-days: 30
          if-no-files-found: warn
