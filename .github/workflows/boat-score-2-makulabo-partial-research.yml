name: Research partial Makulabo missing-row verification
on:
  push:
    branches: [research/st-course-holdout-20261121]
    paths: [.github/workflows/boat-score-2-makulabo-partial-research.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check missing-row classification against public labelled tables
        run: |
          mkdir -p research-output
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {classifyMakulaboFinishRows} from './scripts/classify-makulabo-partial-research.mjs';
          const headers=['枠','選手','1着','2着','3着','4着','5着','6着','走','平均'];
          const sample=Array.from({length:6},(_,i)=>[String(i+1),'選手'+(i+1),'1','0','0','0','0','0','1','1.00']);
          sample[4]=['5','欠測','—','—','—','—','—','—','—','—'];
          const unit=classifyMakulaboFinishRows(headers,sample);
          assert.equal(unit.status,'partial_with_unscorable');
          assert.equal(unit.valid.length,5);
          assert.equal(unit.missing[0].runs,null);
          assert.equal(unit.eligibleForCalibration,false);
          const zero=sample.map(row=>[...row]);
          zero[5]=['6','ゼロ走','0','0','0','0','0','0','0','—'];
          const zeroCheck=classifyMakulaboFinishRows(headers,zero);
          assert.equal(zeroCheck.zeroRuns.length,1);
          assert.equal(zeroCheck.zeroRuns[0].firstPlaceRate,null);
          const clean=s=>String(s).replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/\s+/g,' ').trim();
          const output=[];
          for(const [venue,race] of [['02',1],['22',5]]){
            const response=await fetch(`https://makulabo-jp.com/data/${venue}/${race}/heatmap?hd=20261120`,{signal:AbortSignal.timeout(15000)});
            assert.equal(response.status,200);
            const html=await response.text();
            let result=null;
            for(const table of html.matchAll(/<table\b[^>]*>[\s\S]*?<\/table>/gi)){
              const rows=[...table[0].matchAll(/<tr\b[^>]*>[\s\S]*?<\/tr>/gi)].map(m=>[...m[0].matchAll(/<(?:th|td)\b[^>]*>([\s\S]*?)<\/(?:th|td)>/gi)].map(c=>clean(c[1])));
              const h=rows.findIndex(r=>r.length===10&&r[0]==='枠'&&r[1]==='選手');
              if(h<0)continue;
              result=classifyMakulaboFinishRows(rows[h],rows.slice(h+1).filter(r=>r.length===10));break;
            }
            assert.ok(result,'labelled table missing');
            output.push({venue,race,...result});
          }
          fs.writeFileSync('research-output/partial-makulabo-rows.json',JSON.stringify(output,null,2)+'\n');
          console.log(JSON.stringify(output.map(x=>({venue:x.venue,race:x.race,status:x.status,valid:x.valid.length,missing:x.missing,zeroRuns:x.zeroRuns,invalid:x.invalid}))));
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-makulabo-rows-${{ github.run_id }}
          path: research-output/
          retention-days: 30
