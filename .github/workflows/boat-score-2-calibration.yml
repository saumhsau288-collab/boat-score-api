name: Boat Score 2 offline calibration tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'boat-score-2-calibration.js'
      - 'boat-score-2-calibration.test.mjs'
      - '.github/workflows/boat-score-2-calibration.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated calibration tests
        run: node boat-score-2-calibration.test.mjs
