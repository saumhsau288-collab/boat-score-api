name: Research score evidence gate tests
on:
  push:
    branches:
      - research/score-evidence-gate-20261120
    paths:
      - 'scripts/inspect-score-evidence-research.mjs'
      - 'scripts/test-inspect-score-evidence-research.mjs'
      - 'scripts/validate-research-feature-snapshot.mjs'
      - 'scripts/test-validate-research-feature-snapshot.mjs'
      - '.github/workflows/research-score-evidence-gate.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-inspect-score-evidence-research.mjs
      - run: node scripts/test-validate-research-feature-snapshot.mjs
