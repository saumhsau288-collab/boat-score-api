name: Research score evidence gate tests
on:
  push:
    branches:
      - research/score-evidence-gate-20261120
    paths:
      - 'scripts/inspect-score-evidence-research.mjs'
      - 'scripts/test-inspect-score-evidence-research.mjs'
      - 'scripts/validate-research-feature-snapshot.mjs'
      - 'scripts/test-validate-research-feature-snapshot.mjs'
      - 'scripts/link-research-feature-snapshots.mjs'
      - 'scripts/test-link-research-feature-snapshots.mjs'
      - 'scripts/build-research-feature-collection-queue.mjs'
      - 'scripts/test-build-research-feature-collection-queue.mjs'
      - 'scripts/inspect-official-racelist-headers.mjs'
      - 'scripts/test-inspect-official-racelist-headers.mjs'
      - 'scripts/extract-research-official-racers.mjs'
      - 'scripts/test-extract-research-official-racers.mjs'
      - 'scripts/normalize-research-racer-features.mjs'
      - 'scripts/test-normalize-research-racer-features.mjs'
      - 'scripts/classify-research-deadline-refresh.mjs'
      - 'scripts/test-classify-research-deadline-refresh.mjs'
      - '.github/workflows/research-score-evidence-gate.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-inspect-score-evidence-research.mjs
      - run: node scripts/test-validate-research-feature-snapshot.mjs
      - run: node scripts/test-link-research-feature-snapshots.mjs
      - run: node scripts/test-build-research-feature-collection-queue.mjs
      - run: node scripts/test-inspect-official-racelist-headers.mjs
      - run: node scripts/test-extract-research-official-racers.mjs
      - run: node scripts/test-normalize-research-racer-features.mjs
      - run: node scripts/test-classify-research-deadline-refresh.mjs
