name: Deploy isolated Boat Score 2 research API preview (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boat-score-2-research-api-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research-cutoff-join-gate-20261120
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview API without touching existing app
        run: |
          node --experimental-default-type=module --check boat-score-2-research-preview-worker.js
          node --experimental-default-type=module boat-score-2-research-preview-worker.test.mjs
          node --experimental-default-type=module boat-score-2-adapter.test.mjs
          node --experimental-default-type=module boat-score-2-morning.test.mjs
          node --experimental-default-type=module boat-score-2-morning-pipeline.test.mjs
          node --experimental-default-type=module boat-score-2-official.test.mjs
          node --experimental-default-type=module boat-score-2-official-pipeline.test.mjs
          node --experimental-default-type=module boat-score-2-metric-extractor.test.mjs
          node --experimental-default-type=module boat-score-2-boat-mapping.test.mjs
      - name: Require Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy distinct research API Worker (not existing UI)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > wrangler.research-api-preview.toml <<'EOF'
          name = "boat-score-2-research-api-preview"
          main = "boat-score-2-research-preview-worker.js"
          compatibility_date = "2026-11-01"
          EOF
          set -o pipefail
          npx --yes wrangler@4 deploy --config wrangler.research-api-preview.toml 2>&1 | tee wrangler-deploy.log
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const log=readFileSync('wrangler-deploy.log','utf8');
          const urls=[...log.matchAll(/https:\/\/[^\s\x1b]+\.workers\.dev\/?/g)].map(m=>m[0]);
          const target=urls.find(u=>u.includes('boat-score-2-research-api-preview.'));
          if(!target)throw Error('Wrangler did not report a workers.dev preview URL; inspect deploy output and Worker routes.');
          appendFileSync(process.env.GITHUB_ENV,'RESEARCH_PREVIEW_URL='+target.replace(/\/$/,'')+'\n');
          console.log('Wrangler reported research preview URL:',target);
          NODE
      - name: Verify deployed research API health
        run: |
          node --input-type=module <<'NODE'
          const url=process.env.RESEARCH_PREVIEW_URL+'/health';
          let last='';
          for(let attempt=1;attempt<=6;attempt++){
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(15000),redirect:'manual'});
              const body=await response.text();
              console.log('Health attempt',attempt,'HTTP',response.status,'URL',url);
              if(response.ok){
                const data=JSON.parse(body);
                if(data.service!=='boat-score-2-research-preview'||data.liveData!==false)
                  throw Error('Unexpected preview API response');
                const apiUrl=process.env.RESEARCH_PREVIEW_URL+'/api/research/evaluate-sources';
                const probe=await fetch(apiUrl,{
                  method:'POST',headers:{'content-type':'application/json'},
                  body:JSON.stringify({official:{verified:false,racers:[]},recent50:[]}),
                  signal:AbortSignal.timeout(15000)
                });
                const probeData=await probe.json();
                if(probe.status!==422||probeData.status!=='insufficient_data'||probeData.liveData!==false)
                  throw Error('Deployed source-evaluation API contract mismatch: '+probe.status+' '+JSON.stringify(probeData).slice(0,250));
                const invalidOfficial=await fetch(process.env.RESEARCH_PREVIEW_URL+
                  '/api/research/official-racelist?venue=25&date=20261121&race=1',
                  {signal:AbortSignal.timeout(15000)});
                const invalidData=await invalidOfficial.json();
                if(invalidOfficial.status!==400||invalidData.status!=='invalid_selection')
                  throw Error('Official racelist selection validation failed');
                console.log('Official racelist endpoint rejects invalid venue as expected');
                console.log('Research API rejects unverified official/recent50 data as expected');
                console.log('Isolated research API preview health verified:',url);
                process.exit(0);
              }
              last='HTTP '+response.status+' response: '+body.slice(0,300);
            }catch(e){last=String(e);}
            if(attempt<6)await new Promise(resolve=>setTimeout(resolve,5000));
          }
          throw Error('Preview health failed after retries at '+url+'; '+last);
          NODE
