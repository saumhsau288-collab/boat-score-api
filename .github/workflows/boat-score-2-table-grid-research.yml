name: Research official table grid tests

on:
  push:
    branches:
      - research-official-table-grid-20261121
  workflow_dispatch:
    inputs:
      live_diagnostic:
        description: 'Inspect official source (read-only)'
        type: boolean
        required: false
        default: false
      venue:
        description: 'Venue code 01-24'
        type: string
        default: '01'
      date:
        description: 'Race date YYYYMMDD'
        type: string
        default: '20261121'
      race:
        description: 'Race number 1-12'
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated table grid tests
        run: |
          node boat-score-2-table-grid-research.test.mjs
          node boat-score-2-six-racers-research.test.mjs
          node boat-score-2-scoring-input-research.test.mjs
          node boat-score-2-research-integration-audit.test.mjs
          node boat-score-2-verified-official-bridge-research.test.mjs
          node boat-score-2-recent50-morning-bridge-research.test.mjs
          node boat-score-2-six-racer-morning-regression.test.mjs
          node boat-score-2-research-to-backtest-gate.test.mjs
          node scripts/test-audit-historical-batch-evidence.mjs
          node scripts/test-fetch-official-result-pages-research.mjs
          node scripts/test-parse-saved-official-result-pages.mjs
          node scripts/test-run-saved-capture-result-comparison.mjs
          node scripts/test-audit-historical-tuning-readiness.mjs
          node boat-score-2-historical-snapshot-gate-research.test.mjs
          node scripts/test-identify-makulabo-sample-scope.mjs
          node scripts/test-apply-reviewed-makulabo-identities.mjs
          node scripts/test-evaluate-verified-makulabo-research.mjs
          node boat-score-2-makulabo-source-table.test.mjs
          node boat-score-2-makulabo-official-join.test.mjs
          node boat-score-2-recent50-identity.test.mjs
      - name: Inspect official HTML grid (manual only)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.live_diagnostic) }}
        env:
          VENUE: ${{ inputs.venue }}
          RACE_DATE: ${{ inputs.date }}
          RACE: ${{ inputs.race }}
        run: node boat-score-2-table-grid-live-diagnostic.mjs

      - name: Verify historical official and Makulabo racer join (read-only, nonblocking)
        continue-on-error: true
        run: node scripts/verify-makulabo-official-join.mjs 20261113 02 9
      - name: Check Makulabo diagnostic syntax
        run: node --check scripts/check-makulabo-public-source.mjs
      - name: Inspect historical Makulabo public page (read-only, nonblocking)
        continue-on-error: true
        run: node scripts/check-makulabo-public-source.mjs 20261113 02 9
