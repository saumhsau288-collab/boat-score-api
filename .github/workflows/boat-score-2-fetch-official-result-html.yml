name: Boat Score 2 fetch official result HTML (research only)

on:
  workflow_dispatch:
    inputs:
      capture_run_id:
        description: 'GitHub Actions run ID holding existing saved prediction capture'
        required: true
        type: string
      max_pages:
        description: 'Maximum official result pages to retrieve (1-12)'
        required: true
        default: '12'
        type: choice
        options:
          - '1'
          - '3'
          - '6'
          - '12'

permissions:
  contents: read
  actions: read

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate retrieval scripts and offline tests
        run: |
          node --check scripts/fetch-official-result-pages-research.mjs
          node scripts/test-build-official-result-request-manifest.mjs
          node scripts/test-fetch-official-result-pages-research.mjs
      - name: Download saved prediction capture
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.capture_run_id }}
        run: |
          case "$RUN_ID" in *[!0-9]*|'') echo 'Invalid capture run ID'; exit 1;; esac
          mkdir -p research-input
          gh run download "$RUN_ID" --dir research-input
      - name: Fetch bounded official result HTML (unverified research evidence)
        shell: bash
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          shopt -s globstar nullglob
          files=(research-input/**/*-*.json)
          mkdir -p research-results
          count=0
          for file in "${files[@]}"; do
            if [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]]; then
              count=$((count+1))
              if (( count > 1 )); then echo 'Expected exactly one raw capture JSON' >&2; exit 1; fi
              node -e 'import("./scripts/fetch-official-result-pages-research.mjs").then(async m=>{const fs=await import("node:fs");const capture=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const report=await m.fetchOfficialResultPages(capture,{limit:Number(process.env.MAX_PAGES)});fs.writeFileSync(process.argv[2],JSON.stringify(report,null,2));console.log(JSON.stringify({targets:report.targets,saved:report.pages.filter(p=>p.status==="raw_html_saved").length,failed:report.pages.filter(p=>p.status==="fetch_failed").length,verifiedResults:0}));})' "$file" "research-results/${file##*/}.official-raw.json"
            fi
          done
          if (( count != 1 )); then echo 'Expected one raw capture JSON' >&2; exit 1; fi
          echo 'Raw official HTML is NOT verified result evidence. No accuracy or score tuning.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload research-only result pages
        uses: actions/upload-artifact@v4
        with:
          name: boat-score-2-raw-official-results-${{ github.run_id }}
          path: research-results/
          if-no-files-found: error
          retention-days: 30
