name: Boat Score 2 fetch official result HTML (research only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boat-score-2-fetch-official-result-html.yml'
      - 'scripts/parse-saved-official-result-pages.mjs'
      - 'scripts/test-parse-saved-official-result-pages.mjs'
      - 'scripts/fetch-official-result-pages-research.mjs'
      - 'scripts/test-fetch-official-result-pages-research.mjs'
      - 'scripts/backtest-comparison-eligibility.mjs'
      - 'scripts/compare-saved-capture-results.mjs'
      - 'scripts/test-compare-saved-capture-results.mjs'
  workflow_dispatch:
    inputs:
      capture_run_id:
        description: 'GitHub Actions run ID holding existing saved prediction capture'
        required: true
        type: string
      max_pages:
        description: 'Maximum official result pages to retrieve (1-12)'
        required: true
        default: '12'
        type: choice
        options:
          - '1'
          - '3'
          - '6'
          - '12'

permissions:
  contents: read
  actions: read

jobs:
  parser-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check parser syntax and regression cases without network access
        run: |
          node --check scripts/parse-saved-official-result-pages.mjs
          node --check scripts/test-parse-saved-official-result-pages.mjs
          node scripts/test-parse-saved-official-result-pages.mjs
          node --check scripts/compare-saved-capture-results.mjs
          node scripts/test-compare-saved-capture-results.mjs
          node scripts/test-fetch-official-result-pages-research.mjs
      - name: Record offline test result separately from real-race evidence
        if: success()
        run: |
          echo '## Offline validation passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Parser and saved-prediction comparison regression tests passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is synthetic-test success only; verified historical comparisons and accuracy are not established.' >> "$GITHUB_STEP_SUMMARY"
  fetch-results:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate retrieval scripts and offline tests
        run: |
          node --check scripts/fetch-official-result-pages-research.mjs
          node scripts/test-build-official-result-request-manifest.mjs
          node scripts/test-fetch-official-result-pages-research.mjs
          node scripts/test-parse-saved-official-result-pages.mjs
      - name: Download saved prediction capture
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.capture_run_id }}
        run: |
          case "$RUN_ID" in *[!0-9]*|'') echo 'Invalid capture run ID'; exit 1;; esac
          mkdir -p research-input
          gh run download "$RUN_ID" --dir research-input
      - name: Fetch bounded official result HTML (unverified research evidence)
        shell: bash
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          shopt -s globstar nullglob
          files=(research-input/**/*-*.json)
          mkdir -p research-results
          count=0
          for file in "${files[@]}"; do
            if [[ "${file##*/}" =~ ^20[0-9]{6}-[0-9]+\.json$ ]]; then
              count=$((count+1))
              if (( count > 1 )); then echo 'Expected exactly one raw capture JSON' >&2; exit 1; fi
              node -e 'import("./scripts/fetch-official-result-pages-research.mjs").then(async m=>{const fs=await import("node:fs");const capture=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const report=await m.fetchOfficialResultPages(capture,{limit:Number(process.env.MAX_PAGES)});fs.writeFileSync(process.argv[2],JSON.stringify(report,null,2));console.log(JSON.stringify({targets:report.targets,saved:report.pages.filter(p=>p.status==="raw_html_saved").length,failed:report.pages.filter(p=>p.status==="fetch_failed").length,verifiedResults:0}));})' "$file" "research-results/${file##*/}.official-raw.json"
            fi
          done
          if (( count != 1 )); then echo 'Expected one raw capture JSON' >&2; exit 1; fi
          echo 'Raw official HTML is NOT verified result evidence. No accuracy or score tuning.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload research-only result pages
        uses: actions/upload-artifact@v4
        with:
          name: boat-score-2-raw-official-results-${{ github.run_id }}
          path: research-results/
          if-no-files-found: error
          retention-days: 30

  probe-manifest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate official result parser before network probe
        run: |
          node --check scripts/parse-saved-official-result-pages.mjs
          node scripts/test-parse-saved-official-result-pages.mjs
          node scripts/test-fetch-official-result-pages-research.mjs
      - name: Download saved 133-key retrieval manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research-input
          # Pin to the first successful inventory run with corrected JSON serialization.
          # Never race an older success when an inventory rerun is still finishing.
          run_id=44682413513
          test -n "$run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "boat-score-2-ready-race-result-targets-$run_id" --dir research-input
      - name: Fetch first twelve official HTML pages as unverified research
        run: |
          mkdir -p research-results
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {fetchOfficialResultPages} from './scripts/fetch-official-result-pages-research.mjs';
          import {parseSavedOfficialResultPages} from './scripts/parse-saved-official-result-pages.mjs';
          const m=JSON.parse(fs.readFileSync('research-input/ready-race-result-targets.json','utf8'));
          if(m.method!=='retained_raw_ready_race_identity_manifest'||m.uniqueReadyRaceKeys!==133||m.requests.length!==133)throw Error('Unexpected saved manifest');
          const records=m.requests.map(r=>({date:r.date,venue:r.venue,race:r.race,response:{ready:true}}));
          const raw=await fetchOfficialResultPages({records},{limit:12});
          const parsed=parseSavedOfficialResultPages(raw);
          fs.writeFileSync('research-results/official-raw-probe.json',JSON.stringify(raw,null,2));
          fs.writeFileSync('research-results/official-parsed-probe.json',JSON.stringify(parsed,null,2));
          const summary={targets:raw.targets,saved:raw.pages.filter(x=>x.status==='raw_html_saved').length,failed:raw.pages.filter(x=>x.status==='fetch_failed').length,parsed:parsed.parsed,reviewReasons:parsed.rows.reduce((a,r)=>{if(r.status!=='parsed_needs_independent_review'){const k=r.reason||r.status;a[k]=(a[k]||0)+1;}return a;},{}),verifiedResults:0,eligibleForAccuracy:0};
          console.log(JSON.stringify(summary));
          const diagnostics=parsed.rows.map(r=>({date:r.date,venue:r.venue,race:r.race,status:r.status,reason:r.reason??null,podium:r.podium??null,verified:false}));
          fs.writeFileSync('research-results/official-probe-diagnostics.json',JSON.stringify({summary,diagnostics},null,2));
          console.log('Per-race diagnostics:',JSON.stringify(diagnostics));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Official HTML research probe\n\n- Targets: ${summary.targets}\n- Saved HTML: ${summary.saved}\n- Fetch failed: ${summary.failed}\n- Parsed, awaiting independent review: ${summary.parsed}\n- Review reasons: ${JSON.stringify(summary.reviewReasons)}\n- Independently verified results: 0\n- Eligible accuracy comparisons: 0\n\nNo authenticated historical prediction or accuracy claim.\n`);
          NODE
      - name: Archive bounded research evidence
        uses: actions/upload-artifact@v4
        with:
          name: boat-score-2-official-html-probe-${{ github.run_id }}
          path: research-results/
          retention-days: 30
          if-no-files-found: error
