name: Research historical race batch (no deployment)
on:
  workflow_dispatch:
    inputs:
      capture_date:
        description: 'Completed race date YYYYMMDD'
        required: true
        default: '20261120'
        type: string
      venue:
        description: 'Venue number 1-24'
        required: true
        default: '1'
        type: string
      first_race:
        description: 'First race 1-12'
        required: true
        default: '1'
        type: string
      last_race:
        description: 'Last race 1-12 (maximum 3 races per run)'
        required: true
        default: '3'
        type: string
permissions:
  contents: read
jobs:
  research-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate completed historical race range
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          FIRST_RACE: ${{ inputs.first_race }}
          LAST_RACE: ${{ inputs.last_race }}
        run: |
          node --input-type=module -e '
            const {CAPTURE_DATE:d,CAPTURE_VENUE:v,FIRST_RACE:a,LAST_RACE:b}=process.env;
            const iso=d?.replace(/^(\d{4})(\d{2})(\d{2})$/,"$1-$2-$3");
            const parsed=new Date(iso+"T00:00:00Z");
            if(!/^20\d{6}$/.test(d??"")||Number.isNaN(parsed.getTime())||
               parsed.toISOString().slice(0,10)!==iso||
               d>=new Date().toISOString().slice(0,10).replaceAll("-","")||
               !/^\d{1,2}$/.test(v??"")||Number(v)<1||Number(v)>24||
               !/^\d{1,2}$/.test(a??"")||!/^\d{1,2}$/.test(b??"")||
               Number(a)<1||Number(b)>12||Number(b)<Number(a)||Number(b)-Number(a)>2){
              console.error("Choose a completed prior date, venue 1-24, and a 1-3 race range within 1-12.");
              process.exit(1);
            }
            console.log("Validated historical batch",d,Number(v),Number(a),Number(b));
          '
      - name: Validate offline research comparison logic
        run: |
          node --check scripts/compare-research-official-baseline.mjs
          node --check scripts/review-official85-vs-parsed-podium.mjs
          node --check scripts/summarize-research-official85-batch.mjs
          node scripts/test-compare-research-official-baseline.mjs
          node scripts/test-review-official85-vs-parsed-podium.mjs
          node scripts/test-summarize-research-official85-batch.mjs
      - name: Capture official features, Makulabo sample, and official results for each race
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          FIRST_RACE: ${{ inputs.first_race }}
          LAST_RACE: ${{ inputs.last_race }}
        run: |
          mkdir -p prediction-captures
          for (( race=10#$FIRST_RACE; race<=10#$LAST_RACE; race++ )); do
            export CAPTURE_RACE="$race"
            echo "::group::Historical research race $race"
            node --experimental-default-type=module scripts/capture-research-official-features.mjs || true
            node scripts/capture-research-makulabo-join.mjs || true
            official_path="prediction-captures/research-official-${CAPTURE_DATE}-$((10#$CAPTURE_VENUE))-${race}.json"
            result_path="prediction-captures/research-result-${CAPTURE_DATE}-$((10#$CAPTURE_VENUE))-${race}.json"
            if [ -f "$official_path" ]; then
              node scripts/capture-selected-research-result.mjs "$official_path" "$result_path" || true
            fi
            echo "::endgroup::"
          done
      - name: Summarize official-only 85-point component and finish ranks
        if: always()
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          FIRST_RACE: ${{ inputs.first_race }}
          LAST_RACE: ${{ inputs.last_race }}
        run: node scripts/summarize-research-official85-batch.mjs
      - name: Analyze saved retrospective 2nd and 3rd finish ranks
        if: always()
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          FIRST_RACE: ${{ inputs.first_race }}
          LAST_RACE: ${{ inputs.last_race }}
        run: |
          node --test scripts/test-research-retrospective-finish-ranks.mjs
          file="prediction-captures/research-review-${CAPTURE_DATE}-${CAPTURE_VENUE}-${FIRST_RACE}-${LAST_RACE}.json"
          if [ -f "$file" ]; then
            node scripts/run-research-retrospective-finish-ranks.mjs "$file" > prediction-captures/research-finish-ranks.json
          else
            echo "Saved retrospective review missing; finish-rank analysis held" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload research snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-batch-${{ github.run_id }}
          path: prediction-captures/research-*.json
          retention-days: 90
          if-no-files-found: warn
