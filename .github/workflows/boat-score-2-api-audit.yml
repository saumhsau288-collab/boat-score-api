name: Boat Score 2 read-only API audit
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional JST date (YYYYMMDD)'
        required: false
        type: string
  push:
    branches: [fix-boat-score-2-syntax-20261115]
    paths: ['.github/workflows/boat-score-2-api-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/fix-boat-score-2-syntax-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read preview API diagnostics
        shell: bash
        env:
          AUDIT_DATE: ${{ inputs.date }}
        run: |
          node --input-type=module <<'JS'
          const base='https://boat-score-2-preview.saumh-sau-288.workers.dev';
          const requested=process.env.AUDIT_DATE||'';
          if(requested&&!/^20\d{6}$/.test(requested))throw Error('Invalid audit date');
          const dates=requested?[requested]:[1,0].map(n=>new Date(Date.now()+9*3600000-n*86400000).toISOString().slice(0,10).replaceAll('-',''));
          const paths=['/api/morning/snapshot','/api/research/morning-records','/api/research/before-archive','/api/research/result-archive','/api/research/scheduler-health','/api/research/archive-quality','/api/research/four-prediction-comparison','/api/research/before-prediction-comparison','/api/research/morning-boat-one-audit'];
          let failed=false;
          // Compare archived deadlines against independently fetched official timetable columns.
          for(const date of dates){
            try{
              const res=await fetch(base+'/api/research/morning-records?date='+date,{signal:AbortSignal.timeout(25000)});
              if(!res.ok){console.log('DEADLINE_ARCHIVE_HTTP '+date+' '+res.status);continue;}
              const data=await res.json();
              const resultResponse=await fetch(base+'/api/research/result-archive?date='+date,{signal:AbortSignal.timeout(25000)});
              const results=resultResponse.ok?(await resultResponse.json()).records||{}:{};
              const recovered=[];
              const venues=[...new Set((data.records||[]).map(x=>x.venue))];
              for(const venue of venues){
                try{
                  const url='https://www.boatrace.jp/owpc/pc/race/racelist?rno=1&jcd='+String(venue).padStart(2,'0')+'&hd='+date;
                  const response=await fetch(url,{signal:AbortSignal.timeout(15000)});
                  if(!response.ok)throw Error('official HTTP '+response.status);
                  const html=await response.text();
                  const plain=x=>x.replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;|&#xA0;/gi,' ').normalize('NFKC').replace(/\s+/g,' ').trim();
                  const tables=[];
                  for(const t of html.matchAll(/<table\b[^>]*>[\s\S]*?<\/table>/gi)){
                    const rows=[...t[0].matchAll(/<tr\b[^>]*>[\s\S]*?<\/tr>/gi)].map(r=>[...r[0].matchAll(/<t[dh]\b[^>]*>([\s\S]*?)<\/t[dh]>/gi)].map(c=>plain(c[1])));
                    for(let i=1;i<rows.length;i++){
                      const h=rows[i-1],v=rows[i];
                      if(h.length===13&&v.length===13&&h[0]==='レース'&&h.slice(1).every((x,j)=>x===(j+1)+'R')&&/^締切(?:予定)?(?:時刻|時間)?$/.test(v[0])&&v.slice(1).every(x=>/^\d{1,2}:\d{2}$/.test(x)))tables.push(v.slice(1));
                    }
                  }
                  if(!tables.length||new Set(tables.map(x=>JSON.stringify(x))).size!==1)throw Error('official timetable unavailable or ambiguous');
                  const times=tables[0].map(x=>x.padStart(5,'0'));
                  const mins=times.map(x=>{const [h,m]=x.split(':').map(Number);return h>=0&&h<24&&m>=0&&m<60?h*60+m:NaN;});
                  if(mins.some((x,i)=>!Number.isFinite(x)||(i>0&&x<=mins[i-1])))throw Error('invalid timetable ordering');
                  for(const x of (data.records||[]).filter(x=>x.venue===venue&&x.date===date&&Number.isInteger(x.race)&&x.race>=1&&x.race<=12)){
                    const corrected=new Date(Date.UTC(+date.slice(0,4),+date.slice(4,6)-1,+date.slice(6,8),0,mins[x.race-1]-540)).toISOString();
                    const capture=Date.parse(x.capturedAt);
                    const status=Number.isFinite(capture)&&new Date(capture+9*3600000).toISOString().slice(0,10).replaceAll('-','')===date&&capture<Date.parse(corrected)?'before_retrieved_schedule':'unverified_or_late';
                    const y=results[venue+':'+x.race],o=y?.finishOrder;
                    const finish=y?.verified===true&&y.date===date&&y.venue===venue&&y.race===x.race&&Array.isArray(o)&&o.length===6&&new Set(o).size===6&&o.every(n=>Number.isInteger(n)&&n>=1&&n<=6)?o:null;
                    recovered.push({date,venue,race:x.race,originalDeadlineAt:x.deadlineAt,correctedDeadlineAt:corrected,capturedAt:x.capturedAt,checkedAt:new Date().toISOString(),source:url,status,finishOrder:finish,predictedOrder:x.predictedOrder});
                  }
                  const rows=(data.records||[]).filter(x=>x.venue===venue).map(x=>({race:x.race,official:times[x.race-1],saved:Number.isFinite(Date.parse(x.deadlineAt))?new Date(Date.parse(x.deadlineAt)+9*3600000).toISOString().slice(11,16):null}));
                  console.log('OFFICIAL_DEADLINE_COMPARE '+JSON.stringify({date,venue,times,rows,matched:rows.filter(x=>x.official===x.saved).length,mismatched:rows.filter(x=>x.official!==x.saved).length}));
                }catch(e){console.log('OFFICIAL_DEADLINE_UNVERIFIED '+JSON.stringify({date,venue,error:String(e)}));}
              }
              const fs=await import('node:fs/promises');
              await fs.mkdir('deadline-recovery',{recursive:true});
              await fs.writeFile('deadline-recovery/'+date+'.json',JSON.stringify({date,mode:'retrospective_schedule_not_original_evidence',records:recovered},null,2));
              const eligible=recovered.filter(x=>x.status==='before_retrieved_schedule'&&x.finishOrder);
              const patterns={matched:0,topLost:0,winnerInside:0,winnerOutside:0,topSecond:0,topThird:0,topOutsidePodium:0,byVenue:{},winnerRank:[0,0,0,0,0,0]};
              for(const x of eligible){
                const p=x.predictedOrder,o=x.finishOrder;
                if(!Array.isArray(p)||p.length!==6||new Set(p).size!==6||!p.every(n=>Number.isInteger(n)&&n>=1&&n<=6))continue;
                patterns.matched++;
                const v=patterns.byVenue[x.venue]??={matched:0,topLost:0,winnerInside:0,winnerOutside:0};
                v.matched++;
                patterns.winnerRank[p.indexOf(o[0])]++;
                if(p[0]===o[0])continue;
                patterns.topLost++;v.topLost++;
                const side=o[0]<p[0]?'winnerInside':'winnerOutside';
                patterns[side]++;v[side]++;
                if(o[1]===p[0])patterns.topSecond++;else if(o[2]===p[0])patterns.topThird++;else patterns.topOutsidePodium++;
              }
              const gaps={};
              for(const x of eligible){
                const original=(data.records||[]).find(y=>y.venue===x.venue&&y.race===x.race);
                const p=original?.rankedScores;
                if(!Array.isArray(p)||p.length!==6||new Set(p.map(y=>y.boat)).size!==6||!p.every(y=>Number.isFinite(y.score)&&Number.isInteger(y.boat)&&y.boat>=1&&y.boat<=6))continue;
                const ranked=[...p].sort((a,b)=>b.score-a.score||a.boat-b.boat);
                if(ranked[0].boat!==x.predictedOrder?.[0])continue;
                const gap=ranked[0].score-ranked[1].score;
                const key=gap===0?'0':gap<1?'0-1':gap<3?'1-3':gap<5?'3-5':'5+';
                const g=gaps[key]??={matched:0,topWins:0,topSecond:0,topThird:0,topOutside:0};
                g.matched++;
                const pos=x.finishOrder.indexOf(ranked[0].boat);
                g[['topWins','topSecond','topThird'][pos]||'topOutside']++;
              }
              console.log('RECOVERED_SCORE_GAPS '+JSON.stringify({date,gaps,mode:'retrospective_unvalidated'}));
              console.log('RECOVERED_RANK_PATTERNS '+JSON.stringify({date,mode:'boat_number_not_actual_course',...patterns}));
              console.log('RECOVERY_SUMMARY '+JSON.stringify({date,records:recovered.length,changed:recovered.filter(x=>Date.parse(x.originalDeadlineAt)!==Date.parse(x.correctedDeadlineAt)).length,preSchedule:recovered.filter(x=>x.status==='before_retrieved_schedule').length,matched:eligible.length,adjacent12:eligible.filter(x=>Math.abs(x.finishOrder[0]-x.finishOrder[1])===1).length,adjacent13:eligible.filter(x=>Math.abs(x.finishOrder[0]-x.finishOrder[2])===1).length,topScoreWins:eligible.filter(x=>x.predictedOrder?.[0]===x.finishOrder[0]).length}));
            }catch(e){console.log('DEADLINE_COMPARE_ERROR '+date+' '+String(e));}
          }

          for(const date of dates)for(const path of paths){
            try{
              const res=await fetch(base+path+'?date='+date,{signal:AbortSignal.timeout(25000),redirect:'error'});
              const d=await res.json();
              console.log(JSON.stringify({path,date,http:res.status,status:d.status,summary:Object.fromEntries(Object.entries(d).map(([k,v])=>[k,Array.isArray(v)?{count:v.length}:k==='categories'||k==='verifiedCategories'?Object.fromEntries(Object.entries(v||{}).map(([a,b])=>[a,Array.isArray(b)?b.length:null])):v]))}));
              if(!res.ok&&res.status!==404)failed=true;
            }catch(e){failed=true;console.error(path,String(e));}
          }
          for(const date of dates){
            const get=async(path)=>{const r=await fetch(base+path,{signal:AbortSignal.timeout(25000),redirect:'error'});if(!r.ok)throw Error(path+' HTTP '+r.status);return r.json();};
            try{
              const audit=await get('/api/research/morning-boat-one-audit?date='+date);
              const wins=(audit.details||[]).filter(x=>x.status==='win'&&x.finishOrder?.[0]===1);
              const morning=await get('/api/research/morning-records?date='+date);
              const sample=(morning.records||[]).slice(0,3);
              for(const x of sample){
                const d=await get('/api/morning/race-predictions?date='+date+'&venue='+x.venue+'&race='+x.race);
                console.log('PREDICTION_STORAGE_DIAGNOSTIC '+JSON.stringify({date,venue:x.venue,race:x.race,keys:Object.keys(d),deadlineAt:d.deadlineAt,averagePresent:!!d.average,localPresent:!!d.local,averageKeys:Object.keys(d.average||{}),localKeys:Object.keys(d.local||{}),averageMainCount:d.average?.main?.length??null,localMainCount:d.local?.main?.length??null,averageUpsetCount:d.average?.upset?.length??null,localUpsetCount:d.local?.upset?.length??null}));
              }
              const totals=Object.fromEntries(['average','local'].map(k=>[k,{matched:0,main:0,upset:0,either:0,missing:0}]));
              for(const x of wins){
                const d=await get('/api/morning/race-predictions?date='+date+'&venue='+x.venue+'&race='+x.race);
                const actual=x.finishOrder.slice(0,3).join('-');
                for(const k of Object.keys(totals)){
                  const p=d[k],t=totals[k];
                  if(d.date!==date||d.venue!==x.venue||d.race!==x.race||!p||!Array.isArray(p.main)||!Array.isArray(p.upset)||p.main.length!==6||p.upset.length!==6){t.missing++;continue;}
                  const hit=a=>a.some(y=>Array.isArray(y)&&y.join('-')===actual);
                  const m=hit(p.main),u=hit(p.upset);t.matched++;t.main+=Number(m);t.upset+=Number(u);t.either+=Number(m||u);
                }
              }
              console.log('BOAT_ONE_CONDITIONAL '+JSON.stringify({date,wins:wins.length,totals}));
            }catch(e){failed=true;console.error('conditional audit',date,String(e));}
          }
          for(let offset=1;offset<=7;offset++){
            const date=new Date(Date.now()+9*3600000-offset*86400000).toISOString().slice(0,10).replaceAll('-','');
            try{
              const get=async p=>{const r=await fetch(base+p+'?date='+date,{signal:AbortSignal.timeout(25000),redirect:'error'});if(!r.ok&&r.status!==404)throw Error(p+' HTTP '+r.status);return {http:r.status,data:await r.json()};};
              const [mr,fr]=await Promise.all([get('/api/research/morning-records'),get('/api/research/result-archive')]);
              const m=mr.data,f=fr.data;
              const groups={};
              for(const x of m?.records||[])(groups[x.venue]??=[]).push({race:x.race,deadlineAt:x.deadlineAt});
              const conflicts=Object.entries(groups).flatMap(([venue,rows])=>rows.sort((a,b)=>a.race-b.race).filter((x,i)=>!Number.isFinite(Date.parse(x.deadlineAt))||(i>0&&Date.parse(x.deadlineAt)<=Date.parse(rows[i-1].deadlineAt))).map(x=>({venue,...x})));
              console.log('ARCHIVE_COVERAGE '+JSON.stringify({date,morningHttp:mr.http,resultHttp:fr.http,morningCount:m?.records?.length??0,resultCount:Object.keys(f?.records||{}).length,deadlineConflicts:conflicts,deadlineGroups:groups}));
              const t={matched:0,firstByBoat:Array(6).fill(0),secondByBoat:Array(6).fill(0),thirdByBoat:Array(6).fill(0),adjacent12:0,adjacent13:0,firstByScoreRank:Array(6).fill(0),byVenue:{}};
              for(const x of m?.records||[]){
                const y=f?.records?.[x.venue+':'+x.race],o=y?.finishOrder;
                if(x.date!==date||y?.date!==date||y.verified!==true||!Array.isArray(o)||o.length!==6||new Set(o).size!==6||!o.every(n=>Number.isInteger(n)&&n>=1&&n<=6)||!(Date.parse(x.capturedAt)<Date.parse(x.deadlineAt))||!Array.isArray(x.predictedOrder)||x.predictedOrder.length!==6||new Set(x.predictedOrder).size!==6||!x.predictedOrder.every(n=>Number.isInteger(n)&&n>=1&&n<=6))continue;
                t.matched++;t.firstByBoat[o[0]-1]++;t.secondByBoat[o[1]-1]++;t.thirdByBoat[o[2]-1]++;t.adjacent12+=Number(Math.abs(o[0]-o[1])===1);t.adjacent13+=Number(Math.abs(o[0]-o[2])===1);t.firstByScoreRank[x.predictedOrder.indexOf(o[0])]++;
                const v=t.byVenue[x.venue]??={matched:0,firstByBoat:Array(6).fill(0),adjacent12:0};v.matched++;v.firstByBoat[o[0]-1]++;v.adjacent12+=Number(Math.abs(o[0]-o[1])===1);
              }
              // Compare reconstructed research candidates only; never rewrite saved predictions.
              const comparison={matched:0,oldHit:0,newHit:0,topLost:0,tiedTop:0};
              for(const x of m?.records||[]){
                const y=f?.records?.[x.venue+':'+x.race],o=y?.finishOrder,rs=x.rankedScores;
                if(x.date!==date||y?.date!==date||y.verified!==true||!Array.isArray(o)||o.length!==6||new Set(o).size!==6||!o.every(n=>Number.isInteger(n)&&n>=1&&n<=6)||!(Date.parse(x.capturedAt)<Date.parse(x.deadlineAt))||!Array.isArray(rs)||rs.length!==6||new Set(rs.map(z=>z.boat)).size!==6||!rs.every(z=>Number.isInteger(z.boat)&&z.boat>=1&&z.boat<=6&&Number.isFinite(z.score)))continue;
                const ranked=rs.slice().sort((a,b)=>b.score-a.score||a.boat-b.boat);
                if(JSON.stringify(ranked.map(z=>z.boat))!==JSON.stringify(x.predictedOrder))continue;
                const top=ranked[0].boat, scores=new Map(rs.map(z=>[z.boat,z.score])), all=[];
                for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)for(let c=1;c<=6;c++)if(a!==b&&a!==c&&b!==c)all.push({key:[a,b,c].join('-'),a,score:scores.get(a)*.56+scores.get(b)*.29+scores.get(c)*.15});
                all.sort((a,b)=>b.score-a.score||a.key.localeCompare(b.key));
                const used=new Set(all.slice(0,6).map(z=>z.key)),actual=o.slice(0,3).join('-');
                const old=all.filter(z=>z.a>=4&&!used.has(z.key)).slice(0,6),next=all.filter(z=>z.a!==top&&!used.has(z.key)).slice(0,6);
                comparison.matched++;comparison.topLost+=Number(o[0]!==top);comparison.tiedTop+=Number(ranked[0].score===ranked[1].score);comparison.oldHit+=Number(old.some(z=>z.key===actual));comparison.newHit+=Number(next.some(z=>z.key===actual));
              }
              console.log('UPSET_RESEARCH '+JSON.stringify({date,...comparison,mode:'retrospective_reconstruction_not_saved_predictions'}));
              console.log('ARCHIVED_PATTERN '+JSON.stringify({date,...t,note:'boat numbers, not actual entry courses'}));
            }catch(e){failed=true;console.error('pattern audit',date,String(e));}
          }
          if(failed)process.exitCode=1;
          JS

      - name: Preserve deadline recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadline-recovery-${{ github.run_id }}
          path: deadline-recovery/*.json
          if-no-files-found: warn
