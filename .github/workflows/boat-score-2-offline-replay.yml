name: Boat Score 2 replay saved historical evidence
on:
  push:
    branches:
      - fix-boat-score-2-syntax-20261115
    paths:
      - '.github/workflows/boat-score-2-offline-replay.yml'
      - 'scripts/compare-exploratory-winrates-results.mjs'
      - 'scripts/test-compare-exploratory-winrates-results.mjs'
      - 'scripts/compare-exploratory-ranking-models.mjs'
      - 'scripts/test-compare-exploratory-ranking-models.mjs'
      - 'scripts/validate-precutoff-snapshot.mjs'
      - 'scripts/test-validate-precutoff-snapshot.mjs'
      - 'scripts/compare-precutoff-predictions.mjs'
      - 'scripts/test-compare-precutoff-predictions.mjs'
      - 'scripts/classify-prediction-phase.mjs'
      - 'scripts/test-classify-prediction-phase.mjs'
      - 'scripts/format-prediction-snapshot.mjs'
      - 'scripts/test-format-prediction-snapshot.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download saved official evidence from successful six-race study
        uses: actions/download-artifact@v4
        with:
          name: boat-score-2-official-history-diagnostics-44484960101
          run-id: 44484960101
          github-token: ${{ github.token }}
          path: research-historical
      - name: Confirm evidence files exist
        run: |
          test -s research-historical/manual.official-entry-stats.json
          test -s research-historical/manual.racer-finishes.json
      - name: Recompute exploratory win-rate and actual-course comparison offline
        run: |
          node scripts/test-compare-exploratory-winrates-results.mjs
          node scripts/compare-exploratory-winrates-results.mjs research-historical/manual.official-entry-stats.json research-historical/manual.racer-finishes.json research-historical/manual.replayed-comparison.json
      - name: Verify pre-cutoff snapshot eligibility rules
        run: node scripts/test-validate-precutoff-snapshot.mjs
      - name: Test prediction snapshot record format
        run: node scripts/test-format-prediction-snapshot.mjs
      - name: Test prediction phase classification
        run: node scripts/test-classify-prediction-phase.mjs
      - name: Test strict pre-cutoff prediction and finish comparison
        run: node scripts/test-compare-precutoff-predictions.mjs
      - name: Test experimental ranking comparison integrity
        run: node scripts/test-compare-exploratory-ranking-models.mjs
      - name: Compare four experimental ranking weight sets offline
        run: node scripts/compare-exploratory-ranking-models.mjs research-historical/manual.official-entry-stats.json research-historical/manual.racer-finishes.json research-historical/manual.replayed-ranking-models.json
      - name: Upload replayed comparison
        uses: actions/upload-artifact@v4
        with:
          name: boat-score-2-offline-replay-${{ github.run_id }}
          path: |
            research-historical/manual.replayed-comparison.json
            research-historical/manual.replayed-ranking-models.json
          retention-days: 14
