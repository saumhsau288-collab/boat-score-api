name: Boat Score 2 all-venue racer method research
on:
  schedule:
    # 23:00 UTC = 08:00 JST next day; analyze completed prior-day results.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      archive_date:
        description: 'Final official archive date YYYY-MM-DD'
        required: true
        default: '2026-11-16'
      days:
        description: 'Number of consecutive days (1 to 28; scheduled runs use 7)'
        required: true
        default: '3'
      persist_history:
        description: 'Persist verified daily reports to isolated historical-research-data branch (uncheck for dry run)'
        type: boolean
        required: false
        default: true
  push:
    branches: [main]
    paths:
      - 'scripts/join_official_all_venues.py'
      - 'scripts/test_join_official_all_venues.py'
      - 'scripts/analyze_racer_winning_methods.py'
      - 'scripts/test_analyze_racer_winning_methods.py'
      - 'scripts/analyze_archived_racer_history.py'
      - 'scripts/test_analyze_archived_racer_history.py'
      - 'scripts/merge_immutable_history.py'
      - 'scripts/test_merge_immutable_history.py'
      - 'scripts/audit_official_incidents.py'
      - 'scripts/test_audit_official_incidents.py'
      - 'scripts/compare_offline_predictions.py'
      - 'scripts/test_compare_offline_predictions.py'
      - 'scripts/audit_capture_official_overlap.py'
      - 'scripts/test_audit_capture_official_overlap.py'
      - 'scripts/preview_racer_score_evidence.py'
      - 'scripts/test_preview_racer_score_evidence.py'
      - 'scripts/report_six_racer_course_methods.py'
      - 'scripts/test_report_six_racer_course_methods.py'
      - 'scripts/combine_race_score_method_evidence.py'
      - 'scripts/test_combine_race_score_method_evidence.py'
      - 'scripts/run_offline_race_evidence.py'
      - 'scripts/test_run_offline_race_evidence.py'
      - 'scripts/official_race_offline_evidence.py'
      - 'scripts/test_official_race_offline_evidence.py'
      - 'scripts/audit_official_score_input_coverage.py'
      - 'scripts/test_audit_official_score_input_coverage.py'
      - 'scripts/audit_prediction_snapshot_evidence.py'
      - 'scripts/test_audit_prediction_snapshot_evidence.py'
      - 'scripts/capture-existing-boat-score-2-predictions.mjs'
      - 'scripts/validate-morning-capture.mjs'
      - 'scripts/test-validate-morning-capture.mjs'
      - 'scripts/audit-morning-input-coverage.mjs'
      - 'scripts/test-audit-morning-input-coverage.mjs'
      - 'scripts/classify-morning-capture-quality.mjs'
      - 'scripts/test-classify-morning-capture-quality.mjs'
      - 'scripts/compare-score-variants.mjs'
      - 'scripts/test-compare-score-variants.mjs'
      - 'scripts/preview-score-race-ranking.mjs'
      - 'scripts/test-preview-score-race-ranking.mjs'
      - 'scripts/partial-score-evidence.mjs'
      - 'scripts/test-partial-score-evidence.mjs'
      - 'scripts/score-uncertainty-bounds.mjs'
      - 'scripts/test-score-uncertainty-bounds.mjs'
      - 'scripts/audit-capture-score-inputs.mjs'
      - 'scripts/test-audit-capture-score-inputs.mjs'
      - '.github/workflows/boat-score-2-capture-morning-predictions.yml'
      - '.github/workflows/boat-score-2-all-venue-methods.yml'
concurrency:
  group: boat-score-2-daily-offline-research
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser and method analysis
        run: |
          python3 -m unittest discover -s scripts -p 'test_parse_official_bk.py'
          python3 -m unittest discover -s scripts -p 'test_analyze_racer_winning_methods.py'
          python3 -m unittest discover -s scripts -p 'test_join_official_all_venues.py'
          python3 -m unittest discover -s scripts -p 'test_analyze_archived_racer_history.py'
          python3 -m unittest discover -s scripts -p 'test_merge_immutable_history.py'
          python3 -m unittest discover -s scripts -p 'test_audit_official_incidents.py'
          python3 -m unittest discover -s scripts -p 'test_compare_offline_predictions.py'
          python3 -m unittest discover -s scripts -p 'test_audit_capture_official_overlap.py'
          python3 -m unittest discover -s scripts -p 'test_preview_racer_score_evidence.py'
          python3 -m unittest discover -s scripts -p 'test_report_six_racer_course_methods.py'
          python3 -m unittest discover -s scripts -p 'test_combine_race_score_method_evidence.py'
          python3 -m unittest discover -s scripts -p 'test_audit_official_score_input_coverage.py'
          python3 -m unittest discover -s scripts -p 'test_audit_prediction_snapshot_evidence.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify morning capture logic offline
        run: |
          node --check scripts/capture-existing-boat-score-2-predictions.mjs
          node --check scripts/validate-morning-capture.mjs
          node scripts/test-validate-morning-capture.mjs
          node scripts/test-audit-morning-input-coverage.mjs
          node scripts/test-classify-morning-capture-quality.mjs
          node scripts/test-compare-score-variants.mjs
          node scripts/test-preview-score-race-ranking.mjs
          node scripts/test-partial-score-evidence.mjs
          node scripts/test-score-uncertainty-bounds.mjs
          python3 -m unittest discover -s scripts -p 'test_run_offline_race_evidence.py'
          python3 -m unittest discover -s scripts -p 'test_official_race_offline_evidence.py'
          node scripts/test-audit-capture-score-inputs.mjs
      - name: Install archive extractor
        run: sudo apt-get update -qq && sudo apt-get install -y libarchive-tools
      - name: Download daily official B/K archives
        env:
          ARCHIVE_DATE: ${{ inputs.archive_date || '' }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          python3 - <<'PY'
          import datetime,os
          today=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          # A scheduled run must never use incomplete current-day results.
          end=datetime.date.fromisoformat(os.environ['ARCHIVE_DATE']) if os.environ['ARCHIVE_DATE'] else today-datetime.timedelta(days=1)
          days=int(os.environ['DAYS'])
          if not 1<=days<=28:raise SystemExit('days must be 1..28')
          if end>today:raise SystemExit('future date')
          start=end-datetime.timedelta(days=days-1)
          with open('archive-range.txt','w') as f:f.write(start.isoformat()+' '+end.isoformat()+'\n')
          PY
          read START END < archive-range.txt
          python3 scripts/fetch_official_archives.py --start "$START" --end "$END" --out data/raw --max-days 28
          mkdir -p data/decoded/B data/decoded/K
          for KIND in B K; do
            for F in data/raw/"$KIND"/*.lzh; do
              [ -f "$F" ] || continue
              bsdtar -xf "$F" -C "data/decoded/$KIND"
            done
          done
      - name: Join all active venues and aggregate racer evidence
        run: |
          mkdir -p data/reports reports
          python3 - <<'PY'
          import datetime,json,subprocess
          from pathlib import Path
          start,end=map(datetime.date.fromisoformat,Path('archive-range.txt').read_text().split())
          reports=[]
          day_summaries=[]
          for offset in range((end-start).days+1):
            day=start+datetime.timedelta(days=offset)
            date=day.strftime('%Y%m%d')
            b=Path('data/decoded/B')/('B'+day.strftime('%y%m%d')+'.TXT')
            k=Path('data/decoded/K')/('K'+day.strftime('%y%m%d')+'.TXT')
            if not b.exists() or not k.exists():raise SystemExit('missing archive text '+date)
            target=Path('data/reports')/(date+'.json')
            subprocess.run(['python3','scripts/join_official_all_venues.py','--b',str(b),'--k',str(k),'--date',date,'--output',str(target)],check=True)
            report=json.loads(target.read_text())
            if not report['reports']:raise SystemExit('no matched venues '+date)
            venue_summaries=report['venueSummary']
            matched=sum(v['matchedRaces'] for v in venue_summaries)
            rejected=sum(len(v['rejectedRaces']) for v in venue_summaries)
            if matched!=sum(len(r['records']) for r in report['reports']):raise SystemExit('per-venue race count mismatch '+date)
            day_summaries.append({'date':date,'activeVenues':len(venue_summaries),'verifiedRaces':matched,'rejectedRaces':rejected,'venuesWithNoVerifiedRaces':[v['venue'] for v in venue_summaries if v['matchedRaces']==0]})
            reports.extend(r['records'] for r in report['reports'])
          rows=[r for day in reports for r in day]
          if not rows:raise SystemExit('no verified race rows')
          Path('data/all-venue-reports.json').write_text(json.dumps({'records':rows},ensure_ascii=False))
          Path('reports/daily-data-completeness.json').write_text(json.dumps({'days':day_summaries,'totalVerifiedRaces':len(rows),'totalRejectedRaces':sum(d['rejectedRaces'] for d in day_summaries),'warning':'Rejected races and venues with zero verified races are excluded, not assumed to have no racing'},ensure_ascii=False,indent=2)+'\n')
          print('Daily data completeness:',json.dumps(day_summaries,ensure_ascii=False))
          print('Verified race rows:',len(rows))
          PY
          python3 scripts/audit_official_incidents.py --reports data/reports --output reports/official-incident-audit.json
          python3 scripts/audit_official_score_input_coverage.py --input data/all-venue-reports.json --output reports/official-score-input-coverage.json
          python3 scripts/analyze_racer_winning_methods.py data/all-venue-reports.json --output reports/all-venue-racer-winning-methods.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/all-venue-racer-winning-methods.json').read_text())
          rows=json.loads(Path('data/all-venue-reports.json').read_text())['records']
          if r['raceCount']!=len(rows):raise SystemExit('race count mismatch')
          if sum(r['winningMethods'].values())+r['unverifiedWinningMethods']!=r['raceCount']:raise SystemExit('method coverage mismatch')
          if r['racersMeetingTechniqueSampleThreshold']+r['racersBelowTechniqueSampleThreshold']!=r['uniqueRacers']:raise SystemExit('racer coverage mismatch')
          if any(x['sampleInsufficientForIndividualTechniquePreference'] and x['winningMethodSharesOfWinsPercent'] is not None for x in r['racerEvidence']):raise SystemExit('small-sample rates must be suppressed')
          if r['racersMeetingTechniqueSampleThreshold']==0:print('NOTICE: No racers meet method sample threshold; do not use individual method percentages')
          summary={'raceCount':r['raceCount'],'uniqueRacers':r['uniqueRacers'],'verifiedWinningMethods':sum(r['winningMethods'].values()),'unverifiedWinningMethods':r['unverifiedWinningMethods'],'racerMethodThreshold':r['racerMethodSampleThreshold'],'racersMeetingThreshold':r['racersMeetingTechniqueSampleThreshold'],'racersBelowThreshold':r['racersBelowTechniqueSampleThreshold'],'methodCounts':r['winningMethods'],'warning':'Historical observations only, not verified pre-race forecasts; do not adjust live scoring weights'}
          Path('reports/all-venue-method-coverage.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Exercise actual official race through offline score and method pipeline
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('data/reports').glob('*.json'))
          selected=None
          for file in files:
            daily=json.loads(file.read_text(encoding='utf-8'))
            for venue in daily.get('reports',[]):
              for row in venue.get('records',[]):
                if row.get('resultVerified') is True and len(row.get('racers',[]))==6:
                  selected=(file,row['venue'],row['race'])
                  break
              if selected:break
            if selected:break
          if not selected:raise SystemExit('No official verified race to exercise')
          Path('reports/official-race-smoke-selection.json').write_text(
            json.dumps({'source':str(selected[0]),'venue':selected[1],'race':selected[2],
              'retrospectiveOnly':True},ensure_ascii=False,indent=2))
          print('Selected verified retrospective race:',selected)
          PY
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          s=json.loads(Path('reports/official-race-smoke-selection.json').read_text())
          subprocess.run(['python3','scripts/official_race_offline_evidence.py',
            '--official-report',s['source'],
            '--history','reports/all-venue-racer-winning-methods.json',
            '--venue',str(s['venue']),'--race',str(s['race']),
            '--output','reports/official-race-smoke-evidence.json'],check=True)
          r=json.loads(Path('reports/official-race-smoke-evidence.json').read_text())
          if len(r['racers'])!=6 or r['accuracyCalculationPermitted'] is not False or r['retrospectiveOnly'] is not True:
            raise SystemExit('Unsafe or incomplete retrospective evidence')
          print('Actual official race score and method pipeline passed')
          PY
      - name: Summarize retrospective official race evidence on mobile
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          lines=['## Boat Score 2: official race retrospective check','',
            'This is post-race official archive analysis, not a pre-race prediction.','']
          selection=Path('reports/official-race-smoke-selection.json')
          evidence=Path('reports/official-race-smoke-evidence.json')
          if selection.exists():
            try:
              s=json.loads(selection.read_text(encoding='utf-8'))
              lines.extend(['Selected: '+str(s.get('source'))+' / venue '+str(s.get('venue'))+' / race '+str(s.get('race')),''])
            except (ValueError,OSError) as exc:
              lines.extend(['Selection JSON unreadable: '+str(exc),''])
          if evidence.exists():
            try:
              r=json.loads(evidence.read_text(encoding='utf-8'))
              lines.extend(['| Boat | Score lower | Score upper | Missing score inputs | Historical method sample |',
                '|---:|---:|---:|---|---|'])
              for racer in r['racers']:
                lines.append('| '+str(racer['boat'])+' | '+str(racer['scoreLowerBound'])+' | '+
                  str(racer['scoreUpperBound'])+' | '+', '.join(racer['missingScoreInputs'])+' | '+
                  str(racer['historicalMethodStatus'])+' |')
              lines.extend(['','No score weight change or accuracy claim is permitted.'])
            except (ValueError,KeyError,TypeError,OSError) as exc:
              lines.append('Evidence JSON unreadable: '+str(exc))
          else:
            lines.append('No completed official race evidence. Inspect failed workflow step and uploaded diagnostics.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
            out.write(chr(10).join(lines)+chr(10))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-all-venue-racer-methods
          path: |
            data/reports/
            reports/all-venue-racer-winning-methods.json
            reports/all-venue-method-coverage.json
            reports/daily-data-completeness.json
            reports/official-incident-audit.json
            reports/official-race-smoke-selection.json
            reports/official-race-smoke-evidence.json
          retention-days: 90
      - name: Show history persistence decision
        run: |
          echo 'Event: ${{ github.event_name }}'
          echo 'Manual persistence selected: ${{ inputs.persist_history }}'
          echo 'Persistence runs on schedule or manual dispatch with persist_history=true'
      - name: Persist verified daily reports on isolated research branch
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.persist_history == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          reports=sorted(Path('data/reports').glob('*.json'))
          if not reports:raise SystemExit('No verified reports to archive')
          for f in reports:
            report=json.loads(f.read_text())
            if not report.get('reports'):raise SystemExit('Empty research report: '+str(f))
          print('Validated',len(reports),'daily reports for persistent archive')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/boat-score-history
          cp data/reports/*.json /tmp/boat-score-history/
          cp scripts/analyze_archived_racer_history.py scripts/analyze_racer_winning_methods.py scripts/merge_immutable_history.py /tmp/boat-score-history/
          if git ls-remote --exit-code --heads origin historical-research-data >/dev/null; then
            git fetch origin historical-research-data
            git switch -c historical-research-data --track origin/historical-research-data
          else
            git switch --orphan historical-research-data
            git rm -rf --quiet . || true
          fi
          mkdir -p verified-daily
          python3 /tmp/boat-score-history/merge_immutable_history.py --incoming /tmp/boat-score-history --archive verified-daily --summary /tmp/boat-score-history/results/merge-summary.json
          mkdir -p reports
          cp /tmp/boat-score-history/results/merge-summary.json reports/history-merge-summary.json
          # Run the offline analyzer against every accumulated day, not just this week's window.
          mkdir -p /tmp/boat-score-history/results
          python3 /tmp/boat-score-history/analyze_archived_racer_history.py --archive verified-daily --output /tmp/boat-score-history/results/long-term-racer-methods.json
          mkdir -p aggregate
          cp /tmp/boat-score-history/results/long-term-racer-methods.json aggregate/long-term-racer-methods.json
          git add verified-daily aggregate/long-term-racer-methods.json
          if git diff --cached --quiet; then
            echo 'Historical archive already current'
          else
            git commit -m "Archive verified daily race reports"
            git push origin HEAD:refs/heads/historical-research-data
          fi
      - name: Upload immutable archive merge decisions
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.persist_history == true)
        uses: actions/upload-artifact@v4
        with:
          name: official-history-merge-summary
          path: /tmp/boat-score-history/results/merge-summary.json
          retention-days: 90
