name: Boat Score 2 isolated official historical diagnostics
on:
  push:
    branches:
      - fix-boat-score-2-syntax-20261115
    paths:
      - '.github/workflows/boat-score-2-official-history-diagnostics.yml'
      - 'scripts/extract-official-result-racers.mjs'
      - 'scripts/fetch-historical-official-entry-lists.mjs'
      - 'scripts/inspect-historical-entry-winrates.mjs'
      - 'scripts/fetch-manual-official-historical-results.mjs'
      - 'scripts/test-fetch-manual-official-historical-results.mjs'
      - 'scripts/summarize-official-inside-courses.mjs'
      - 'scripts/test-summarize-official-inside-courses.mjs'
      - 'scripts/validate-historical-prerace-snapshot.mjs'
      - 'scripts/test-validate-historical-prerace-snapshot.mjs'
      - 'scripts/compare-historical-saved-predictions.mjs'
      - 'scripts/test-compare-historical-saved-predictions.mjs'
      - 'scripts/build-prerace-prediction-snapshot.mjs'
      - 'scripts/test-build-prerace-prediction-snapshot.mjs'
      - 'scripts/test-extract-official-result-diagnostics.mjs'
      - 'scripts/compare-prerace-winrate-finishes.mjs'
      - 'scripts/test-compare-prerace-winrate-finishes.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline diagnostic parser and fetcher
        run: |
          node scripts/test-extract-official-result-diagnostics.mjs
          node scripts/test-fetch-manual-official-historical-results.mjs
          node scripts/test-summarize-official-inside-courses.mjs
          node scripts/test-validate-historical-prerace-snapshot.mjs
          node scripts/test-compare-historical-saved-predictions.mjs
          node scripts/test-build-prerace-prediction-snapshot.mjs
          node scripts/test-compare-prerace-winrate-finishes.mjs
          node scripts/test-compare-exploratory-winrates-results.mjs
      - name: Fetch historical entry lists for three races (research only)
        run: |
          mkdir -p research-historical
          node scripts/fetch-historical-official-entry-lists.mjs 20261118 2 1,2,3 research-historical/manual.official-entries.json
      - name: Report entry-list fetch status without pre-cutoff claims
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("research-historical/manual.official-entries.json","utf8")); for(const p of d.pages) console.log(JSON.stringify({race:p.race,status:p.status,error:p.error??null,preCutoffSnapshotVerified:p.preCutoffSnapshotVerified,winRatesVerified:p.winRatesVerified}));'
      - name: Inspect racer IDs and win-rate labels in saved entry HTML
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("research-historical/manual.official-entries.json","utf8")); for(const p of d.pages){if(!p.html){console.log(JSON.stringify({race:p.race,status:p.status}));continue;} const html=p.html; const ids=[...html.matchAll(/(?:toban=|toban%3D)([0-9]{4})/gi)].map(m=>m[1]); const unique=[...new Set(ids)]; const labels={national:html.includes("全国勝率"),local:html.includes("当地勝率"),nationalAlternate:html.includes("全国"),localAlternate:html.includes("当地")}; console.log(JSON.stringify({race:p.race,status:p.status,htmlBytes:html.length,uniqueRacerIds:unique.length,racerIds:unique.slice(0,12),labels,preCutoffSnapshotVerified:false,winRatesVerified:false}));}'
      - name: Parse historical racer win rates with existing worker parser
        run: |
          node scripts/inspect-historical-entry-winrates.mjs research-historical/manual.official-entries.json worker.js research-historical/manual.official-entry-stats.json
      - name: Fetch matching three-race historical results (exploratory sample)
        run: |
          mkdir -p research-historical
          node scripts/fetch-manual-official-historical-results.mjs 20261118 2 1,2,3 research-historical/manual.official-raw.json
      - name: Print fetch attempts and errors per race
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("research-historical/manual.official-raw.json","utf8")); for(const p of d.pages) console.log(JSON.stringify({date:p.date,venue:p.venue,race:p.race,status:p.status,attempts:p.attempts,error:p.error??null}));'
      - name: Report parsing status by race
        run: |
          node scripts/extract-official-result-racers.mjs research-historical/manual.official-raw.json research-historical/manual.racer-finishes.json
      - name: Print per-race extraction evidence (no pre-race claims)
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("research-historical/manual.racer-finishes.json","utf8")); for(const r of d.rows) console.log(JSON.stringify({date:r.date,venue:r.venue,race:r.race,status:r.status,podium:r.podium,entryCoursesExtracted:r.entryCoursesExtracted,startOrderBoats:r.startOrderBoats,racers:r.racers.map(x=>({boat:x.boat,finish:x.finish,actualEntryCourse:x.actualEntryCourse})),independentlyVerified:r.racerFinishIndependentlyVerified}));'
      - name: Compare racer average win rates against parsed historical finishes
        run: |
          node scripts/compare-exploratory-winrates-results.mjs research-historical/manual.official-entry-stats.json research-historical/manual.racer-finishes.json research-historical/manual.exploratory-winrate-finishes.json
      - name: Report evidence readiness for win-rate versus finish comparison
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("research-historical/manual.racer-finishes.json","utf8")); const parsed=d.rows.filter(r=>r.status==="parsed_needs_independent_review"); const verified=parsed.filter(r=>r.racerFinishIndependentlyVerified===true); const hasPreRaceWinRates=parsed.filter(r=>r.racers.length===6&&r.racers.every(x=>x.preRaceNationalWinRateVerified===true&&Number.isFinite(x.preRaceNationalWinRate))).length; console.log(JSON.stringify({parsedResultRaces:parsed.length,independentlyVerifiedResultRaces:verified.length,racesWithVerifiedPreRaceWinRates:hasPreRaceWinRates,eligibleRealWinRateFinishComparisons:parsed.filter(r=>r.racerFinishIndependentlyVerified===true&&r.racers.length===6&&r.racers.every(x=>x.preRaceNationalWinRateVerified===true&&Number.isFinite(x.preRaceNationalWinRate))).length,warning:"No historical score calibration without pre-race racer metrics and independently verified results"}));'
      - name: Summarize inner-course outcomes (post-race description only)
        run: node scripts/summarize-official-inside-courses.mjs research-historical/manual.racer-finishes.json
      - name: Upload offline evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-score-2-official-history-diagnostics-${{ github.run_id }}
          path: research-historical/
          retention-days: 14
          if-no-files-found: warn
