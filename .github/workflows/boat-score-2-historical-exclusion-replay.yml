name: Boat Score 2 historical exclusion replay (research only)
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Historical date YYYYMMDD"
        required: true
        default: "20261121"
        type: string
      venue:
        description: "Venue 1-24 or comma-separated venues (e.g. 2,3,4)"
        required: true
        default: "1"
        type: string
      race:
        description: "Race number 1-12 (leave empty for all 12 races)"
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  retrospective:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Boat Score 2 development branch
        uses: actions/checkout@v4
        with:
          ref: fix-boat-score-2-syntax-20261115
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate replay logic
        run: |
          node scripts/test-replay-exclusion-variants.mjs
          node --check scripts/collect-retrospective-exclusion-replay.mjs
          node --check scripts/report-historical-inner-favorites.mjs
          node --check scripts/report-boat1-high-score.mjs
          node --check scripts/analyze-boat1-second.mjs
          node --check scripts/report-top-three-rank-finish.mjs
          node scripts/test-top-three-rank-finish.mjs
      - name: Replay current app on historical official pages
        env:
          DATE: ${{ inputs.date }}
          VENUE: ${{ inputs.venue }}
          RACE: ${{ inputs.race }}
        run: |
          if [ -n "$RACE" ]; then
            node scripts/collect-retrospective-exclusion-replay.mjs "$DATE" "$VENUE" "$RACE"
          else
            node scripts/collect-retrospective-exclusion-replay.mjs "$DATE" "$VENUE"
          fi
      - name: Compare historical inner-side score leaders with official finishes
        run: node scripts/report-historical-inner-favorites.mjs retrospective-exclusion-*.json
      - name: Audit ONLY boat 1 highest-score historical races
        run: node scripts/report-boat1-high-score.mjs retrospective-exclusion-*.json
      - name: Examine boat 1 second-place cases and six-pick alternatives
        run: node scripts/analyze-boat1-second.mjs historical-boat1-high-score-report.json
      - name: Audit top-three score ranks against every verified finish
        run: node scripts/report-top-three-rank-finish.mjs retrospective-exclusion-*.json
      - name: Save diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: boat-score-2-retrospective-exclusion
          path: |
            retrospective-exclusion-*.json
            historical-inner-favorites-report.json
            historical-boat1-high-score-report.json
            historical-boat1-second-analysis.json
            historical-top-three-rank-finish-report.json
          if-no-files-found: error
