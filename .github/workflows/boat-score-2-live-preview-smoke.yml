name: Research live Boat Score 2 preview smoke (read only)
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYYMMDD; blank uses current Japan date'
        required: false
        type: string
      venue:
        description: 'Venue number 1-24'
        required: false
        default: '21'
        type: string
      race:
        description: 'Race number 1-12'
        required: false
        default: '1'
        type: string
  push:
    branches:
      - research/st-course-holdout-20261121
    paths:
      - scripts/smoke-deployed-boat-score-2-preview.mjs
      - .github/workflows/boat-score-2-live-preview-smoke.yml
permissions:
  contents: read
jobs:
  live-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - venue: '21'
            race: '1'
          - venue: '21'
            race: '4'
          - venue: '17'
            race: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe deployed preview read-only (no release)
        env:
          SMOKE_DATE: ${{ inputs.date }}
          SMOKE_VENUE: ${{ inputs.venue || matrix.venue }}
          SMOKE_RACE: ${{ inputs.race || matrix.race }}
          SMOKE_REQUIRE_READY: 'true'
        run: node scripts/smoke-deployed-boat-score-2-preview.mjs
