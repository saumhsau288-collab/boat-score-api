name: Diagnose real official Boat Score 2 research data (manual)

on:
  workflow_dispatch:
    inputs:
      venue:
        description: 'BOATRACE venue code 01-24'
        required: true
        default: '01'
        type: string
      date:
        description: 'Race date YYYYMMDD'
        required: true
        default: '20261121'
        type: string
      race:
        description: 'Race number 1-12'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      VENUE: ${{ inputs.venue }}
      RACE_DATE: ${{ inputs.date }}
      RACE: ${{ inputs.race }}
      API_BASE: https://boat-score-2-research-api-preview.saumh-sau-288.workers.dev
    steps:
      - name: Fetch and report real official source diagnostics
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const venue=process.env.VENUE,date=process.env.RACE_DATE,race=process.env.RACE;
          if(!/^(0[1-9]|1[0-9]|2[0-4])$/.test(venue)||!/^20\d{6}$/.test(date)||
             !/^(?:[1-9]|1[0-2])$/.test(race))throw Error('Invalid venue, date, or race input');
          const query=new URLSearchParams({venue,date,race});
          const lines=['## Official racelist diagnostic','',`Selection: venue ${venue}, date ${date}, race ${race}`,''];
          for(const route of ['official-racelist','official-metrics']){
            const url=`${process.env.API_BASE}/api/research/${route}?${query}`;
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(25000)});
              const body=await response.json();
              const safe={
                status:body.status,verified:body.verified??null,reason:body.reason??null,
                racerCount:body.racers?.length??0,
                racerIds:(body.racers||[]).map(r=>({boat:r.boat,racerId:r.racerId})),
                diagnostics:body.diagnostics??null,
                racerCandidates:(body.racerCandidates||[]).map(r=>({racerId:r.racerId,name:r.name})).slice(0,12),
                mapping:body.mapping?{verified:body.mapping.verified,
                  reason:body.mapping.reason,candidateRows:body.mapping.candidateRows}:null,
                httpStatus:body.httpStatus??null
              };
              console.log(route,'HTTP',response.status,JSON.stringify(safe));
              lines.push(`### ${route}`,`HTTP ${response.status}`, '```json',
                JSON.stringify(safe,null,2),'```','');
            }catch(error){
              console.log(route,'fetch error',String(error));
              lines.push(`### ${route}`,`Fetch error: ${String(error)}`,'');
            }
          }
          lines.push('These are live-source diagnostics, not validated predictions. Missing or unverified data must not be filled with guessed values.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - name: Inspect official grouped table shape without making boat assignments
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const u=new URL('https://www.boatrace.jp/owpc/pc/race/racelist');
          u.search=new URLSearchParams({rno:String(Number(process.env.RACE)),jcd:process.env.VENUE,hd:process.env.RACE_DATE}).toString();
          const clean=s=>s.replace(/<[^>]*>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/\s+/g,' ').trim().slice(0,55);
          try{
            const res=await fetch(u,{headers:{Accept:'text/html'},signal:AbortSignal.timeout(25000)});
            if(!res.ok)throw Error('Official site HTTP '+res.status);
            const html=await res.text();
            if(html.length>2_000_000)throw Error('Official HTML exceeded 2 MB inspection limit');
            const tables=[...html.matchAll(/<table\b[^>]*>([\s\S]*?)<\/table>/gi)].map(m=>m[1]);
            const table=tables.find(t=>/全国/.test(t)&&/当地/.test(t)&&/モーター/.test(t));
            if(!table)throw Error('Grouped metric table absent');
            const rows=[...table.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)].map(m=>m[1]);
            const sample=rows.slice(0,10).map((row,i)=>{
              const cells=[...row.matchAll(/<(th|td)\b([^>]*)>([\s\S]*?)<\/\1>/gi)].map(m=>({
                tag:m[1].toLowerCase(),colspan:(m[2].match(/\bcolspan=["']?(\d+)/i)||[])[1]||'1',
                rowspan:(m[2].match(/\browspan=["']?(\d+)/i)||[])[1]||'1',
                class:(m[2].match(/\bclass=["']([^"']+)/i)||[])[1]?.slice(0,80)||'',
                text:clean(m[3]),racerId:(m[3].match(/(?:\?|&)toban=(\d{4})/i)||[])[1]||null
              }));
              return {row:i+1,cellCount:cells.length,cells:cells.slice(0,i<3?30:26)};
            });
            console.log('OFFICIAL_GROUPED_TABLE_SHAPE',JSON.stringify({rowCount:rows.length,sample}));
            const fence=String.fromCharCode(96).repeat(3);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '\n### Official grouped HTML shape (inspection only)\n'+fence+'json\n'+
              JSON.stringify({rowCount:rows.length,sample},null,2)+'\n'+fence+'\n');
          }catch(e){
            console.log('OFFICIAL_GROUPED_TABLE_SHAPE_ERROR',String(e));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n### Official grouped HTML shape unavailable\n'+String(e)+'\n');
          }
          NODE
