name: Research-only archived morning capture inspection
on:
  workflow_dispatch:
  push:
    branches: [diagnose-twelve-pick-tests-20261123]
    paths:
      - '.github/workflows/boat-score-2-archived-morning-inspection.yml'
      - 'scripts/inspect-raw-morning-capture.mjs'
      - 'scripts/audit-capture-response-shapes.mjs'
      - 'scripts/compare-archived-twelve-pick-structure.mjs'
      - 'scripts/compare-twelve-methods-with-results.mjs'
      - 'scripts/inventory-archive-official-matches.mjs'
      - 'scripts/test-inventory-archive-official-matches.mjs'
      - 'scripts/summarize-research-capture.mjs'
      - 'scripts/test-summarize-research-capture.mjs'
      - 'scripts/run-research-capture-pool.mjs'
      - 'scripts/test-run-research-capture-pool.mjs'
      - 'scripts/official-403-circuit-breaker.mjs'
      - 'scripts/test-official-403-circuit-breaker.mjs'
      - 'scripts/capture-existing-boat-score-2-predictions.mjs'
      - 'scripts/compare-spatial-hypothesis.mjs'
      - 'scripts/test-compare-spatial-hypothesis.mjs'
      - 'scripts/test-run-saved-capture-result-comparison.mjs'
      - 'scripts/run-spatial-hypothesis-comparison.mjs'
      - 'scripts/test-run-spatial-hypothesis-comparison.mjs'
      - 'scripts/compare-saved-tickets-to-spatial.mjs'
      - 'scripts/test-compare-saved-tickets-to-spatial.mjs'
      - 'scripts/audit-paired-comparison-readiness.mjs'
      - 'scripts/test-audit-paired-comparison-readiness.mjs'
      - 'scripts/run-saved-tickets-to-spatial.mjs'
      - 'scripts/test-run-saved-tickets-to-spatial.mjs'
      - 'scripts/predict-twelve-independent-hypotheses.mjs'
      - 'scripts/test-predict-twelve-independent-hypotheses.mjs'
      - 'scripts/compare-saved-tickets-to-twelve-hypotheses.mjs'
      - 'scripts/test-compare-saved-tickets-to-twelve-hypotheses.mjs'
      - 'scripts/run-saved-tickets-to-twelve-hypotheses.mjs'
      - 'scripts/test-run-saved-tickets-to-twelve-hypotheses.mjs'
      - 'scripts/diagnose-archive-readiness.mjs'
      - 'scripts/test-diagnose-archive-readiness.mjs'
      - 'scripts/research-capture-retry-policies.mjs'
      - 'scripts/classify-capture-failures.mjs'
      - 'scripts/test-classify-capture-failures.mjs'
      - 'scripts/plan-verified-venue-capture.mjs'
      - 'scripts/test-plan-verified-venue-capture.mjs'
      - 'scripts/plan-capture-from-reviewed-manifest.mjs'
      - 'scripts/test-plan-capture-from-reviewed-manifest.mjs'
      - 'scripts/compare-saved-capture-results.mjs'
      - 'scripts/test-compare-saved-capture-results.mjs'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test descriptive race-key joins
        run: |
          node scripts/test-inventory-archive-official-matches.mjs
          node scripts/test-diagnose-archive-readiness.mjs
          node scripts/test-compare-spatial-hypothesis.mjs
          node scripts/test-run-saved-capture-result-comparison.mjs
          node scripts/test-run-spatial-hypothesis-comparison.mjs
          node scripts/test-compare-saved-tickets-to-spatial.mjs
          node scripts/test-audit-paired-comparison-readiness.mjs
          node scripts/test-run-saved-tickets-to-spatial.mjs
          node scripts/test-predict-twelve-independent-hypotheses.mjs
          node scripts/test-compare-saved-tickets-to-twelve-hypotheses.mjs
          node --check scripts/run-saved-tickets-to-twelve-hypotheses.mjs
          node scripts/test-run-saved-tickets-to-twelve-hypotheses.mjs
          node scripts/test-classify-capture-failures.mjs
          node scripts/test-plan-verified-venue-capture.mjs
          node scripts/test-plan-capture-from-reviewed-manifest.mjs
          node scripts/test-compare-saved-capture-results.mjs
          node scripts/test-official-403-circuit-breaker.mjs
          node scripts/test-run-research-capture-pool.mjs
          node scripts/test-summarize-research-capture.mjs
          node --check scripts/capture-existing-boat-score-2-predictions.mjs
      - name: Download two known retained raw capture artifacts read-only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archived-captures
          for run in 44269317007 44639859914; do
            artifact_id=$(gh api "repos/$GH_REPO/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("boat-score-2-morning-raw-"))) | .id' | head -n 1)
            if [ -z "$artifact_id" ]; then echo "Missing retained artifact for run $run"; exit 1; fi
            gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" > "/tmp/boat-score-$run.zip"
            mkdir -p "archived-captures/$run"
            unzip -q "/tmp/boat-score-$run.zip" -d "archived-captures/$run"
          done
      - name: Inspect real raw capture structure without inferring hit rates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {inspectRawMorningCapture} from './scripts/inspect-raw-morning-capture.mjs';
          import {auditResponseShape} from './scripts/audit-capture-response-shapes.mjs';
          import {compareArchivedTwelvePicks} from './scripts/compare-archived-twelve-pick-structure.mjs';
          import {compareTwelveMethods} from './scripts/compare-twelve-methods-with-results.mjs';
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>{
            const p=path.join(dir,e.name);
            return e.isDirectory()?walk(p):e.name.endsWith('.json')?[p]:[];
          });
          const files=walk('archived-captures').filter(file=>/20\d{6}-\d+\.json$/.test(path.basename(file)));
          if(!files.length)throw Error('No dated raw capture JSON found in retained artifacts');
          const reports=files.map(file=>{
            const raw=JSON.parse(fs.readFileSync(file,'utf8'));
            const report=inspectRawMorningCapture(raw);
            const shapes=auditResponseShape(raw);
            const ticketComparison=compareArchivedTwelvePicks(raw);
            const twelveMethodAudit=compareTwelveMethods(raw,[]);
            if(report.status!=='research_only')throw Error('Unexpected raw capture shape in '+file);
            return {sourceFile:file,...report,ticketComparison,twelveMethodAudit:{compared:twelveMethodAudit.compared,held:twelveMethodAudit.held,holdReasons:twelveMethodAudit.holdReasons,methods:twelveMethodAudit.methods},responseFieldNames:shapes.possibleScoreInputFieldNames,
              topLevelResponseFields:Object.keys(shapes.topLevelKeys).sort(),readyResponsesShapeInspected:shapes.readyResponsesInspected};
          });
          console.log(JSON.stringify({status:'real_artifact_structure_inspected',reports,
            actualRaceResultsVerified:0,hitRateMeasured:false},null,2));
          NODE

      - name: Download known official parsed results for descriptive race-key join
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-join
          artifact_id=$(gh api "repos/$GH_REPO/actions/runs/45144329175/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("historical-official-smoke-"))) | .id' | head -n 1)
          if [ -z "$artifact_id" ]; then echo "Known official artifact missing"; exit 1; fi
          gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" > /tmp/official-join.zip
          unzip -q /tmp/official-join.zip -d official-join
      - name: Join saved predictions to parsed official race identities only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {inventoryArchiveOfficialMatches} from './scripts/inventory-archive-official-matches.mjs';
          import {diagnoseArchiveReadiness} from './scripts/diagnose-archive-readiness.mjs';
          import {summarizeCaptureFailureTypes} from './scripts/classify-capture-failures.mjs';
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>{
            const p=path.join(dir,e.name);return e.isDirectory()?walk(p):[p];
          });
          const archives=walk('archived-captures').filter(f=>/20\d{6}-\d+\.json$/.test(path.basename(f)))
            .map(f=>JSON.parse(fs.readFileSync(f,'utf8')));
          const results=['parsed.json','parsed-20261120.json'].map(f=>{
            const path='official-join/'+f;
            if(!fs.existsSync(path))throw Error('Missing parsed official report: '+f);
            return JSON.parse(fs.readFileSync(path,'utf8'));
          });
          const out=inventoryArchiveOfficialMatches(archives,results);
          console.log(JSON.stringify(out,null,2));
          console.log('FAILURE_TYPES '+JSON.stringify(summarizeCaptureFailureTypes(archives),null,2));
          console.log('READINESS_DIAGNOSTIC '+JSON.stringify(diagnoseArchiveReadiness(archives,[
            '20261118:2:1','20261118:2:2','20261118:2:3',
            '20261120:2:1','20261120:2:2','20261120:2:3']),null,2));
          const retrySummary={attemptRecords:0,firstTimeout:0,secondTimeout:0,firstSuccess:0,secondSuccess:0,missingAttemptHistory:0};
          for(const a of archives)for(const r of a.records??[]){
            const attempts=Array.isArray(r.attempts)?r.attempts:[];
            if(!attempts.length){retrySummary.missingAttemptHistory++;continue;}
            retrySummary.attemptRecords++;
            for(const [i,t] of attempts.entries()){
              if(t.httpStatus===200)retrySummary[i===0?'firstSuccess':'secondSuccess']++;
              if(typeof t.error==='string'&&/timeout|timed out|abort/i.test(t.error))retrySummary[i===0?'firstTimeout':'secondTimeout']++;
            }
          }
          console.log('RETRY_OBSERVED '+JSON.stringify(retrySummary));
          if(out.eligibleForAccuracy!==0)throw Error('Unverified diagnostic unexpectedly eligible for accuracy');
          NODE
