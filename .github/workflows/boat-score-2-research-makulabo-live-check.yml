name: Inspect live Makulabo heatmap source (research only)
on:
  push:
    branches: [research-cutoff-join-gate-20261120]
    paths:
      - '.github/workflows/boat-score-2-research-makulabo-live-check.yml'
      - 'scripts/inspect-makulabo-heatmap-structure.mjs'
      - 'scripts/parse-makulabo-heatmap-six.mjs'
      - 'scripts/test-parse-makulabo-heatmap-six.mjs'
      - 'scripts/check-live-official-makulabo-identity.mjs'
      - 'scripts/audit-makulabo-historical-cutoff.mjs'
      - 'scripts/test-audit-makulabo-historical-cutoff.mjs'
      - 'scripts/prepare-makulabo-morning-evidence.mjs'
      - 'scripts/test-prepare-makulabo-morning-evidence.mjs'
  workflow_dispatch:
    inputs:
      date:
        description: YYYYMMDD
        default: '20261121'
      venue:
        description: Venue code
        default: '01'
      race:
        description: Race number
        default: '1'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Makulabo morning evidence gate
        run: node scripts/test-prepare-makulabo-morning-evidence.mjs
      - name: Test historical cutoff and future leakage protection
        run: node scripts/test-audit-makulabo-historical-cutoff.mjs
      - name: Test strict six-row heatmap parser
        run: node scripts/test-parse-makulabo-heatmap-six.mjs
      - name: Validate live six-row Makulabo counts (no scoring)
        env:
          RACE_DATE: ${{ inputs.date || '20261121' }}
          VENUE: ${{ inputs.venue || '01' }}
          RACE: ${{ inputs.race || '1' }}
        run: |
          node --experimental-default-type=module <<'NODE'
          import {parseMakulaboHeatmapSix} from './scripts/parse-makulabo-heatmap-six.mjs';
          const {RACE_DATE,VENUE,RACE}=process.env;
          const url='https://makulabo-jp.com/data/'+VENUE.padStart(2,'0')+'/'+Number(RACE)+'/heatmap?hd='+RACE_DATE;
          const res=await fetch(url,{signal:AbortSignal.timeout(20000)});
          if(!res.ok)throw Error('Makulabo HTTP '+res.status);
          const parsed=parseMakulaboHeatmapSix(await res.text());
          console.log('LIVE_MAKULABO_COUNTS',JSON.stringify(parsed));
          if(!parsed.verified||parsed.racers.length!==6)
            throw Error('Makulabo six-row finish-count structure not verified');
          if(parsed.racers.some(r=>r.eligibleAsVerifiedRecent50!==false))
            throw Error('Unverified source unexpectedly marked eligible for scoring');
          NODE
      - name: Verify six racer identities against official source
        env:
          RACE_DATE: ${{ inputs.date || '20261121' }}
          VENUE: ${{ inputs.venue || '01' }}
          RACE: ${{ inputs.race || '1' }}
        run: node scripts/check-live-official-makulabo-identity.mjs "$RACE_DATE" "$VENUE" "$RACE"
      - name: Inspect source layout without scoring or deployment
        env:
          RACE_DATE: ${{ inputs.date || '20261121' }}
          VENUE: ${{ inputs.venue || '01' }}
          RACE: ${{ inputs.race || '1' }}
        run: |
          node scripts/inspect-makulabo-heatmap-structure.mjs "$RACE_DATE" "$VENUE" "$RACE"
