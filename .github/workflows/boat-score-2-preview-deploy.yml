name: Deploy Boat Score 2 preview (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boat-score-2-preview-only
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Boat Score 2 development branch only
        uses: actions/checkout@v4
        with:
          ref: fix-boat-score-2-syntax-20261115
          persist-credentials: false
      - name: Verify isolated branch
        run: |
          test "$(git branch --show-current)" = "fix-boat-score-2-syntax-20261115"
          test -f worker.js
      - name: Validate Worker syntax
        run: node --input-type=module --check < worker.js
      - name: Verify isolated preview version metadata
        run: |
          grep -F "sourceBranch:'fix-boat-score-2-syntax-20261115'" worker.js
          grep -F "app:'Boat Score 2 preview'" worker.js
      - name: Check Cloudflare credentials are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
      - name: Deploy ONLY separate Boat Score 2 preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy worker.js --name boat-score-2-preview --compatibility-date 2026-11-01
