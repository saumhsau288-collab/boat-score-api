name: Deploy Boat Score 2 isolated preview

on:
  workflow_dispatch:
    inputs:
      research_only:
        description: 'Read-only research: Nov 24 and 25; skip deployment'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: boat-score-2-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: ${{ !inputs.research_only }}
    runs-on: ubuntu-latest
    environment: boat-score-2-preview
    steps:
      - name: Check required credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."
            exit 1
          fi
      - name: Checkout Boat Score 2 development branch only
        uses: actions/checkout@v4
        with:
          ref: fix-boat-score-2-syntax-20261115
          persist-credentials: false
      - name: Confirm isolated source branch
        run: |
          test "$(git branch --show-current)" = "fix-boat-score-2-syntax-20261115"
          echo "Deploying Boat Score 2 development branch only"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker syntax and ranking
        run: |
          node --input-type=module --check < worker.js
          node scripts/test-preview-integration.mjs
          node scripts/test-rank-audit-windows.mjs
          node --check generate-twelve-independent-methods.mjs
          node scripts/test-twelve-independent-preview.mjs
          node scripts/test-top-two-exclusion.mjs
          node scripts/test-evaluate-top-two-history.mjs
          node scripts/test-morning-coverage-guard.mjs
          node scripts/test-morning-winrate-fallback.mjs
          node scripts/test-evaluate-morning-ranking-history.mjs
          node scripts/test-replay-exclusion-variants.mjs
          node scripts/test-evaluate-saved-trifecta-selections.mjs
          node --check scripts/replay-exclusion-variants.mjs
          node --check scripts/audit-top-two-exclusions.mjs
          node scripts/test-morning-ranking-persistence.mjs
          node --check scripts/collect-morning-official-results.mjs
          node --test test-generate-twelve-independent-methods.mjs
          node history-analysis.test.mjs
          node ranking.test.mjs
      - name: Check required review handlers before deploy
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('worker.js', 'utf8');
          for (const handler of ["document.getElementById('reviewResult').addEventListener", "document.getElementById('loadSelectedRaceEvidence').addEventListener", "document.getElementById('fetchOfficialFinish').addEventListener"]) {
            if (!source.includes(handler)) throw new Error('Missing review handler: ' + handler);
          }
          console.log('Required Boat Score 2 review handlers present');
          NODE
      - name: Diagnose official site connectivity from GitHub runner
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json, time
          sources = {
            "pc_racelist": "https://www.boatrace.jp/owpc/pc/race/racelist?rno=1&jcd=15&hd=20261116",
            "pc_schedule": "https://www.boatrace.jp/owpc/pc/race/index?hd=20261116",
            "sp_race": "https://www.boatrace.jp/owsp/sp/race/index?hd=20261116&jcd=15",
          }
          for name, url in sources.items():
            start=time.monotonic()
            try:
              req=urllib.request.Request(url,headers={"Accept":"text/html","User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=10) as response:
                sample=response.read(1024)
                result={"source":name,"httpStatus":response.status,"contentType":response.headers.get("Content-Type",""),"sampleBytes":len(sample),"elapsedMs":round((time.monotonic()-start)*1000)}
            except Exception as error:
              result={"source":name,"errorType":type(error).__name__,"error":str(error)[:150],"elapsedMs":round((time.monotonic()-start)*1000)}
            print(json.dumps(result,ensure_ascii=False),flush=True)
          print("Connectivity-only probe; HTTP success does not verify six racer records.")
          PY
      - name: Configure isolated morning storage and schedule
        env:
          KV_NAMESPACE_ID: ${{ secrets.BOAT_SCORE_2_KV_NAMESPACE_ID }}
        run: |
          if [ -z "$KV_NAMESPACE_ID" ]; then
            echo "::error::Set BOAT_SCORE_2_KV_NAMESPACE_ID to a dedicated KV namespace for Boat Score 2."
            exit 1
          fi
          cat > wrangler.toml <<'TOML'
          name = "boat-score-2-preview"
          main = "worker.js"
          compatibility_date = "2026-11-01"
          workers_dev = true
          [triggers]
          crons = ["*/5 23 * * *", "*/5 15-22 * * *", "*/5 0-14 * * *"]
          TOML
          printf '\n[[kv_namespaces]]\nbinding = "MORNING_KV"\nid = "%s"\n' "$KV_NAMESPACE_ID" >> wrangler.toml
      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify deployed preview version
        shell: bash
        run: |
          set -euo pipefail
          URL="https://boat-score-2-preview.saumh-sau-288.workers.dev/api/version"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$URL" -o version.json &&
              node -e "const fs=require('fs');const d=require('./version.json');const src=fs.readFileSync('worker.js','utf8');const match=src.match(/build:'([^']+)'/);if(!match||d.app!=='Boat Score 2 preview'||d.build!==match[1]||d.sourceBranch!=='fix-boat-score-2-syntax-20261115')process.exit(1)"; then
              echo "Verified isolated preview build and source branch"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Preview version endpoint does not match expected Boat Score 2 development build"
          exit 1
      - name: Smoke-test screenshot tool HTML and controls
        shell: bash
        run: |
          set -euo pipefail
          URL="https://boat-score-2-preview.saumh-sau-288.workers.dev/tools/makulabo-screenshot"
          curl --fail --silent --show-error --max-time 25 "$URL" -o screenshot-tool.html
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('screenshot-tool.html', 'utf8');
          const ids = ['loadCsvCard','loadBeforeInfo','fetchOfficialFinish','reviewResult','scanOfficialResults','loadSelectedRaceEvidence','reviewSelectedEvidence','exportReviews','importReviews'];
          const missing = ids.filter(id => !html.includes('id="' + id + '"'));
          if (missing.length) throw new Error('Missing deployed screenshot tool controls: ' + missing.join(', '));
          console.log('Deployed screenshot tool includes all expected controls');
          NODE
      - name: Smoke-test deployed twelve-method UI and endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://boat-score-2-preview.saumh-sau-288.workers.dev"
          curl --fail --silent --show-error --max-time 25 "$BASE/" -o preview-home.html
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('preview-home.html','utf8');
          for(const id of ['predictTwelveMethods','twelveMethodStatus','twelveMethodOutput']) {
            if(!html.includes('id="'+id+'"'))throw new Error('Missing deployed twelve-method control: '+id);
          }
          if(!html.includes('/api/predict/independent-methods'))throw new Error('Twelve-method API is not wired in deployed UI');
          console.log('Deployed preview contains all twelve-method controls and API wiring');
          NODE
          status=$(curl --silent --show-error --max-time 25 -o endpoint.json -w '%{http_code}' "$BASE/api/predict/independent-methods?date=invalid&venue=1&race=1")
          test "$status" = 400 || { echo "::error::Unexpected twelve-method endpoint HTTP $status"; exit 1; }
          node -e "const d=require('./endpoint.json');if(d.error!=='Invalid date, venue or race')process.exit(1)"
          echo 'Deployed twelve-method API responds and validates inputs'

      - name: Inspect deployed morning snapshot without assuming completion
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          BASE="https://boat-score-2-preview.saumh-sau-288.workers.dev"
          status=$(curl --silent --show-error --max-time 25 -o morning-snapshot.json -w '%{http_code}' "$BASE/api/morning/snapshot?date=$DATE")
          node - "$status" "$DATE" <<'NODE'
          const fs=require('node:fs');
          const status=Number(process.argv[2]),date=process.argv[3];
          let d;
          try{d=JSON.parse(fs.readFileSync('morning-snapshot.json','utf8'));}
          catch{throw Error('Morning snapshot response is not valid JSON');}
          if(status===404&&d.status==='not_available'){
            console.log(JSON.stringify({date,httpStatus:status,status:d.status,verifiedRaces:0,message:'Morning snapshot not saved yet'}));
            process.exit(0);
          }
          if(status!==200)throw Error('Unexpected morning snapshot HTTP '+status+': '+JSON.stringify(d).slice(0,200));
          if(d.date!==date||!Array.isArray(d.venues)||!Array.isArray(d.completedVenues)||!d.categories)
            throw Error('Morning snapshot has an invalid structure');
          const counts=Object.values(d.verifiedRacesByVenue||{});
          if(counts.some(n=>!Number.isInteger(n)||n<0||n>12))
            throw Error('Invalid verified race count');
          const eligible=counts.reduce((a,n)=>a+n,0);
          if(eligible!==d.eligible)throw Error('Verified race count does not match eligible');
          const venueSet=new Set(d.venues.map(Number));
          if(venueSet.size!==d.venues.length||[...venueSet].some(n=>!Number.isInteger(n)||n<1||n>24))
            throw Error('Invalid or duplicated scheduled venue');
          const completed=new Set(d.completedVenues.map(Number));
          if(completed.size!==d.completedVenues.length||[...completed].some(n=>!venueSet.has(n)))
            throw Error('Invalid or duplicated completed venue');
          if([...completed].some(n=>Number(d.verifiedRacesByVenue?.[n])!==12))
            throw Error('Completed venue does not have 12 verified races');
          if(d.status==='completed'&&completed.size!==venueSet.size)
            throw Error('Completed status conflicts with incomplete venue coverage');
          const seenRaceKeys=new Set();
          let legacyMissingOrder=0,legacyMissingCapture=0;
          // The 2026-11-23 and 2026-11-25 KV snapshots have observed missing six-boat order fields.
          // Treat these dates as incomplete historical evidence, not valid accuracy samples.
          // The earlier snapshot was collected before six-boat order
          // persistence went live. Never reconstruct it from later race pages.
          const legacySnapshotDate=date==='20261123'||date==='20261125';
          for(const category of ['main','upset','chaos']){
            const picks=d.categories[category];
            if(!Array.isArray(picks)||picks.length>20)
              throw Error('Invalid '+category+' ranking size');
            for(const pick of picks){
              const venue=Number(pick?.venue),race=Number(pick?.race);
              if(String(pick?.date)!==date||!venueSet.has(venue)||
                 !Number.isInteger(race)||race<1||race>12||
                 pick?.category!==category||pick?.status!=='provisional_not_calibrated')
                throw Error('Invalid '+category+' race identity or provisional status');
              const key=venue+':'+race;
              if(seenRaceKeys.has(key))throw Error('Duplicate race across morning rankings: '+key);
              seenRaceKeys.add(key);
              // Older snapshots predate prediction-order persistence. Report, never backfill.
              // New snapshots must include six unique boats to support future accuracy tests.
              const order=pick.predictedOrder;
              if(date>= '20261123'&&(!Array.isArray(order)||order.length!==6||
                 new Set(order).size!==6||!order.every(n=>Number.isInteger(n)&&n>=1&&n<=6))){
                if(legacySnapshotDate)legacyMissingOrder++;
                else throw Error('Morning ranking missing valid six-boat predictedOrder: '+key);
              }
              if(date>='20261123'&&(!pick.capturedAt||Number.isNaN(Date.parse(pick.capturedAt)))){
                if(legacySnapshotDate)legacyMissingCapture++;
                else throw Error('Morning ranking missing capture timestamp: '+key);
              }
            }
          }
          console.log(JSON.stringify({date,httpStatus:status,status:d.status,venues:d.venues.length,
            completedVenues:d.completedVenues.length,eligible,failedVenues:(d.failedVenues||[]).length,
            main:(d.categories.main||[]).length,upset:(d.categories.upset||[]).length,
            chaos:(d.categories.chaos||[]).length,
            legacyMissingOrder,legacyMissingCapture,
            note:legacyMissingOrder||legacyMissingCapture?'Legacy morning snapshot: missing fields were NOT backfilled and must not be used for pre-race accuracy.':'Observed snapshot only; not a historical accuracy test.'}));
          NODE

  research-two-days:
    if: ${{ inputs.research_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read-only archived six-boat comparison
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://boat-score-2-preview.saumh-sau-288.workers.dev';
          const dates=['20261124','20261125'];
          const orderOK=a=>Array.isArray(a)&&a.length===6&&new Set(a).size===6&&a.every(n=>Number.isInteger(n)&&n>=1&&n<=6);
          const id=x=>x.venue+':'+x.race;
          const timely=x=>Number.isFinite(Date.parse(x.capturedAt))&&Number.isFinite(Date.parse(x.deadlineAt))&&Date.parse(x.capturedAt)<Date.parse(x.deadlineAt);
          async function get(path,date,params=''){
           try{const r=await fetch(base+path+'?date='+date+params,{signal:AbortSignal.timeout(20000)});if(!r.ok){console.log(JSON.stringify({date,path,http:r.status}));return null;}const d=await r.json();return d.date===date?d:null;}
           catch(e){console.log(JSON.stringify({date,path,error:String(e)}));return null;}
          }
          const groups={verified:[],exploratory:[],before:[]};
          for(const date of dates){
           const [morning,results,before,quality,health]=await Promise.all(['/api/research/morning-records','/api/research/result-archive','/api/research/before-audit','/api/research/archive-quality','/api/research/scheduler-health'].map(p=>get(p,date)));
           const candidates=(Array.isArray(morning?.records)?morning.records:[]).filter(x=>x?.date===date);
           const validResult=(f,x)=>f?.date===date&&f.venue===x.venue&&f.race===x.race&&f.verified===true&&orderOK(f.finishOrder);
           const recovered=new Map();
           const tasks=candidates.filter(x=>Array.isArray(x.rankedScores)&&x.rankedScores.length===6&&orderOK(x.rankedScores.map(y=>y.boat))&&x.rankedScores.every(y=>Number.isFinite(y.score))&&!validResult(results?.records?.[id(x)],x)&&(!Number.isFinite(Date.parse(x.deadlineAt))||Date.parse(x.deadlineAt)<Date.now()));
           let next=0;
           await Promise.all(Array.from({length:Math.min(4,tasks.length)},async()=>{
            while(next<tasks.length){
             const x=tasks[next++];
             const f=await get('/api/official/result',date,'&venue='+x.venue+'&race='+x.race);
             if(validResult(f,x))recovered.set(id(x),f);
             await new Promise(resolve=>setTimeout(resolve,250));
            }
           }));
           console.log('RECOVERY '+JSON.stringify({date,attempted:tasks.length,verified:recovered.size,health:health?.modes||null}));
           const seen=new Set();let missing=0,invalid=0,strict=0,legacy=0;
           for(const x of candidates){
            if(seen.has(id(x)))continue;seen.add(id(x));
            const scores=x.rankedScores;
            if(!Array.isArray(scores)||scores.length!==6||!orderOK(scores.map(y=>y.boat))||!scores.every(y=>Number.isFinite(y.score))){invalid++;continue;}
            const saved=results?.records?.[id(x)];const f=validResult(saved,x)?saved:recovered.get(id(x));
            if(f?.date!==date||f.venue!==x.venue||f.race!==x.race||f.verified!==true||!orderOK(f.finishOrder)){missing++;continue;}
            const ranked=scores.slice().sort((a,b)=>b.score-a.score||a.boat-b.boat);
            const verified=timely(x)&&orderOK(x.predictedOrder)&&x.predictedOrder.every((b,i)=>b===ranked[i].boat);
            const item={date,venue:x.venue,race:x.race,scores:Object.fromEntries(scores.map(y=>[y.boat,y.score])),finish:f.finishOrder};
            groups[verified?'verified':'exploratory'].push(item);if(verified)strict++;else legacy++;
           }
           for(const x of before?.records||[]){
            if(x.date!==date||!timely(x)||!orderOK(x.finishOrder)||!Array.isArray(x.start)||x.start.length!==6||!orderOK(x.start.map(y=>y.boat)))continue;
            const rows=x.start.map(y=>({boat:y.boat,course:y.course,st:y.st??y.startTiming??y.startTime}));
            if(!orderOK(rows.map(y=>y.course)))continue;
            if(!rows.every(y=>y.st!==null&&y.st!==undefined&&/^(?:0?\.\d+|0)$/.test(String(y.st))&&Number(y.st)>=0&&Number(y.st)<=1))continue;
            groups.before.push({date,finish:x.finishOrder,rows:rows.map(y=>({...y,st:Number(y.st)}))});
           }
           console.log('COVERAGE '+JSON.stringify({date,candidates:seen.size,strict,legacy,missing,invalid,quality:quality?{morning:quality.morning,before:quality.before,results:quality.results,matched:quality.matched}:null}));
          }
          function compare(rows,condition,outcome){
           const tally=a=>({n:a.length,count:a.filter(outcome).length,rate:a.length?Number((100*a.filter(outcome).length/a.length).toFixed(1)):null});
           return {condition:tally(rows.filter(condition)),comparison:tally(rows.filter(x=>!condition(x)))};
          }
          for(const [kind,rows] of Object.entries(groups)){
           for(const date of [...dates,'combined']){
            const a=rows.filter(x=>date==='combined'||x.date===date);
            if(kind==='before'){
             const spread=x=>{const st=x.rows.filter(y=>y.course<=3).map(y=>y.st);return Math.max(...st)-Math.min(...st);};
             console.log('ANALYSIS '+JSON.stringify({kind,date,n:a.length,innerSTClose_course4Podium:compare(a,x=>spread(x)<=.05+1e-9,x=>x.finish.slice(0,3).includes(x.rows.find(y=>y.course===4).boat))}));continue;
            }
            const spread=x=>Math.max(x.scores[1],x.scores[2],x.scores[3])-Math.min(x.scores[1],x.scores[2],x.scores[3]);
            console.log('ANALYSIS '+JSON.stringify({kind,date,n:a.length,innerScoreSpread3_boat4Podium:compare(a,x=>spread(x)<=3,x=>x.finish.slice(0,3).includes(4)),innerScoreSpread3_outerPodium:compare(a,x=>spread(x)<=3,x=>x.finish.slice(0,3).some(b=>b>=4))}));
           }
          }
          console.log('Limits: legacy candidates lack pre-deadline evidence; legacy observations are exploratory; boat numbers are not actual courses; ST means exhibition not race; no causal or betting accuracy claims.');
          NODE
