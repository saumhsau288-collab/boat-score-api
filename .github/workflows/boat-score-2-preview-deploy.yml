name: Deploy Boat Score 2 isolated preview

on:
  push:
    branches:
      - boat-score-2-data-fix-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boat-score-2-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: boat-score-2-preview
    steps:
      - name: Check required credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."
            exit 1
          fi
      - name: Checkout Boat Score 2 development branch only
        uses: actions/checkout@v4
        with:
          ref: boat-score-2-data-fix-20261114
          persist-credentials: false
      - name: Confirm isolated source branch
        run: |
          test "$(git branch --show-current)" = "boat-score-2-data-fix-20261114"
          echo "Deploying Boat Score 2 development branch only"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker syntax
        run: node --input-type=module --check < worker.js
      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy worker.js --name boat-score-2-preview --compatibility-date 2026-11-01
      - name: Verify deployed preview version
        shell: bash
        run: |
          set -euo pipefail
          URL="https://boat-score-2-preview.saumh-sau-288.workers.dev/api/version"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$URL" -o version.json &&
              node -e "const fs=require('fs');const d=require('./version.json');const src=fs.readFileSync('worker.js','utf8');const match=src.match(/build:'([^']+)'/);if(!match||d.app!=='Boat Score 2 preview'||d.build!==match[1]||d.sourceBranch!=='boat-score-2-data-fix-20261114')process.exit(1)"; then
              echo "Verified isolated preview build and source branch"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Preview version endpoint does not match expected Boat Score 2 development build"
          exit 1
