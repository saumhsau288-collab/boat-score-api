name: Deploy Boat Score 2 preview (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boat-score-2-preview-only
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Boat Score 2 development branch only
        uses: actions/checkout@v4
        with:
          ref: fix-boat-score-2-syntax-20261115
          persist-credentials: false
      - name: Verify isolated branch
        run: |
          test "$(git branch --show-current)" = "fix-boat-score-2-syntax-20261115"
          test -f worker.js
      - name: Validate Worker syntax
        run: node --input-type=module --check < worker.js
      - name: Diagnose official site connectivity from GitHub runner
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json, time
          sources = {
            "pc_racelist": "https://www.boatrace.jp/owpc/pc/race/racelist?rno=1&jcd=15&hd=20261116",
            "pc_schedule": "https://www.boatrace.jp/owpc/pc/race/index?hd=20261116",
            "sp_race": "https://www.boatrace.jp/owsp/sp/race/index?hd=20261116&jcd=15",
          }
          for name, url in sources.items():
            start=time.monotonic()
            try:
              req=urllib.request.Request(url,headers={"Accept":"text/html","User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=10) as response:
                sample=response.read(1024)
                result={"source":name,"httpStatus":response.status,"contentType":response.headers.get("Content-Type",""),"sampleBytes":len(sample),"elapsedMs":round((time.monotonic()-start)*1000)}
            except Exception as error:
              result={"source":name,"errorType":type(error).__name__,"error":str(error)[:150],"elapsedMs":round((time.monotonic()-start)*1000)}
            print(json.dumps(result,ensure_ascii=False),flush=True)
          print("Connectivity-only probe; HTTP success does not verify six racer records.")
          PY
      - name: Inspect official racelist HTML and six-boat candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, json, time, html
          url="https://www.boatrace.jp/owpc/pc/race/racelist?rno=1&jcd=15&hd=20261116"
          started=time.monotonic()
          try:
            request=urllib.request.Request(url,headers={"Accept":"text/html","User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(request,timeout=22) as response:
              raw=response.read(2_000_001)
              charset=response.headers.get_content_charset() or "utf-8"
              status=response.status
            if len(raw)>2_000_000:
              raise ValueError("HTML exceeds 2MB safety limit")
            page=raw.decode(charset,errors="replace")
            # Extract official racer registration numbers from links only.
            links=re.findall(r'<a\\b[^>]*href\\s*=\\s*["\\x27]([^"\\x27]+)["\\x27]',page,re.I)
            racer_ids=[]
            for link in links:
              link=html.unescape(link)
              if "racer" not in link.lower():continue
              params=urllib.parse.parse_qs(urllib.parse.urlsplit(link).query)
              for value in params.get("toban",[]):
                if re.fullmatch(r"[0-9]{4}",value):racer_ids.append(value)
            unique=list(dict.fromkeys(racer_ids))
            result={"source":"pc_racelist","httpStatus":status,"htmlBytes":len(raw),
              "elapsedMs":round((time.monotonic()-started)*1000),
              "racerLinkCount":len(racer_ids),"uniqueRacerIds":unique,
              "exactlySixUniqueRacerIds":len(unique)==6,
              "verified":False,
              "note":"Candidate identifiers only. Six boats must be matched to official lane rows before use."}
            print(json.dumps(result,ensure_ascii=False))
          except Exception as error:
            print(json.dumps({"source":"pc_racelist","errorType":type(error).__name__,
              "error":str(error)[:150],"elapsedMs":round((time.monotonic()-started)*1000),
              "verified":False},ensure_ascii=False))
          PY
      - name: Verify isolated preview version metadata
        run: |
          grep -F "sourceBranch:'fix-boat-score-2-syntax-20261115'" worker.js
          grep -F "app:'Boat Score 2 preview'" worker.js
      - name: Check Cloudflare credentials are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
      - name: Verify twelve independent methods before deployment
        run: |
          node --check generate-twelve-independent-methods.mjs
          node scripts/test-twelve-independent-preview.mjs
      - name: Deploy ONLY separate Boat Score 2 preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy worker.js --name boat-score-2-preview --compatibility-date 2026-11-01
      - name: Verify deployed twelve-method preview
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://boat-score-2-preview.saumh-sau-288.workers.dev"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$BASE/" -o preview.html &&
               curl --fail --silent --show-error --max-time 15 "$BASE/api/version" -o version.json; then
              break
            fi
            sleep 5
          done
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('preview.html','utf8');
          for(const id of ['predictTwelveMethods','twelveMethodStatus','twelveMethodOutput']){
            if(!html.includes('id="'+id+'"'))throw Error('Missing preview control: '+id);
          }
          if(!html.includes('/api/predict/independent-methods'))throw Error('Missing twelve-method API wiring');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          if(version.app!=='Boat Score 2 preview'||version.sourceBranch!=='fix-boat-score-2-syntax-20261115')throw Error('Unexpected preview deployment version');
          console.log('Preview UI and source branch verified');
          NODE
          status=$(curl --silent --show-error --max-time 15 -o invalid.json -w '%{http_code}' "$BASE/api/predict/independent-methods?date=invalid&venue=1&race=1")
          test "$status" = 400 || { echo "::error::Preview prediction API returned $status instead of 400"; exit 1; }
          node -e "if(require('./invalid.json').error!=='Invalid date, venue or race')process.exit(1)"
          echo 'Preview twelve-method API validation verified'
