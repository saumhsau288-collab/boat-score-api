name: Research saved base-stat readiness
on:
  push:
    branches: [research/st-course-holdout-20261121]
    paths:
      - scripts/describe-saved-base-stats-readiness.mjs
      - scripts/test-describe-saved-base-stats-readiness.mjs
      - .github/workflows/boat-score-2-saved-base-stats-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-assess-pre-race-evidence.mjs
      - run: node scripts/test-assess-research-source-bundle.mjs
      - run: node scripts/test-describe-research-source-readiness.mjs
      - run: node scripts/test-describe-saved-base-stats-readiness.mjs
