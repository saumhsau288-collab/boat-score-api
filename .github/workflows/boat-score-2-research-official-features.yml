name: Capture selected official racer features (research only)
on:
  workflow_dispatch:
    inputs:
      capture_date:
        description: 'Race date YYYYMMDD'
        required: true
        type: string
      venue:
        description: 'Venue number 1-24'
        required: true
        type: string
      race:
        description: 'Race number 1-12'
        required: true
        type: string
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone script
        run: |
          node --check scripts/capture-research-official-features.mjs
          node scripts/test-classify-official-capture-html.mjs
          node scripts/test-build-official-table-grid.mjs
          node scripts/test-identify-official-grouped-metric-columns.mjs
          node scripts/test-extract-grouped-official-six.mjs
          node scripts/test-select-research-official-metrics.mjs
          node scripts/test-describe-official-table-structure.mjs
          node scripts/test-run-saved-makulabo-research.mjs
          node scripts/test-evaluate-verified-makulabo-research.mjs
          node scripts/test-describe-makulabo-identity-review.mjs
          node scripts/test-describe-makulabo-finish-sample.mjs
          node scripts/test-summarize-makulabo-finish-comparison.mjs
          node scripts/test-compare-official-ability-and-frame-sample.mjs
          node scripts/test-identify-makulabo-sample-scope.mjs
          node scripts/test-build-makulabo-review-template.mjs
          node --check scripts/capture-research-makulabo-join.mjs
          node scripts/test-report-research-snapshot-readiness.mjs
          node scripts/test-evaluate-captured-research-snapshot.mjs
          node scripts/test-compare-research-score-phases.mjs
          node scripts/test-audit-saved-research-race.mjs
          node scripts/test-map-verified-finish-to-entry-course.mjs
          node scripts/test-compare-research-scores-to-finish.mjs
          node --check scripts/capture-official-daily-venue-candidates.mjs
          node scripts/test-classify-daily-venue-evidence.mjs
      - name: Probe official race schedule without claiming verification
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
        run: node scripts/capture-official-daily-venue-candidates.mjs
      - name: Capture source-proven six-racer metrics
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          CAPTURE_RACE: ${{ inputs.race }}
        run: node --experimental-default-type=module scripts/capture-research-official-features.mjs
      - name: Report official capture readiness without claiming predictions
        if: always()
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          CAPTURE_RACE: ${{ inputs.race }}
        run: |
          path="prediction-captures/research-official-${CAPTURE_DATE}-${CAPTURE_VENUE}-${CAPTURE_RACE}.json"
          if [ -f "$path" ]; then
            node scripts/report-research-snapshot-readiness.mjs "$path"
          else
            echo 'No official snapshot was saved; readiness unavailable.'
          fi
      - name: Research-only public Makulabo same-race join
        if: always()
        continue-on-error: true
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          CAPTURE_RACE: ${{ inputs.race }}
        run: node scripts/capture-research-makulabo-join.mjs
      - name: Save research snapshot, even when incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-official-features-${{ github.run_id }}
          path: |
            prediction-captures/research-official-*.json
            prediction-captures/research-makulabo-*.json
            prediction-captures/daily-venue-candidates-*.json
          retention-days: 90
          if-no-files-found: warn
