name: Capture selected official racer features (research only)
on:
  workflow_dispatch:
    inputs:
      capture_date:
        description: 'Race date YYYYMMDD (use a completed race, preferably a prior date)'
        required: true
        type: string
      venue:
        description: 'Venue number 1-24'
        required: true
        type: string
      race:
        description: 'Race number 1-12'
        required: true
        type: string
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show selected race in job summary
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          CAPTURE_RACE: ${{ inputs.race }}
        run: |
          printf '## Requested research race\\nDate: %s\\nVenue: %s\\nRace: %s\\n' "$CAPTURE_DATE" "$CAPTURE_VENUE" "$CAPTURE_RACE" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate selected date, venue and race
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          CAPTURE_RACE: ${{ inputs.race }}
        run: |
          node --input-type=module -e '
            const d=process.env.CAPTURE_DATE||"",v=process.env.CAPTURE_VENUE||"",r=process.env.CAPTURE_RACE||"";
            if(!/^20\d{6}$/.test(d)||!Number.isFinite(Date.parse(d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6,8)))||
               !/^\d{1,2}$/.test(v)||Number(v)<1||Number(v)>24||
               !/^\d{1,2}$/.test(r)||Number(r)<1||Number(r)>12){
              console.error("Invalid inputs: capture_date must be 8 digits YYYYMMDD (e.g. 20261120); venue 1-24; race 1-12.");
              process.exit(1);
            }
            const today=new Date().toISOString().slice(0,10).replaceAll("-","");
            if(d>=today)console.warn("WARNING: Same-day/future race selection. Official result may not be published yet; use a completed historical race for result verification.");
            console.log("Research selection validated:",d,"venue",Number(v),"race",Number(r));
          '
      - name: Validate standalone script
        run: |
          node --check scripts/capture-research-official-features.mjs
          node scripts/test-classify-official-capture-html.mjs
          node scripts/test-build-official-table-grid.mjs
          node scripts/test-identify-official-grouped-metric-columns.mjs
          node scripts/test-extract-grouped-official-six.mjs
          node scripts/test-select-research-official-metrics.mjs
          node scripts/test-describe-official-table-structure.mjs
          node scripts/test-run-saved-makulabo-research.mjs
          node scripts/test-evaluate-verified-makulabo-research.mjs
          node scripts/test-describe-makulabo-identity-review.mjs
          node scripts/test-describe-makulabo-finish-sample.mjs
          node scripts/test-summarize-makulabo-finish-comparison.mjs
          node scripts/test-compare-official-ability-and-frame-sample.mjs
          node scripts/test-compare-research-official-baseline.mjs
          node scripts/test-compare-research-baseline-with-result.mjs
          node scripts/test-cross-check-official-result-identity.mjs
          node scripts/test-capture-selected-research-result.mjs
          node scripts/test-audit-ability-start-course-evidence.mjs
          node scripts/test-classify-historical-prediction-review.mjs
          node scripts/test-summarize-historical-prediction-reviews.mjs
          node scripts/test-identify-makulabo-sample-scope.mjs
          node scripts/test-build-makulabo-review-template.mjs
          node --check scripts/capture-research-makulabo-join.mjs
          node scripts/test-report-research-snapshot-readiness.mjs
          node scripts/test-evaluate-captured-research-snapshot.mjs
          node scripts/test-compare-research-score-phases.mjs
          node scripts/test-audit-saved-research-race.mjs
          node scripts/test-map-verified-finish-to-entry-course.mjs
          node scripts/test-compare-research-scores-to-finish.mjs
          node --check scripts/capture-official-daily-venue-candidates.mjs
          node scripts/test-classify-daily-venue-evidence.mjs
      - name: Probe official race schedule without claiming verification
        continue-on-error: true
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
        run: node scripts/capture-official-daily-venue-candidates.mjs
      - name: Capture source-proven six-racer metrics
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          CAPTURE_RACE: ${{ inputs.race }}
        run: node --experimental-default-type=module scripts/capture-research-official-features.mjs
      - name: Report official capture readiness without claiming predictions
        if: always()
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          CAPTURE_RACE: ${{ inputs.race }}
        run: |
          venue_number=$((10#$CAPTURE_VENUE))
          path="prediction-captures/research-official-${CAPTURE_DATE}-${venue_number}-${CAPTURE_RACE}.json"
          if [ -f "$path" ]; then
            node scripts/report-research-snapshot-readiness.mjs "$path"
          else
            echo 'No official snapshot was saved; readiness unavailable.'
          fi
      - name: Research-only public Makulabo same-race join
        if: always()
        continue-on-error: true
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          CAPTURE_RACE: ${{ inputs.race }}
        run: node scripts/capture-research-makulabo-join.mjs
      - name: Research-only official result identity check
        if: always()
        continue-on-error: true
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          CAPTURE_RACE: ${{ inputs.race }}
        run: |
          venue_number=$((10#$CAPTURE_VENUE))
          input="prediction-captures/research-official-${CAPTURE_DATE}-${venue_number}-${CAPTURE_RACE}.json"
          output="prediction-captures/research-result-${CAPTURE_DATE}-${venue_number}-${CAPTURE_RACE}.json"
          if [ -f "$input" ]; then
            node scripts/capture-selected-research-result.mjs "$input" "$output"
          else
            echo 'Official snapshot missing; result identity check held.'
          fi
      - name: Summarize research capture status
        if: always()
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          CAPTURE_RACE: ${{ inputs.race }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=process.env.CAPTURE_DATE||'',v=Number(process.env.CAPTURE_VENUE),r=Number(process.env.CAPTURE_RACE);
          const base='prediction-captures/';
          const official=base+`research-official-${d}-${v}-${r}.json`;
          const result=base+`research-result-${d}-${v}-${r}.json`;
          const load=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const a=load(official),b=load(result);
          const lines=['## Research-only race capture',`Selection: ${d} / venue ${v} / race ${r}`,
            `Official six-racer capture: ${a?.status??'missing'}`,
            `Result retrieval: ${b?.status??'missing'}`,
            `Result reason: ${b?.reason??'not available'}`,
            `Result parser: ${b?.parsedStatus??'not available'}`,
            `Parsed podium: ${Array.isArray(b?.parsedPodium)?b.parsedPodium.join('-'):'not verified'}`,
            'Calibration: not authorized (research only)'];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          NODE
      - name: Describe official component score against parsed podium (research only)
        if: always()
        env:
          CAPTURE_DATE: ${{ inputs.capture_date }}
          CAPTURE_VENUE: ${{ inputs.venue }}
          CAPTURE_RACE: ${{ inputs.race }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='prediction-captures/';
          const id=[process.env.CAPTURE_DATE,Number(process.env.CAPTURE_VENUE),Number(process.env.CAPTURE_RACE)].join('-');
          const load=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const mak=load(base+'research-makulabo-'+id+'.json');
          const result=load(base+'research-result-'+id+'.json');
          const rows=mak?.officialComponentComparison?.rows;
          const podium=result?.parsedPodium;
          let note='Comparison held: six official component scores and identity-matched podium required.';
          if(mak?.officialComponentComparison?.status==='research_official_component_comparison' &&
             result?.status==='official_racelist_result_identity_matched' &&
             Array.isArray(rows)&&rows.length===6&&Array.isArray(podium)&&podium.length===3 &&
             rows.every(x=>Number.isFinite(x.officialComponentScore85)) &&
             new Set(rows.map(x=>x.boat)).size===6 &&
             podium.every(b=>rows.some(x=>x.boat===b))){
            const rank=[...rows].sort((a,b)=>b.officialComponentScore85-a.officialComponentScore85||a.boat-b.boat);
            const predicted=rank.map(x=>x.boat);
            note='Official-only 85-point ranking: '+predicted.join('-')+
              '; parsed result podium: '+podium.join('-')+
              '; top-score boat won: '+(predicted[0]===podium[0])+
              '; top-3 set overlap: '+rank.slice(0,3).filter(x=>podium.includes(x.boat)).length+'/3.';
          }
          const message='## Retrospective component comparison\n'+note+
            '\nNot the full Boat Score 2 score. Not an authenticated pre-race forecast; no automatic calibration.\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,message);
          console.log(note);
          NODE
      - name: Save research snapshot, even when incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-official-features-${{ github.run_id }}
          path: |
            prediction-captures/research-official-*.json
            prediction-captures/research-makulabo-*.json
            prediction-captures/research-result-*.json
            prediction-captures/daily-venue-candidates-*.json
          retention-days: 90
          if-no-files-found: warn
