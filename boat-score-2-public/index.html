<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boat Score 2</title><style>body{font:16px system-ui;background:#f1f5f9;color:#172334;margin:0}main{max-width:560px;margin:auto;padding:20px}section{background:white;padding:20px;border-radius:12px}label{display:block;margin:16px 0 6px}select,input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #9ca3af;border-radius:8px}button{background:#164e63;color:white;margin-top:18px}p{line-height:1.6}</style><main><h1>Boat Score 2</h1><p>公式レース情報閲覧</p><section><label for="date">開催日</label><input type="date" id="date"><label for="venue">競艇場</label><select id="venue"></select><label for="race">レース</label><select id="race"></select><button id="open">公式出走表を開く</button><p>公式サイトで開催状況・出走表をご確認ください。この画面はデータ閲覧用の試作版です。自動取得は未接続です。</p></section></main><script>const names='桐生 戸田 江戸川 平和島 多摩川 浜名湖 蒲郡 常滑 津 三国 びわこ 住之江 尼崎 鳴門 丸亀 児島 宮島 徳山 下関 若松 芦屋 福岡 唐津 大村'.split(' ');const el=id=>document.getElementById(id);names.forEach((n,i)=>el('venue').add(new Option(n,String(i+1).padStart(2,'0'))));for(let i=1;i<=12;i++)el('race').add(new Option(i+'R',i));el('date').value=new Date(Date.now()+9*3600000).toISOString().slice(0,10);el('open').onclick=()=>{if(!el('date').value)return;location.href='https://www.boatrace.jp/owpc/pc/race/racelist?'+new URLSearchParams({hd:el('date').value.replaceAll('-',''),jcd:el('venue').value,rno:el('race').value})};</script></html>
